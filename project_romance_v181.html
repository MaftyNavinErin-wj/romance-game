<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国·苍生问策 v1.6.7</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>:root {
  --wei:#1a5f8a; --shu:#1a7a3a; --wu:#a82a1a; --nanman:#8b6914;
  --gold:#6b5530; --gold-l:#8a7040;
  --ink:#2c2416; --ink-l:#5c4a32; --ink-ll:#8a7a60;
  --border:rgba(80,65,40,0.18);
  --panel:rgba(245,238,225,0.97);
  --paper:#f5eee1; --paper-warm:#ede4d0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Noto Serif SC',serif;height:100vh;overflow:hidden}
.app{display:grid;grid-template-rows:50px 1fr 42px;height:100vh}
.main{display:grid;grid-template-columns:220px 1fr 430px;overflow:hidden}

/* HEADER */
header{background:rgba(235,225,205,.98);border-bottom:1px solid rgba(80,65,40,.25);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.logo{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:19px;font-weight:900;color:var(--ink);letter-spacing:6px;text-shadow:none}
.logo-sub{font-size:10px;color:var(--ink-ll);letter-spacing:2px;margin-left:10px}
.hdr-c{display:flex;align-items:center;gap:14px}
.turn-d{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);letter-spacing:2px}
.s-tag{padding:2px 9px;border:1px solid;font-family:'Noto Serif SC',serif;font-size:11px;letter-spacing:1px}
.btn-turn{padding:6px 16px;background:linear-gradient(135deg,#6b5530,#4a3820);border:none;color:var(--paper);font-family:'Noto Serif SC',serif;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.btn-turn:hover{background:linear-gradient(135deg,#8a7040,#6b5530)}
.btn-turn:disabled{opacity:.4;cursor:not-allowed}

/* PANELS */
.panel{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:13px}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:rgba(80,65,40,.25)}
.rp{border-right:none;border-left:1px solid var(--border)}
.pt{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:10px;color:var(--ink-l);letter-spacing:3px;padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:10px}
.sec{font-size:9px;color:var(--ink-ll);letter-spacing:2px;margin:9px 0 5px;text-transform:uppercase}

/* DUEL (单挑) */
.bc-duel-section{border:1px solid rgba(92,74,50,.25);background:rgba(80,65,40,.04);padding:10px 14px;margin-top:2px}
.bc-duel-title{font-size:10px;color:rgba(92,74,50,.65);letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.bc-duel-gen-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.bc-duel-gen{padding:4px 10px;border:1px solid rgba(80,65,40,.18);cursor:pointer;font-size:11px;font-family:'Noto Serif SC',serif;transition:all .15s;color:rgba(44,36,22,.65)}
.bc-duel-gen:hover{border-color:var(--ink-l);color:var(--ink);background:rgba(80,65,40,.06)}
.bc-duel-gen.sel{border-color:var(--ink-l);color:var(--ink);background:rgba(80,65,40,.08)}
.bc-duel-gen.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.bc-duel-hint{font-size:9px;color:rgba(92,74,50,.40);line-height:1.7}

/* DUEL RESULT in battle report */
.br-duel{border:1px solid rgba(92,74,50,.3);background:rgba(80,65,40,.05);padding:10px 14px;margin-bottom:10px}
.br-duel-title{font-size:10px;color:rgba(92,74,50,.65);letter-spacing:2px;margin-bottom:8px}
.br-duel-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
.br-duel-name{font-family:'Noto Serif SC',serif;font-weight:700;min-width:60px}
.br-duel-war{font-size:9px;color:rgba(92,74,50,.55);margin-left:2px}
.br-duel-vs{font-size:11px;color:rgba(92,74,50,.40);margin:0 4px}
.br-duel-result{padding:2px 8px;font-size:10px;font-family:'Noto Serif SC',serif;letter-spacing:1px}
.br-duel-result.win{background:rgba(26,122,58,.1);border:1px solid rgba(26,122,58,.3);color:#1a7a3a}
.br-duel-result.lose{background:rgba(192,48,48,.1);border:1px solid rgba(192,48,48,.3);color:#c03030}
.br-duel-result.draw{background:rgba(80,65,40,.08);border:1px solid rgba(80,65,40,.2);color:rgba(92,74,50,.7)}
.br-duel-morale{font-size:9px;margin-left:auto}
.br-duel-narrative{font-size:10px;color:rgba(44,36,22,.55);line-height:1.7;font-style:italic;margin-top:6px;padding-top:6px;border-top:1px solid rgba(80,65,40,.08)}
/* ═══ TITLE SCREEN & SAVE/LOAD ═══ */
.title-screen{position:fixed;inset:0;background:#ede4d0;z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif}
.title-screen .ts-title{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:52px;color:var(--ink);letter-spacing:14px;margin-bottom:4px;text-shadow:0 2px 8px rgba(44,36,22,.08)}
.title-screen .ts-sub{font-size:11px;color:var(--ink-ll);letter-spacing:4px;margin-bottom:52px}
.title-screen .ts-menu{display:flex;flex-direction:column;gap:14px;align-items:center}
.ts-btn{width:200px;padding:13px 0;border:1px solid rgba(80,65,40,.25);background:rgba(255,252,245,.7);color:var(--ink);font-family:'Noto Serif SC',serif;font-size:14px;font-weight:700;letter-spacing:4px;cursor:pointer;transition:all .25s;text-align:center}
.ts-btn:hover{background:rgba(80,65,40,.08);border-color:rgba(80,65,40,.45);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.ts-btn:disabled{opacity:.35;cursor:not-allowed;background:rgba(255,252,245,.4)}
.ts-btn.primary{background:linear-gradient(135deg,rgba(107,85,48,.12),rgba(107,85,48,.06));border-color:rgba(80,65,40,.35)}
.ts-btn.primary:hover{background:linear-gradient(135deg,rgba(107,85,48,.2),rgba(107,85,48,.1));border-color:rgba(80,65,40,.55)}

/* Scenario Select */
.scenario-screen{position:fixed;inset:0;background:#ede4d0;z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif}
.scenario-card{border:1px solid rgba(80,65,40,.2);background:rgba(255,252,245,.7);padding:28px 26px;width:320px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.scenario-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.scenario-card:hover{border-color:rgba(80,65,40,.45);background:rgba(255,252,245,.95);box-shadow:0 4px 20px rgba(0,0,0,.08)}
.scenario-card .sc-badge{position:absolute;top:10px;right:12px;font-size:8px;color:var(--ink-ll);letter-spacing:1px;border:1px solid rgba(80,65,40,.15);padding:1px 6px}

/* Save/Load Panel */
.save-overlay{position:fixed;inset:0;background:rgba(20,16,10,.55);z-index:700;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;opacity:0;transition:opacity .2s}
.save-overlay.show{opacity:1}
.save-panel{background:var(--paper);border:1px solid rgba(80,65,40,.3);padding:28px 30px;min-width:420px;max-width:480px;box-shadow:0 8px 40px rgba(0,0,0,.15);position:relative}
.save-panel .sp-title{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:16px;color:var(--ink);letter-spacing:4px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.save-slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgba(80,65,40,.12);margin-bottom:8px;cursor:pointer;transition:all .2s;background:rgba(255,252,245,.5)}
.save-slot:hover{border-color:rgba(80,65,40,.3);background:rgba(80,65,40,.04)}
.save-slot.sel{border-color:var(--ink-l);background:rgba(80,65,40,.06)}
.save-slot .slot-num{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:18px;color:var(--ink-ll);width:28px;text-align:center}
.save-slot .slot-info{flex:1}
.save-slot .slot-fac{font-size:12px;font-weight:700;letter-spacing:1px}
.save-slot .slot-detail{font-size:9px;color:var(--ink-ll);margin-top:2px}
.save-slot .slot-empty{font-size:11px;color:rgba(92,74,50,.35);font-style:italic}
.save-slot .slot-time{font-size:8px;color:rgba(92,74,50,.3);margin-left:auto;white-space:nowrap}
.sp-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.sp-actions button{padding:8px 18px;font-family:'Noto Serif SC',serif;font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;border:1px solid rgba(80,65,40,.25);background:rgba(255,252,245,.7);color:var(--ink)}
.sp-actions button:hover{border-color:rgba(80,65,40,.45);background:rgba(80,65,40,.08)}
.sp-actions button.danger{color:#c03030;border-color:rgba(192,48,48,.3)}
.sp-actions button.danger:hover{background:rgba(192,48,48,.06)}
.sp-actions button:disabled{opacity:.35;cursor:not-allowed}
.btn-save-hdr{padding:4px 10px;background:none;border:1px solid rgba(80,65,40,.2);color:var(--ink-l);font-family:'Noto Serif SC',serif;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;margin-right:4px}
.btn-save-hdr:hover{border-color:rgba(80,65,40,.4);color:var(--ink);background:rgba(80,65,40,.05)}
.btn-ai-toggle{padding:4px 10px;background:none;border:1px solid rgba(80,65,40,.2);color:var(--ink-l);font-family:'Noto Serif SC',serif;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;margin-right:4px;border-radius:2px}
.btn-ai-toggle:hover{border-color:rgba(80,65,40,.4);background:rgba(80,65,40,.05)}
.btn-ai-toggle.ai-on{background:rgba(46,120,180,.15);border-color:rgba(46,120,180,.5);color:#1a6fa0}

#stackPicker{position:fixed;z-index:650;background:rgba(245,238,225,.98);border:1px solid var(--ink-l);
  min-width:180px;padding:6px 0;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none}
#stackPicker::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-bottom:5px solid var(--ink-l)}
.sp-header{font-family:'Noto Serif SC',serif;font-size:9px;color:rgba(92,74,50,.55);letter-spacing:2px;
  padding:4px 12px 6px;border-bottom:1px solid rgba(80,65,40,.12);margin-bottom:2px}
.sp-row{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;transition:background .12s}
.sp-row:hover{background:rgba(80,65,40,.06)}
.sp-row.sel{background:rgba(80,65,40,.08)}
.sp-flag{width:10px;height:10px;border-radius:1px;flex-shrink:0}
.sp-name{font-family:'Noto Serif SC',serif;font-size:11px;font-weight:700}
.sp-status{font-size:8px;padding:1px 4px;border:1px solid;border-radius:1px;margin-left:4px}

/* FACTION CARDS */
.fc{border:1px solid var(--border);padding:9px 11px;margin-bottom:7px;cursor:pointer;position:relative;overflow:hidden;transition:all .2s;background:rgba(255,252,245,.6)}
.fc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.fc.wei::before{background:var(--wei)}.fc.shu::before{background:var(--shu)}.fc.wu::before{background:var(--wu)}.fc.nanman::before{background:var(--nanman)}
.fc:hover{background:rgba(80,65,40,.06);border-color:rgba(80,65,40,.3)}
.fc.active{background:rgba(80,65,40,.08);border-color:var(--ink-l)}
.fc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.fc-n{font-family:'Noto Serif SC',serif;font-weight:700;font-size:14px}
.fc-n.wei{color:var(--wei)}.fc-n.shu{color:var(--shu)}.fc-n.wu{color:var(--wu)}.fc-n.nanman{color:var(--nanman)}
.fc-r{font-size:10px;color:var(--ink-ll)}
.fc-s{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.sr{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(44,36,22,.55)}
.sr-v{margin-left:auto;color:var(--ink);font-size:10px}
.sr-v.warn{color:#b87a10}.sr-v.danger{color:#c03030}
/* 新增：势力卡底部净值行 */
.fc-netrow{display:flex;gap:8px;margin-top:5px;padding-top:5px;border-top:1px solid rgba(80,65,40,.1);font-size:9px}
.fc-netitem{display:flex;align-items:center;gap:3px}
.fc-netlabel{color:var(--ink-ll)}
/* ★ v168: 朝堂状态行 */
.fc-court{margin-top:4px;padding:3px 6px;font-size:9px;border-radius:2px;letter-spacing:.5px;cursor:pointer}
.fc-court.court-ok{color:#5a8a5a;background:rgba(90,138,90,.06)}
.fc-court.court-warn{color:#b8860b;background:rgba(184,134,11,.06)}
.fc-court.court-danger{color:#c03030;background:rgba(192,48,48,.06)}
/* ★ v168: 派系Tab内政概览 */
.court-narrative{color:var(--ink-l);font-size:11px;line-height:1.6;padding:8px 10px;background:rgba(255,252,245,.5);border-left:2px solid rgba(180,160,120,.3);margin-bottom:10px;letter-spacing:.3px}
.court-warn-item{display:flex;align-items:flex-start;gap:6px;padding:5px 8px;margin-bottom:4px;border-radius:3px;font-size:11px;line-height:1.5}
.court-warn-item.cw-red{background:rgba(192,48,48,.05);border:1px solid rgba(192,48,48,.15)}
.court-warn-item.cw-yellow{background:rgba(184,134,11,.05);border:1px solid rgba(184,134,11,.15)}
.court-warn-item.cw-green{background:rgba(90,138,90,.05);border:1px solid rgba(90,138,90,.15)}
.court-warn-item .cw-text{flex:1;color:var(--ink-l)}
.court-warn-item .cw-action{font-size:10px;color:rgba(92,74,50,.5);cursor:pointer;white-space:nowrap;text-decoration:underline;text-decoration-style:dotted;align-self:center}
.court-warn-item .cw-action:hover{color:var(--ink)}
.court-vacant{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:11px;border-bottom:1px solid rgba(80,65,40,.06)}
.court-vacant .cv-label{color:var(--ink-l)}
.court-vacant .cv-link{font-size:10px;color:rgba(92,74,50,.45);cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.court-vacant .cv-link:hover{color:var(--ink)}

/* JUN (COMMANDERY) LIST */
.jun-item{margin-bottom:12px}
.jun-hd{font-family:'Noto Serif SC',serif;font-size:11px;color:var(--ink-l);letter-spacing:1px;padding:4px 6px;border-left:2px solid var(--ink-ll);margin-bottom:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.jun-hd:hover{color:var(--ink)}
.jun-city{font-size:10px;padding:3px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;border-radius:1px}
.jun-city:hover{background:rgba(80,65,40,.06);color:var(--ink)}
.city-tags-mini{display:flex;gap:3px;margin-left:auto;align-items:center}
.tag-mini{font-size:10px;padding:1px 4px;border:1px solid rgba(80,65,40,.15);color:var(--ink-l);border-radius:2px;cursor:default;position:relative;line-height:1.2}
.tag-mini:hover{border-color:rgba(80,65,40,.3);background:rgba(80,65,40,.04)}
.tag-mini:hover .tag-mini-tip{display:block}
.tag-mini-tip{display:none;position:absolute;bottom:calc(100% + 4px);right:0;background:rgba(245,238,225,.99);border:1px solid var(--ink-l);padding:4px 7px;font-size:9px;color:var(--ink);white-space:nowrap;z-index:100;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.1);border-radius:2px}
.tag-elite{font-size:10px;padding:1px 4px;border:1px solid rgba(168,42,26,.25);color:#a82a1a;border-radius:2px;cursor:default;position:relative;line-height:1.2;background:rgba(168,42,26,.04)}
.tag-elite:hover{border-color:rgba(168,42,26,.4);background:rgba(168,42,26,.08)}
.tag-elite:hover .tag-mini-tip{display:block}

/* MAP */
.map-wrap{position:relative;background:#e8dfc8;overflow:hidden}
.map-svg{width:100%;height:100%}
.road{stroke:rgba(120,90,40,.15);stroke-width:1;fill:none;stroke-dasharray:3,4}
.city-g{cursor:pointer}
.city-g:hover .cc{filter:brightness(1.6)}
.city-g.sel .cc{filter:brightness(2) drop-shadow(0 0 5px currentColor)}
.cc{transition:all .2s}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:11px}
.tab{padding:5px 11px;font-size:10px;color:var(--ink-ll);cursor:pointer;font-family:'Noto Serif SC',serif;letter-spacing:1px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab:hover{color:var(--ink-l)}
.tab.active{color:var(--ink);border-bottom-color:var(--ink-l)}

/* CITY DETAIL */
.cd-name{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:16px;font-weight:700;margin-bottom:2px;color:var(--ink)}
.cd-jun{font-size:10px;color:var(--ink-ll);margin-bottom:8px}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.tag-badge{display:flex;align-items:center;gap:3px;padding:3px 7px;border:1px solid;font-size:10px;font-family:'Noto Serif SC',serif;border-radius:1px;cursor:default;position:relative}
.tag-badge:hover .tag-tip{display:block}
.tag-tip{display:none;position:absolute;bottom:calc(100% + 4px);left:0;background:rgba(245,238,225,.99);border:1px solid var(--ink-l);padding:5px 8px;font-size:9px;color:var(--ink);white-space:nowrap;z-index:100;pointer-events:none;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.bar-wrap{margin-bottom:7px}
.bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-ll);margin-bottom:2px}
.bar{height:4px;background:rgba(80,65,40,.1)}
.bar-fill{height:100%;transition:width .5s}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:9px}
.ri{background:rgba(255,252,245,.5);border:1px solid var(--border);padding:6px 8px}
.ri-n{font-size:9px;color:var(--ink-ll);letter-spacing:1px;margin-bottom:2px}
.ri-v{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--ink)}
.ri-d{font-size:9px;margin-top:1px}
.pos{color:#1a7a3a}.neg{color:#c03030}.neuc{color:#8a6a20}

/* 粮食状态框 - 新版"可撑旬数"判断 */
.fs-ok  {padding:7px 9px;border:1px solid rgba(26,122,58,.35); background:rgba(26,122,58,.06); color:#1a7a3a;font-size:11px;font-family:'Noto Serif SC',serif;margin-bottom:9px}
.fs-warn{padding:7px 9px;border:1px solid rgba(184,122,16,.35);background:rgba(184,122,16,.06);color:#8a6a10;font-size:11px;font-family:'Noto Serif SC',serif;margin-bottom:9px}
.fs-crit{padding:7px 9px;border:1px solid rgba(192,48,48,.35); background:rgba(192,48,48,.06);color:#c03030;font-size:11px;font-family:'Noto Serif SC',serif;margin-bottom:9px}

/* 存粮进度条 */
.storage-bar-wrap{margin-bottom:9px}
.storage-bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-ll);margin-bottom:3px}
.storage-bar{height:6px;background:rgba(80,65,40,.1);border-radius:1px}
.storage-bar-fill{height:100%;transition:width .5s;border-radius:1px}

/* BUILDINGS */
.bld-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:9px}
.bld{border:1px solid var(--border);padding:5px 7px;cursor:pointer;transition:all .2s;position:relative;background:rgba(255,252,245,.4)}
.bld:hover{border-color:rgba(80,65,40,.35);background:rgba(80,65,40,.05)}
.bld.maxed{border-color:var(--ink-ll);background:rgba(80,65,40,.07)}
.bld.building{border-color:rgba(26,95,138,.4);background:rgba(26,95,138,.06)}
.bld.locked{opacity:.35;cursor:not-allowed}
.bld-n{font-size:10px;color:var(--ink);margin-bottom:2px}
.bld-lv{font-size:9px;color:var(--ink-ll)}
.bld-prog{position:absolute;bottom:0;left:0;height:2px;background:var(--ink-l);transition:width .3s}

/* ACTIONS */
.act-btn{width:100%;padding:7px;background:transparent;border:1px solid var(--border);color:var(--ink);font-family:'Noto Serif SC',serif;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .2s;margin-bottom:4px;text-align:left;display:flex;align-items:center;gap:6px}
.act-btn:hover{background:rgba(80,65,40,.06);border-color:var(--ink-ll);color:var(--ink)}
.act-btn:disabled{opacity:.3;cursor:not-allowed}

function log(msg,type=''){
  G.logs.unshift({msg,type});
  if(G.logs.length>8) G.logs.pop();
  const el=document.getElementById('elog');
  el.innerHTML=G.logs.slice(0,5).map((e,i)=>`<span class="ev ${e.type}" style="opacity:${1-i*.18}">${e.msg}</span>`).join('<span style="color:rgba(80,65,40,.12);margin:0 6px">·</span>');
}

function updateFacStats(){
  Object.keys(G.factions).forEach(fid=>{
    const cities=Object.values(G.cities).filter(c=>c.fac===fid);
    G.factions[fid].cityCount=cities.length;
    const garrisonTotal=cities.reduce((s,c)=>s+c.garrison,0);
    const fieldTotal=G.units.filter(u=>u.fac===fid).reduce((s,u)=>s+getUnitTroops(u),0);
    G.factions[fid].totalTroops=garrisonTotal+fieldTotal;
    G.factions[fid].totalPop=cities.reduce((s,c)=>s+c.pop,0);
  });
}

/** v85: 全局键盘事件处理（body onkeydown） */
function handleKeyDown(e){
  // Enter/Space → 关闭当前战报弹窗
  if(e.key === 'Enter' || e.key === ' '){
    const bm = document.getElementById('battleModal');
    if(bm && bm.style.display === 'flex'){ e.preventDefault(); closeBattleModal(); return; }
  }
  // Escape → 关闭各种弹窗
  if(e.key === 'Escape'){
    const bm = document.getElementById('battleModal');
    if(bm && bm.style.display === 'flex'){ closeBattleModal(); return; }
    const bcm = document.getElementById('battleConfirmModal');
    if(bcm && bcm.style.display === 'flex') return; // 战前确认不允许Escape跳过
    const gm = document.getElementById('genericModal');
    if(gm && gm.style.display !== 'none'){ closeModal(); return; }
    const rm = document.getElementById('recruitModal');
    if(rm && rm.style.display === 'flex'){ closeRecruitModal(); return; }
  }
}

// ★ v99: 即时行军核心——逐格动画 + 迷雾揭开 + 战斗检测
async function _execInstantMarch(unit, walkPath, apLeftAfter, remainPath, attackIntent){
  if(_marchAnimating) return;
  _marchAnimating = true;
  const btn = document.getElementById('btnTurn');
  if(btn) btn.disabled = true;

  let interrupted = false; // ★ 声明在try外部，供finally后的逻辑访问
  let ambushed = false;   // ★ v100: 伏击中断标记（跳过后续战斗检测）

  try { // ★ try-finally确保动画锁一定释放

  // 收集动画前的可见hex集合（用于增量迷雾揭开）
  let prevVisibleKeys = _collectPlayerVisibleKeys();
  const troopType = getMainTroopType(unit);

  for(let i = 0; i < walkPath.length; i++){
    const next = walkPath[i];
    const nextKey = hkey(next.col, next.row);
    const _imCurWater = isWaterHex(unit.hq, unit.hr); // ★ v138
    const _imNextWater = isWaterHex(next.col, next.row); // ★ v138
    const cost = getHexMoveCost(next.col, next.row, troopType, _imCurWater);

    // AP不足检查（安全兜底）
    if(unit._apRemaining < cost && cost < 999){
      unit.hexPath = walkPath.slice(i).concat(remainPath);
      unit.status = remainPath.length > 0 || walkPath.length - i > 0 ? 'march' : 'halt';
      interrupted = true;
      break;
    }

    // ── 敌方城市 → 围城（优先于敌军阻挡检测，城市hex上的敌军=守军）──
    const cityIdHere = HEX_CITY[nextKey];
    if(cityIdHere){
      const destCity = G.cities[cityIdHere];
      if(destCity && destCity.fac !== unit.fac && destCity.fac !== 'none' && isHostile(unit.fac, destCity.fac)){
        // ★ v162fix: 水上部队不可直接围城，需先上岸
        if(isWaterHex(unit.hq, unit.hr)){
          unit.hexPath = walkPath.slice(i).concat(remainPath);
          unit.status = 'halt';
          log('⚓ '+unit.squads[0]?.genName+'部 尚在水域，无法直接围城，需先上岸', 'battle');
          showNotif('水上部队无法直接围城，需先登陆','warn');
          interrupted = true;
          break;
        }
        unit.status = 'siege';
        unit.siegeTarget = cityIdHere;
        unit._siegeTurnCount = 0;
        unit.hexPath = [];
        unit.movePath = [cityIdHere];
        log('🏰 '+unit.squads[0]?.genName+'部 兵临'+destCity.name+'城下，开始围城', 'battle');
        _pendingSiegeArrival = { unitId: unit.id, cityId: cityIdHere };
        interrupted = true;
        break;
      }
    }

    // ── 敌军阻挡（野外hex，非城市hex）──
    const hasHostile = G.units.some(u =>
      u.id !== unit.id && u.hq === next.col && u.hr === next.row &&
      u.fac !== unit.fac && isHostile(unit.fac, u.fac) && getUnitTroops(u) > 0
    );
    if(hasHostile){
      unit.hexPath = walkPath.slice(i).concat(remainPath);
      unit.status = 'halt';
      interrupted = true;
      break;
    }

    // ── v103: 非己方非敌对城市 → 不进入，halt ──
    if(cityIdHere){
      const ncCity = G.cities[cityIdHere];
      if(ncCity && ncCity.fac !== unit.fac && ncCity.fac !== 'none'){
        unit.hexPath = walkPath.slice(i).concat(remainPath);
        unit.status = 'halt';
        const gname = unit.squads[0]?.genName||'?';
        log('⛺ '+gname+'部 抵达'+ncCity.name+'城外（非己方领土，就地驻扎）', 'economy');
        interrupted = true;
        break;
      }
    }

    // ── v103→v112: 堆叠检测——野外hex友军可穿越但不可停留；城市hex同势力可共存 ──
    {
      const occupied = G.units.some(u => u.id !== unit.id && u.hq === next.col && u.hr === next.row);
      if(occupied){
        const nxCityId = HEX_CITY[nextKey];
        const nxCity = nxCityId ? G.cities[nxCityId] : null;
        if(nxCity && nxCity.fac === unit.fac){
          // 己方城市：允许进入
        } else {
          // 野外hex：友军可穿越，但不可停留
          const isFriendly = G.units.some(u =>
            u.id !== unit.id && u.hq === next.col && u.hr === next.row && u.fac === unit.fac
          );
          if(isFriendly) {
            const isLastStep = (i === walkPath.length - 1) && remainPath.length === 0;
            if(isLastStep) {
              // 终点被友军占→停在上一格
              unit.hexPath = walkPath.slice(i).concat(remainPath);
              unit.status = 'halt';
              interrupted = true;
              break;
            }
            // 非终点→穿越（继续走，不break）
          } else {
            // 非友军占位→堵住
            unit.hexPath = walkPath.slice(i).concat(remainPath);
            unit.status = 'halt';
            interrupted = true;
            break;
          }
        }
      }
    }

    // ── 实际移动到该格 ──
    unit.hq = next.col; unit.hr = next.row;
    unit._apRemaining = Math.max(0, (unit._apRemaining || 0) - cost);

    // ★ v138: 水陆转换——入水或上岸时AP清零，本旬停止移动
    if(_imCurWater !== _imNextWater) {
      unit._apRemaining = 0;
      if(i < walkPath.length - 1 || remainPath.length > 0) {
        unit.hexPath = walkPath.slice(i + 1).concat(remainPath);
        unit.status = 'march'; // 保留路径下旬继续
      }
      // 继续执行本格的渲染/迷雾/伏击检测，但循环结束后break
    }

    // 捕获旧迷雾状态（用于动画遮罩颜色）
    const pFogRef = G.fog?.[G.playerFac] || {};
    const oldFogLevels = {};
    // 记录即将被揭开区域的旧fog等级
    const unitVisionKeys = fogBFS(unit.hq, unit.hr, getUnitVisionRadius(unit));
    unitVisionKeys.forEach(k => { if(!prevVisibleKeys.has(k)) oldFogLevels[k] = pFogRef[k] ?? FOG_UNEXPLORED; });

    // 更新迷雾
    updateFog(G.playerFac);
    invalidateFogCache();
    invalidateCityCache(); // ★ v153fix: 新城市进入视野时图标颜色需同步刷新

    // 计算新揭开的hex
    const newVisibleKeys = _collectPlayerVisibleKeys();
    const revealedKeys = [];
    for(const k of newVisibleKeys){
      if(!prevVisibleKeys.has(k)) revealedKeys.push(k);
    }
    prevVisibleKeys = newVisibleKeys;

    // 渲染动画帧
    renderMap();
    renderUnitsOnly();

    // 迷雾揭开动画（传入旧fog等级以选择正确遮罩颜色）
    if(revealedKeys.length > 0) _animateFogReveal(revealedKeys, oldFogLevels);

    // 到达己方/友方城市
    // ★ v123fix: 途经不停，只有终点才garrison
    if(cityIdHere){
      const city = G.cities[cityIdHere];
      if(city && (city.fac === unit.fac || city.fac === 'none' || !isHostile(unit.fac, city.fac))){
        const isDestination = (i === walkPath.length - 1) && remainPath.length === 0;
        if(isDestination){
          unit.status = 'garrison';
          unit.hexPath = [];
          unit.movePath = [cityIdHere];
          interrupted = true;
          await sleep(120);
          break;
        }
        // 途经己方城市：不中断，继续行军
      }
    }

    // ── 伏击检测（走到伏兵附近） ──
    const ambusher = G.units.find(u =>
      u.fac !== unit.fac && isHostile(u.fac, unit.fac) &&
      u.status === 'ambush' &&
      unitsContact(unit, u) && getUnitTroops(u) > 0
    );
    if(ambusher){
      unit.hexPath = walkPath.slice(i+1).concat(remainPath);
      unit.status = 'halt';
      interrupted = true;
      ambushed = true; // ★ v100: 标记伏击中断
      // AI伏击玩家 → 直接结算
      const ambTerrain = getTerrainAt(ambusher.hq, ambusher.hr);
      const aiUseFire = aiDecideFireAttack([ambusher],[unit],ambTerrain,ambusher.fac);
      // ★ v175: 战前位置快照（结算前的 hq/hr）
      const _ambushPosSnap = {};
      [ambusher, unit].forEach(u => { _ambushPosSnap[u.id] = { hq: u.hq, hr: u.hr }; });
      const report = resolveAmbush([ambusher],[unit],ambTerrain,aiUseFire);
      const nodeLabel = G.cities[getUnitNodeId(ambusher)]?.name || '野外';
      report.node = nodeLabel;
      _battleReports.push(report);
      log(`🎯 ${ambusher.squads[0]?.genName||'?'}部 于${nodeLabel}设伏，${report.ambushHit?'奇袭得手！':'伏兵被识破！'}`, 'battle');
      // ★ v175: 直接 await 动画（本函数已在玩家交互的 async 链中，mapRoot 稳定存在）
      try {
        await _playAmbushBattleAnim(report, [ambusher], [unit], _ambushPosSnap);
      } catch(e){ console.error('[AmbushAnim] march trigger failed:', e); }
      await sleep(120);
      break;
    }

    // 每格动画间隔
    await sleep(140);

    // ★ v138: 水陆转换后中断本旬移动
    if(_imCurWater !== _imNextWater) { interrupted = true; break; }
  }

  // ── 移动结束后的状态处理 ──
  // 如果完整走完walkPath，用预计算值；如果中断，_apRemaining已在逐步扣减中保持正确
  if(!interrupted) unit._apRemaining = Math.max(0, apLeftAfter);

  if(!interrupted){
    if(remainPath.length > 0){
      unit.hexPath = remainPath;
      unit.status = 'march';
    } else {
      const loc = getUnitNodeId(unit);
      if(loc && G.cities[loc] && (G.cities[loc].fac === unit.fac || !isHostile(unit.fac, G.cities[loc].fac))){
        unit.status = 'garrison';
      } else {
        unit.status = 'halt';
      }
      unit.hexPath = [];
    }
  }

  // 最终刷新
  updateFog(G.playerFac);
  invalidateFogCache();
  invalidateCityCache(); // ★ v153fix: 同上
  renderAll();

  } finally { // ★ 确保动画锁释放
    _marchAnimating = false;
    if(btn) btn.disabled = false;
  }

  // ★ v99: 战斗检测——只在玩家主动攻击（点击敌军）时触发
  // ★ v100: 被伏击中断后跳过（避免伏击后立即触发二次战斗）
  // 移动到空地/城市不会自动找架打
  if(attackIntent && !ambushed && unit.status !== 'garrison' && unit.status !== 'siege' && getUnitTroops(unit) > 0){
    _checkInstantBattleTrigger(unit);
  }
  // 围城到达弹窗
  if(_pendingSiegeArrival){
    _checkSiegeArrival();
  }
  // 伏击战报弹出
  if(_battleReports.length) setTimeout(showNextBattleReport, 300);
}

function billetUnit(uid){
  const u=G.units.find(x=>x.id===uid);
  if(!u||u.fac!==G.playerFac) return;
  const cities = getBilletCities(u.fac);
  if(!cities.length){ showNotif('无可用大城','warn'); return; }
  // 弹窗选目标城市
  const body = cities.map(cid=>{
    const c=G.cities[cid]; if(!c) return '';
    const def=CITY_MAP[cid];
    const dist=def?hexDist(u.hq??0,u.hr??0,def.q,def.r):0;
    const poolCount=(c.billetPool||[]).length;
    const travelT = dist <= 5 ? 0 : Math.ceil((dist - 5) / 5);
    const travelStr = travelT > 0 ? `行程${travelT}旬` : '即到';
    return `<div onclick="_confirmBillet('${uid}','${cid}')" style="cursor:pointer;padding:8px 12px;border-bottom:1px solid rgba(80,65,40,.07);display:flex;justify-content:space-between;align-items:center" onmouseover="this.style.background='rgba(80,65,40,.06)'" onmouseout="this.style.background='none'">
      <div><span style="color:${FAC[u.fac]?.color||'#ccc'}">${c.name}</span>${def?.isCapital?'<span style="color:var(--ink-l);font-size:9px;margin-left:2px">★</span>':''}
        <span style="font-size:9px;color:rgba(92,74,50,.35);margin-left:4px">${poolCount?'已有'+poolCount+'支休整':'空'}</span></div>
      <span style="font-size:9px;color:rgba(92,74,50,.35)">${dist}格 · ${travelStr}</span>
    </div>`;
  }).join('');
  const el=document.getElementById('genericModal');
  document.getElementById('genericModalTitle').textContent='选择休整屯田大城';
  document.getElementById('genericModalBody').innerHTML=`
    <div style="padding:8px 14px;font-size:10px;color:rgba(92,74,50,.45)">
      部队将休整屯田，武将释放回闲置池。<br>兵员保留于选定城市，粮饷降至1/5，屯田产粮。
    </div>${body}`;
  el.style.display='flex';
}
function _confirmBillet(uid, cityId){
  closeModal();
  const u=G.units.find(x=>x.id===uid);
  if(!u) return;
  const city=G.cities[cityId];
  if(!city||!canBilletToCity(cityId,u.fac)){ showNotif('城市不可用','warn'); return; }
  // ★ v113: 遣散行程——按距离决定几旬后兵员到达
  const def=CITY_MAP[cityId];
  const dist=def?hexDist(u.hq??0,u.hr??0,def.q,def.r):0;
  const travelTurns = dist <= 5 ? 0 : Math.ceil((dist - 5) / 5); // 5格内即到，每多5格+1旬
  const readyTurn = G.turn + travelTurns;
  // 提取兵员信息
  const pool = city.billetPool = city.billetPool || [];
  u.squads.forEach(sq=>{
    if(sq.troops<=0) return;
    // ★ v164: billet拆双条目——部曲条目(绑武将)+辅兵条目(通用)
    const _ret = getRetainers(sq.genName);
    const _retInSq = Math.min(_ret, sq.troops);
    const _auxTroops = sq.troops - _retInSq;
    const _retType = getRetainerType(sq.genName) || sq.type;
    // 部曲条目（绑武将，别人不可用）
    if(_retInSq > 0){
      pool.push({
        id: 'bp_'+G.turn+'_'+Math.random().toString(36).slice(2,6),
        troops: _retInSq, maxTroops: _retInSq,
        type: _retType, level: RETAINER_LEVEL, billetTurn: G.turn,
        readyTurn: readyTurn,
        genName: sq.genName, // ★ v164: 绑定武将，只有此武将可用
      });
    }
    // 辅兵条目（通用，兵种锁定）
    if(_auxTroops > 0){
      pool.push({
        id: 'bp_'+G.turn+'_'+Math.random().toString(36).slice(2,6),
        troops: _auxTroops, maxTroops: Math.max(_auxTroops, (sq.maxTroops||sq.troops) - _retInSq),
        type: sq.type, level: u.level||1, billetTurn: G.turn,
        readyTurn: readyTurn,
      });
    }
    // ★ v167fix: 部曲数据转移到仓库后，清零户口本（防止双写）
    if(_retInSq > 0) setRetainers(sq.genName, 0);
  });
  const genNames=u.squads.map(sq=>sq.genName).join('、');
  const totalTroops=getUnitTroops(u);
  const travelMsg = travelTurns > 0 ? `（行程${travelTurns}旬）` : '';
  log(`🏠 ${genNames} 休整屯田于${city.name}，${fmt(totalTroops)}兵入库（Lv${u.level||1}）${travelMsg}，武将归队`,'economy');
  // 删除部队
  G.units=G.units.filter(x=>x.id!==uid);
  if(G.selUnitId===uid) G.selUnitId=null;
  renderAllLight();
}

// ── 存档序列化/反序列化 ──────────────────────────────
function _serializeG(){
  // 深拷贝G，处理Set→Array ★ v154fix M10: 排除已知运行时缓存字段减小存档体积
  const _CACHE_KEYS = new Set(['_corruptRate','_corruptLoss','_salaryDebt','_deployedGensCache','_deployedGensTurn']);
  const snap = JSON.parse(JSON.stringify(G, (key, val) => {
    if(val instanceof Set) return {__set:true, values:[...val]};
    if(_CACHE_KEYS.has(key)) return undefined;
    return val;
  }));
  // 保存额外全局状态
  snap.__meta = {
    version: 172,  // v172: 加入 stage/anchorState 序列化
    savedAt: new Date().toISOString(),
    _unitIdCounter: _unitIdCounter,
    _pendingPeaceOffer: _pendingPeaceOffer,
    _pendingVassalOffer: _pendingVassalOffer,
    tutorialDone: G.tutorialDone || false,
    // v172: FAC_IDENTITY 是模块级常量，其运行时字段（type/stage/anchorState）需单独存档
    facIdentity: Object.fromEntries(Object.entries(FAC_IDENTITY).map(([f, id]) => [f, {
      type: id.type,
      stage: id.stage,
      anchorState: id.anchorState,
    }])),
  };
  return JSON.stringify(snap);
}

function _deserializeG(jsonStr){
  const snap = JSON.parse(jsonStr, (key, val) => {
    if(val && typeof val === 'object' && val.__set) return new Set(val.values);
    return val;
  });
  const meta = snap.__meta || {};
  delete snap.__meta;
  // 恢复G的所有字段
  Object.keys(G).forEach(k => delete G[k]);
  Object.assign(G, snap);
  // 恢复全局变量
  if(meta._unitIdCounter) _unitIdCounter = meta._unitIdCounter;
  _pendingPeaceOffer = meta._pendingPeaceOffer || null;
  _pendingVassalOffer = meta._pendingVassalOffer || null;
  G.tutorialDone = meta.tutorialDone || false;
  // v172: 恢复 FAC_IDENTITY 运行时字段（type/stage/anchorState）
  // 旧存档（无 facIdentity 字段）兼容：保持 initGame 初始值
  if(meta.facIdentity){
    Object.entries(meta.facIdentity).forEach(([f, s]) => {
      if(FAC_IDENTITY[f]){
        if(s.type != null)        FAC_IDENTITY[f].type = s.type;
        if(s.stage != null)       FAC_IDENTITY[f].stage = s.stage;
        if(s.anchorState !== undefined) FAC_IDENTITY[f].anchorState = s.anchorState;
      }
    });
  }
  // v172: 兜底——确保所有势力都有 stage 字段（旧存档加载时 initGame 已设过，双保险）
  ALL_FACS.forEach(fid => {
    if(FAC_IDENTITY[fid] && !FAC_IDENTITY[fid].stage){
      FAC_IDENTITY[fid].stage = (fid === 'nanman') ? 'warlord' : 'regime';
      FAC_IDENTITY[fid].anchorState = null;
    }
  });
  // 恢复科技树Set（JSON.parse的reviver已处理，但双保险）
  ALL_FACS.forEach(fid => {
    const tech = G.factions[fid]?._tech;
    if(tech && tech.researched && !(tech.researched instanceof Set)){
      tech.researched = new Set(tech.researched);
    }
  });
  // 恢复_eventFired如果是对象
  if(G._eventFired && typeof G._eventFired !== 'object') G._eventFired = {};
  // ★ v135fix+v149fix: 确保_unitIdCounter大于所有现有unit.id，避免id冲突
  // unit.id格式为'uN'字符串，需解析数字部分
  if(G.units && G.units.length > 0){
    const maxId = G.units.reduce((mx, u) => {
      const n = typeof u.id === 'string' ? parseInt(u.id.replace(/\D/g, ''), 10) : (u.id || 0);
      return Number.isFinite(n) && n > mx ? n : mx;
    }, 0);
    if(_unitIdCounter <= maxId) _unitIdCounter = maxId + 1;
  }
  // ★ v149fix 中等2: 清理旬级缓存（科技/补给/出征武将），防止旧存档脏数据
  _techEffectCache = {}; _techEffectCacheTurn = -1;
  _supplyCache = {};
  // ★ v149fix 中等3: 清理残留战斗状态，防止幽灵战报
  _battleReports = [];
  _pendingBattleConfirms = [];
  _pendingSiegeArrival = null;
  _currentBattleReport = null;
  _currentBattleConfirm = null;
  // ★ v149fix 中等4: 重置行军动画锁，防止读档后卡死
  _marchAnimating = false;
  // ★ v150fix: 清理遗漏的模块级缓存（士气/领土overlay/叠加层/朝议/单挑/统计）
  _deployedGensMoraleCache = null;
  _ovTerritoryCache = null; _ovTerritoryTurn = -1;
  _activeOverlay = null;
  window._pendingCourtCouncil = null;
  _duelChallenger = null;
  _statsHistory.length = 0; // BUG 6: 清空统计图表数据
  // ★ v150fix A2+A3: 快进状态（offer已在meta恢复，不再重置）
  _fastForward = false;
  // ★ v167fix #6: 删除 _pendingPeaceOffer/_pendingVassalOffer = null（L29848已从meta恢复，此处重置会丢失读档时的求和/附庸请求）
  // ★ v151: 价值观系统旧存档兼容
  ALL_FACS.forEach(fid => {
    if(G.factions[fid] && !G.factions[fid].ethos){
      G.factions[fid].ethos = {...(ETHOS_INIT[fid] || {mandate:0,power:0,civil:0,military:0,strategy:0})};
      G.factions[fid]._ethosLog = [];
      G.factions[fid]._ethosSnap = {};
    }
  });
  // ★ v155fix P0: 重建GEN_MAP指向G.generals中的活跃对象（替代v154的Object.assign方案）
  _rebuildGEN_MAP();
  // ★ v161: 旧存档无counties → 调用initCityGentry初始化
  const _hasCounties = Object.values(G.cities).some(c => c.counties && c.counties.length > 0);
  if(!_hasCounties) initCityGentry();
  // ★ v170: 存档counties迁移（同步到最新COUNTY_DATA，保留已有loyalty/_initPop，补全新增县，同步clanFamily字段）
  Object.entries(G.cities).forEach(([cityId, city]) => {
    const template = COUNTY_DATA[cityId];
    if(!template || !city.counties) return;
    // 建立旧county按name索引
    const oldByName = {};
    city.counties.forEach(c => { oldByName[c.name] = c; });
    // 按模板重建，保留旧loyalty
    const newCounties = template.map(t => {
      const old = oldByName[t.name];
      if(old){
        // 存在：更新 type/clanFamily/popShare/magnate 为模板值（可能变化），保留 loyalty/_initPop
        return {
          name: t.name,
          type: t.type,
          clanFamily: t.clanFamily, // 支持从单值迁移到数组
          popShare: t.popShare,
          magnate: t.magnate === true, // ★ v171: 同步magnate字段（未标记则false）
          loyalty: old.loyalty ?? 50,
          _initPop: old._initPop || Math.floor(city.pop * t.popShare),
        };
      } else {
        // 新县（v170新增）：用城均loyalty初始化
        return {
          name: t.name,
          type: t.type,
          clanFamily: t.clanFamily,
          popShare: t.popShare,
          magnate: t.magnate === true, // ★ v171
          loyalty: city.gentry ?? 50,
          _initPop: Math.floor(city.pop * t.popShare),
        };
      }
    });
    // 归一化popShare（防模板和存档总和不一致）
    const tot = newCounties.reduce((s,c) => s + c.popShare, 0);
    if(Math.abs(tot-1) > 0.001) newCounties.forEach(c => c.popShare /= tot);
    city.counties = newCounties;
    city.gentry = _aggregateGentry(city);
  });
  // ★ v164: genRetainers旧存档兼容（纯数字→{count,type}）
  if(G.genRetainers){
    Object.keys(G.genRetainers).forEach(name => {
      const v = G.genRetainers[name];
      if(typeof v === 'number'){
        G.genRetainers[name] = { count: v, type: RETAINER_PRESET[name]?.type || null };
      }
    });
  }
  // ★ v164: 通商/通使旧存档兼容
  if(!G._tradeCD) G._tradeCD = {};
  if(!G._pendingEnvoyIntel) G._pendingEnvoyIntel = [];
  // ★ v165: 通商协定旧存档兼容
  if(!G._tradeAgreements) G._tradeAgreements = [];
  // ★ v166: 迁民系统旧存档兼容
  if(G._migratedThisTurn === undefined) G._migratedThisTurn = false;
  ALL_FACS.forEach(fid => {
    if(G.strategyCD && G.strategyCD[fid] && G.strategyCD[fid].envoy === undefined){
      G.strategyCD[fid].envoy = 0;
    }
  });
}

// ── 存储兼容层：优先window.storage(Artifact)，降级localStorage ──
const _store = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function'){
      try { const r = await window.storage.get(key); return r; } catch(e){ /* fall through */ }
    }
    // localStorage降级
    try {
      const v = localStorage.getItem('pr_' + key);
      if(v === null) return null;
      return {key, value:v};
    } catch(e){ return null; }
  },
  async set(key, value){
    if(window.storage && typeof window.storage.set === 'function'){
      try { const r = await window.storage.set(key, value); if(r) return r; } catch(e){ /* fall through */ }
    }
    try {
      localStorage.setItem('pr_' + key, value);
      return {key, value};
    } catch(e){ return null; }
  },
  async delete(key){
    if(window.storage && typeof window.storage.delete === 'function'){
      try { const r = await window.storage.delete(key); return r; } catch(e){ /* fall through */ }
    }
    try {
      localStorage.removeItem('pr_' + key);
      return {key, deleted:true};
    } catch(e){ return null; }
  },
};

async function _getSaveSlots(){
  const slots = [];
  for(let i = 1; i <= SAVE_SLOT_COUNT; i++){
    try {
      const result = await _store.get(SAVE_KEY_PREFIX + i);
      if(result && result.value){
        const data = JSON.parse(result.value);
        const meta = data.__meta || {};
        const facNames = {wei:'曹魏',shu:'蜀汉',wu:'东吴',nanman:'南蛮'};
        const yearStr = YEARS[data.year] || `第${(data.year||0)+1}年`;
        const seasonNames = ['春','夏','秋','冬'];
        const seasonStr = seasonNames[data.seasonIdx || 0] || '春';
        const cityCount = Object.values(data.cities||{}).filter(c => c.fac === data.playerFac).length;
        slots.push({
          idx: i,
          exists: true,
          fac: data.playerFac,
          facName: facNames[data.playerFac] || data.playerFac,
          turn: data.turn || 1,
          yearStr, seasonStr, cityCount,
          savedAt: meta.savedAt ? new Date(meta.savedAt).toLocaleString('zh-CN') : '未知时间',
        });
      } else {
        slots.push({idx:i, exists:false});
      }
    } catch(e){
      slots.push({idx:i, exists:false});
    }
  }
  return slots;
}

async function saveToSlot(slotIdx){
  // ★ v179fix P41: 存档保持只读快照契约——有未消化战报则拒绝存档
  // 战报队列内含 unit/squad 的经验/Merit/level 待发放（applyBattleExp 在 closeBattleModal 才执行）
  // 若强行存档会被 _deserializeG 强制清空，导致经验丢失
  if(_battleReports.length > 0 || _currentBattleReport || _pendingBattleConfirms.length > 0){
    showNotif('请先关闭所有战报窗口再存档', 'error');
    return false;
  }
  try {
    const data = _serializeG();
    const r = await _store.set(SAVE_KEY_PREFIX + slotIdx, data);
    return !!r;
  } catch(e){
    console.error('Save failed:', e);
    return false;
  }
}

async function loadFromSlot(slotIdx){
  try {
    const result = await _store.get(SAVE_KEY_PREFIX + slotIdx);
    if(!result || !result.value) return false;
    _deserializeG(result.value);
    return true;
  } catch(e){
    console.error('Load failed:', e);
    return false;
  }
}

async function deleteSlot(slotIdx){
  try {
    await _store.delete(SAVE_KEY_PREFIX + slotIdx);
    return true;
  } catch(e){ return false; }
}

function runIntegrityAudit(){
  const errors = [];
  const warn = (group, msg) => errors.push({group, msg});
  const VALID_FACS = new Set([...ALL_FACS, 'rebel']);
  const VALID_STATUS = new Set(['garrison','march','halt','camp','ambush','siege']);

  // ── 1. 资源合法性 ──
  ALL_FACS.forEach(fid => {
    const res = G.factions[fid]?.res;
    if(!res){ warn('资源','`G.factions['+fid+'].res` 不存在'); return; }
    ['gold','wood','iron','horses'].forEach(k => {
      const v = res[k];
      if(v === undefined || v === null) warn('资源', `${fid}.res.${k} = undefined/null`);
      else if(Number.isNaN(v)) warn('资源', `${fid}.res.${k} = NaN`);
      else if(v < 0) warn('资源', `${fid}.res.${k} = ${v} (负数)`);
    });
  });
  Object.entries(G.cities).forEach(([cid, city]) => {
    ['pop','garrison','morale'].forEach(k => {
      const v = city[k];
      if(v === undefined || v === null) warn('资源', `city[${cid}].${k} = undefined/null`);
      else if(Number.isNaN(v)) warn('资源', `city[${cid}].${k} = NaN`);
      else if(v < 0) warn('资源', `city[${cid}].${k} = ${v} (负数)`);
    });
    if(city.pop !== undefined && city.pop > 0 && city.popQuality !== undefined){
      if(Number.isNaN(city.popQuality)) warn('资源', `city[${cid}].popQuality = NaN`);
    }
  });

  // ── 2. 兵力 NaN/负数 ──
  G.units.forEach(u => {
    const total = getUnitTroops(u);
    if(Number.isNaN(total)) warn('兵力', `unit[${u.id}] getUnitTroops=NaN`);
    else if(total < 50) warn('兵力', `unit[${u.id}] getUnitTroops=${total} (应已被清除, <50)`);
    (u.squads||[]).forEach((sq, i) => {
      if(Number.isNaN(sq.troops)) warn('兵力', `unit[${u.id}] squad[${i}] troops=NaN (gen=${sq.genName})`);
      else if(sq.troops < 0) warn('兵力', `unit[${u.id}] squad[${i}] troops=${sq.troops} (负数, gen=${sq.genName})`);
    });
  });
  Object.entries(G.cities).forEach(([cid, city]) => {
    if(Number.isNaN(city.garrison)) warn('兵力', `city[${cid}].garrison = NaN`);
    else if(city.garrison < 0) warn('兵力', `city[${cid}].garrison = ${city.garrison} (负数)`);
  });

  // ── 3. loyaltyAccum 同步 ──
  if(G.genLoyalty && G.loyaltyAccum){
    // 只检查当前在某势力中的武将（在野/下野武将不需要loyaltyAccum）
    const activeFacGens = new Set();
    ALL_FACS.forEach(fid => {
      (G.generals[fid]||[]).forEach(g => activeFacGens.add(g.name));
    });
    Object.keys(G.genLoyalty).forEach(name => {
      if(!activeFacGens.has(name)) return; // 在野/下野武将跳过
      const loy = G.genLoyalty[name];
      const acc = G.loyaltyAccum[name];
      if(loy === undefined || Number.isNaN(loy)) warn('忠诚同步', `genLoyalty[${name}] = ${loy}`);
      if(acc === undefined) warn('忠诚同步', `loyaltyAccum[${name}] 不存在 (genLoyalty=${loy})`);
      else if(Number.isNaN(acc)) warn('忠诚同步', `loyaltyAccum[${name}] = NaN`);
      else if(Math.abs(loy - acc) > 1.5) warn('忠诚同步', `${name}: genLoyalty=${loy}, loyaltyAccum=${acc.toFixed(2)}, 差=${Math.abs(loy-acc).toFixed(2)}`);
    });
  }

  // ── 4. 城市 fac 合法性 + prefect 一致性 ──
  Object.entries(G.cities).forEach(([cid, city]) => {
    if(!VALID_FACS.has(city.fac)) warn('城市fac', `city[${cid}].fac = '${city.fac}' (非法)`);
    if(city.prefect){
      if(city.fac === 'rebel') return; // 叛军无武将系统
      const gens = G.generals[city.fac] || [];
      if(!gens.some(g => g.name === city.prefect)){
        warn('城市fac', `city[${cid}] prefect='${city.prefect}' 不在 G.generals[${city.fac}] 中`);
      }
    }
  });

  // ── 5. 死武将残留 ──
  const allAliveGens = new Set();
  ALL_FACS.forEach(fid => {
    (G.generals[fid]||[]).forEach(g => allAliveGens.add(g.name));
  });
  // 5a: 部队squads中的武将
  G.units.forEach(u => {
    if(u.fac === 'rebel') return; // 叛军genName可能不在标准池
    (u.squads||[]).forEach((sq, i) => {
      if(sq.genName && !allAliveGens.has(sq.genName)){
        warn('死将残留', `unit[${u.id}] squad[${i}] genName='${sq.genName}' 不在任何势力武将列表中`);
      }
    });
  });
  // 5b: 城市prefect
  Object.entries(G.cities).forEach(([cid, city]) => {
    if(city.prefect && city.fac !== 'rebel' && !allAliveGens.has(city.prefect)){
      warn('死将残留', `city[${cid}] prefect='${city.prefect}' 不在活武将池`);
    }
  });
  // 5c: 军师
  ALL_FACS.forEach(fid => {
    const strat = G.factions[fid]?.strategist;
    if(strat && !allAliveGens.has(strat)){
      warn('死将残留', `${fid} strategist='${strat}' 不在活武将池`);
    }
  });
  // 5d: 官职表
  if(G.genPost){
    Object.keys(G.genPost).forEach(name => {
      if(G.genPost[name] && !allAliveGens.has(name)){
        warn('死将残留', `genPost['${name}']='${G.genPost[name]}' 但武将不在活武将池`);
      }
    });
  }

  // ── 6. 部队结构 ──
  G.units.forEach(u => {
    if(!u.squads || u.squads.length === 0) warn('部队结构', `unit[${u.id}] squads为空`);
    if(!VALID_FACS.has(u.fac)) warn('部队结构', `unit[${u.id}].fac='${u.fac}' (非法)`);
    if(!VALID_STATUS.has(u.status)) warn('部队结构', `unit[${u.id}].status='${u.status}' (非法)`);
    if(u.hq === undefined || u.hr === undefined) warn('部队结构', `unit[${u.id}] hq/hr 未定义`);
    else if(Number.isNaN(u.hq) || Number.isNaN(u.hr)) warn('部队结构', `unit[${u.id}] hq=${u.hq} hr=${u.hr} NaN`);
  });

  // ── 6b. 属县完整性 (v161) ──
  Object.entries(G.cities).forEach(([cid, city]) => {
    if(!city.counties || !city.counties.length) return;
    const psSum = city.counties.reduce((s,c) => s + c.popShare, 0);
    if(psSum < 0.99 || psSum > 1.01) warn('属县', `city[${cid}] popShare之和=${psSum.toFixed(4)} (应≈1.0)`);
    city.counties.forEach((c,i) => {
      if(c.loyalty === undefined || Number.isNaN(c.loyalty)) warn('属县', `city[${cid}] county[${i}].loyalty=${c.loyalty}`);
      if(c.type === 'clan_base' && !c.clanFamily) warn('属县', `city[${cid}] county[${i}] clan_base无clanFamily`);
    });
  });

  // ── 7. 结构完整性 ──
  // 7a: 重复unit.id
  const uidSet = new Set();
  G.units.forEach(u => {
    if(uidSet.has(u.id)) warn('结构', `重复 unit.id='${u.id}'`);
    uidSet.add(u.id);
  });
  // 7b: 同一武将分身（出现在多支部队squads中）
  const genInUnit = new Map(); // genName -> unitId
  G.units.forEach(u => {
    (u.squads||[]).forEach(sq => {
      if(!sq.genName) return;
      if(genInUnit.has(sq.genName)){
        warn('结构', `武将'${sq.genName}' 同时出现在 unit[${genInUnit.get(sq.genName)}] 和 unit[${u.id}]`);
      } else {
        genInUnit.set(sq.genName, u.id);
      }
    });
  });
  // 7c: genLoyalty中的幽灵武将（不存在于任何势力）
  if(G.genLoyalty){
    Object.keys(G.genLoyalty).forEach(name => {
      if(!allAliveGens.has(name)){
        // 检查是否在在野系统中（不算错误）
        const inWildPool = (G.wildPool||[]).includes(name);
        const inWildGens = typeof WILD_GENS !== 'undefined' && WILD_GENS.some(w => w.name === name);
        if(!inWildPool && !inWildGens) warn('结构', `genLoyalty['${name}'] 存在但武将不在任何势力/在野池/WILD_GENS`);
      }
    });
  }
  // 7d: 城市总数
  const cityCount = Object.keys(G.cities).length;
  if(cityCount !== 45) warn('结构', `城市数=${cityCount} (预期45)`);
  // 7e: 武将同时是太守+部署在外（允许，但检查太守城fac匹配）
  Object.entries(G.cities).forEach(([cid, city]) => {
    if(city.prefect && city.fac !== 'rebel'){
      // 太守势力应与城市势力一致
      const inFac = (G.generals[city.fac]||[]).some(g => g.name === city.prefect);
      if(!inFac){
        // 可能武将已转投他方
        let foundFac = null;
        ALL_FACS.forEach(f => {
          if((G.generals[f]||[]).some(g => g.name === city.prefect)) foundFac = f;
        });
        if(foundFac) warn('结构', `city[${cid}] fac=${city.fac} prefect='${city.prefect}' 实际属于${foundFac}`);
      }
    }
  });

  // ★ v151: 价值观系统审计
  ALL_FACS.forEach(fid => {
    const eth = G.factions[fid]?.ethos;
    if(!eth) { warn('价值观', `${fid} missing ethos object`); return; }
    ETHOS_DIMS.forEach(d => {
      if(typeof eth[d] !== 'number' || eth[d] < -100 || eth[d] > 100)
        warn('价值观', `${fid}.ethos.${d} = ${eth[d]} (expect -100~100)`);
    });
  });

  // ── 汇总输出 ──
  const groups = {};
  errors.forEach(e => {
    if(!groups[e.group]) groups[e.group] = [];
    groups[e.group].push(e.msg);
  });
  const allGroups = ['资源','兵力','忠诚同步','城市fac','死将残留','部队结构','结构','价值观'];
  let report = `\n${'═'.repeat(50)}\n  完整性审计 (第${G.turn}旬)\n${'═'.repeat(50)}\n`;
  let passCount = 0;
  allGroups.forEach(g => {
    const errs = groups[g];
    if(!errs || errs.length === 0){
      report += `  ✅ ${g}: 通过\n`;
      passCount++;
    } else {
      report += `  ❌ ${g}: ${errs.length}个异常\n`;
      errs.forEach(m => { report += `     · ${m}\n`; });
    }
  });
  report += `${'─'.repeat(50)}\n  总计: ${passCount}/${allGroups.length} 通过`;
  if(errors.length > 0) report += `, ${errors.length}个异常`;
  report += `\n${'═'.repeat(50)}`;

  console.log(report);

  // 弹窗摘要
  const summary = errors.length === 0
    ? `✅ 完整性审计通过（第${G.turn}旬）\n8/8 检查组全部通过`
    : `⚠️ 完整性审计（第${G.turn}旬）\n${passCount}/${allGroups.length} 通过，${errors.length}个异常\n\n` +
      allGroups.filter(g => groups[g]?.length).map(g => `❌ ${g}: ${groups[g].length}个`).join('\n') +
      '\n\n详情请查看浏览器控制台 (F12)';
  alert(summary);

  // 同时写入游戏日志
  if(errors.length === 0){
    log(`🔍 审计通过 (第${G.turn}旬): 8/8组全部合格`, 'economy');
  } else {
    log(`⚠️ 审计发现${errors.length}个异常 (第${G.turn}旬): ${allGroups.filter(g=>groups[g]?.length).join('/')}`, 'battle');
  }

  return {pass: errors.length === 0, errors, report};
}

// ═══════════════════════════════════════════════════════
// ★ v119: 势力淘汰 + 胜利/失败判定
// ═══════════════════════════════════════════════════════

function checkElimination(){
  ALL_FACS.forEach(fid => {
    if(G.factions[fid]?._eliminated) return; // 已淘汰
    const cities = Object.values(G.cities).filter(c => c.fac === fid);
    const units = G.units.filter(u => u.fac === fid && getUnitTroops(u) > 0);
    if(cities.length === 0 && units.length === 0){
      // ── 淘汰该势力 ──
      G.factions[fid]._eliminated = true;
      G.factions[fid]._eliminatedTurn = G.turn;

      // 武将全部流入在野池
      const gens = G.generals[fid] || [];
      gens.forEach(g => {
        if(g.role === 'ruler') return; // 君主不入在野池
        clearPrefectByGen(g.name);
        clearAllPostsByGen(g.name);
        if(!WILD_GENS.find(x => x.name === g.name)){
          WILD_GENS.push({...g, defectedFrom: fid, defectedTurn: G.turn, minTurn: G.turn});
        }
        if(!G.wildPool.includes(g.name) && G.wildPool.length < 8) G.wildPool.push(g.name);
      });
      G.generals[fid] = gens.filter(g => g.role === 'ruler'); // 只保留君主（历史记录用）

      // 清除军师
      if(G.factions[fid]) G.factions[fid].strategist = null;

      // 清除外交关系中的该势力（停战/结盟失效）
      // ★ v167fix #32: 用split精确匹配，避免fid为子串时误匹配（如'wu'匹配'wuxing'）
      Object.keys(G.diplo).forEach(key => {
        const [a,b] = key.split('-');
        if(a === fid || b === fid){
          G.diplo[key].status = 'neutral';
        }
      });

      const facName = FAC[fid]?.full || fid;
      log(`💀 ${facName}已覆灭！城池尽失，兵马殆尽。`, 'event');

      if(fid === G.playerFac){
        // 玩家被淘汰
        if(!_fastForward) setTimeout(() => showGameEndOverlay(false), 800);
      } else {
        if(!_fastForward) showNotif(`${facName}已覆灭！`, 'success');
      }
    }
  });

  // ── 胜利判定：只剩一家未淘汰 ──
  const alive = ALL_FACS.filter(f => !G.factions[f]?._eliminated);
  if(alive.length === 1){
    const winner = alive[0];
    if(!G._victoryShown){
      G._victoryShown = true;
      if(winner === G.playerFac){
        if(!_fastForward) setTimeout(() => showGameEndOverlay(true), 1200);
        else log(`🏆 天下一统！${FAC[winner]?.full}称霸四海！`, 'event');
      } else {
        if(!_fastForward) setTimeout(() => showGameEndOverlay(false, winner), 1200);
        else log(`💀 ${FAC[winner]?.full}统一天下，你的势力已成历史尘埃。`, 'event');
      }
    }
  }
}
