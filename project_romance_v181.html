<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国·苍生问策 v1.6.7</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>:root {
  --wei:#1a5f8a; --shu:#1a7a3a; --wu:#a82a1a; --nanman:#8b6914;
  --gold:#6b5530; --gold-l:#8a7040;
  --ink:#2c2416; --ink-l:#5c4a32; --ink-ll:#8a7a60;
  --border:rgba(80,65,40,0.18);
  --panel:rgba(245,238,225,0.97);
  --paper:#f5eee1; --paper-warm:#ede4d0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Noto Serif SC',serif;height:100vh;overflow:hidden}
.app{display:grid;grid-template-rows:50px 1fr 42px;height:100vh}
.main{display:grid;grid-template-columns:220px 1fr 430px;overflow:hidden}

/* HEADER */
header{background:rgba(235,225,205,.98);border-bottom:1px solid rgba(80,65,40,.25);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.logo{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:19px;font-weight:900;color:var(--ink);letter-spacing:6px;text-shadow:none}
.logo-sub{font-size:10px;color:var(--ink-ll);letter-spacing:2px;margin-left:10px}
.hdr-c{display:flex;align-items:center;gap:14px}
.turn-d{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);letter-spacing:2px}
.s-tag{padding:2px 9px;border:1px solid;font-family:'Noto Serif SC',serif;font-size:11px;letter-spacing:1px}
.btn-turn{padding:6px 16px;background:linear-gradient(135deg,#6b5530,#4a3820);border:none;color:var(--paper);font-family:'Noto Serif SC',serif;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.btn-turn:hover{background:linear-gradient(135deg,#8a7040,#6b5530)}
.btn-turn:disabled{opacity:.4;cursor:not-allowed}

/* PANELS */
.panel{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:13px}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:rgba(80,65,40,.25)}
.rp{border-right:none;border-left:1px solid var(--border)}
.pt{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:10px;color:var(--ink-l);letter-spacing:3px;padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:10px}
.sec{font-size:9px;color:var(--ink-ll);letter-spacing:2px;margin:9px 0 5px;text-transform:uppercase}

/* DUEL (单挑) */
.bc-duel-section{border:1px solid rgba(92,74,50,.25);background:rgba(80,65,40,.04);padding:10px 14px;margin-top:2px}
.bc-duel-title{font-size:10px;color:rgba(92,74,50,.65);letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.bc-duel-gen-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.bc-duel-gen{padding:4px 10px;border:1px solid rgba(80,65,40,.18);cursor:pointer;font-size:11px;font-family:'Noto Serif SC',serif;transition:all .15s;color:rgba(44,36,22,.65)}
.bc-duel-gen:hover{border-color:var(--ink-l);color:var(--ink);background:rgba(80,65,40,.06)}
.bc-duel-gen.sel{border-color:var(--ink-l);color:var(--ink);background:rgba(80,65,40,.08)}
.bc-duel-gen.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.bc-duel-hint{font-size:9px;color:rgba(92,74,50,.40);line-height:1.7}

/* DUEL RESULT in battle report */
.br-duel{border:1px solid rgba(92,74,50,.3);background:rgba(80,65,40,.05);padding:10px 14px;margin-bottom:10px}
.br-duel-title{font-size:10px;color:rgba(92,74,50,.65);letter-spacing:2px;margin-bottom:8px}
.br-duel-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
.br-duel-name{font-family:'Noto Serif SC',serif;font-weight:700;min-width:60px}
.br-duel-war{font-size:9px;color:rgba(92,74,50,.55);margin-left:2px}
.br-duel-vs{font-size:11px;color:rgba(92,74,50,.40);margin:0 4px}
.br-duel-result{padding:2px 8px;font-size:10px;font-family:'Noto Serif SC',serif;letter-spacing:1px}
.br-duel-result.win{background:rgba(26,122,58,.1);border:1px solid rgba(26,122,58,.3);color:#1a7a3a}
.br-duel-result.lose{background:rgba(192,48,48,.1);border:1px solid rgba(192,48,48,.3);color:#c03030}
.br-duel-result.draw{background:rgba(80,65,40,.08);border:1px solid rgba(80,65,40,.2);color:rgba(92,74,50,.7)}
.br-duel-morale{font-size:9px;margin-left:auto}
.br-duel-narrative{font-size:10px;color:rgba(44,36,22,.55);line-height:1.7;font-style:italic;margin-top:6px;padding-top:6px;border-top:1px solid rgba(80,65,40,.08)}
/* ═══ TITLE SCREEN & SAVE/LOAD ═══ */
.title-screen{position:fixed;inset:0;background:#ede4d0;z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif}
.title-screen .ts-title{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:52px;color:var(--ink);letter-spacing:14px;margin-bottom:4px;text-shadow:0 2px 8px rgba(44,36,22,.08)}
.title-screen .ts-sub{font-size:11px;color:var(--ink-ll);letter-spacing:4px;margin-bottom:52px}
.title-screen .ts-menu{display:flex;flex-direction:column;gap:14px;align-items:center}
.ts-btn{width:200px;padding:13px 0;border:1px solid rgba(80,65,40,.25);background:rgba(255,252,245,.7);color:var(--ink);font-family:'Noto Serif SC',serif;font-size:14px;font-weight:700;letter-spacing:4px;cursor:pointer;transition:all .25s;text-align:center}
.ts-btn:hover{background:rgba(80,65,40,.08);border-color:rgba(80,65,40,.45);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.ts-btn:disabled{opacity:.35;cursor:not-allowed;background:rgba(255,252,245,.4)}
.ts-btn.primary{background:linear-gradient(135deg,rgba(107,85,48,.12),rgba(107,85,48,.06));border-color:rgba(80,65,40,.35)}
.ts-btn.primary:hover{background:linear-gradient(135deg,rgba(107,85,48,.2),rgba(107,85,48,.1));border-color:rgba(80,65,40,.55)}

/* Scenario Select */
.scenario-screen{position:fixed;inset:0;background:#ede4d0;z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif}
.scenario-card{border:1px solid rgba(80,65,40,.2);background:rgba(255,252,245,.7);padding:28px 26px;width:320px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.scenario-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.scenario-card:hover{border-color:rgba(80,65,40,.45);background:rgba(255,252,245,.95);box-shadow:0 4px 20px rgba(0,0,0,.08)}
.scenario-card .sc-badge{position:absolute;top:10px;right:12px;font-size:8px;color:var(--ink-ll);letter-spacing:1px;border:1px solid rgba(80,65,40,.15);padding:1px 6px}

/* Save/Load Panel */
.save-overlay{position:fixed;inset:0;background:rgba(20,16,10,.55);z-index:700;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;opacity:0;transition:opacity .2s}
.save-overlay.show{opacity:1}
.save-panel{background:var(--paper);border:1px solid rgba(80,65,40,.3);padding:28px 30px;min-width:420px;max-width:480px;box-shadow:0 8px 40px rgba(0,0,0,.15);position:relative}
.save-panel .sp-title{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:16px;color:var(--ink);letter-spacing:4px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.save-slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgba(80,65,40,.12);margin-bottom:8px;cursor:pointer;transition:all .2s;background:rgba(255,252,245,.5)}
.save-slot:hover{border-color:rgba(80,65,40,.3);background:rgba(80,65,40,.04)}
.save-slot.sel{border-color:var(--ink-l);background:rgba(80,65,40,.06)}
.save-slot .slot-num{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:18px;color:var(--ink-ll);width:28px;text-align:center}
.save-slot .slot-info{flex:1}
.save-slot .slot-fac{font-size:12px;font-weight:700;letter-spacing:1px}
.save-slot .slot-detail{font-size:9px;color:var(--ink-ll);margin-top:2px}
.save-slot .slot-empty{font-size:11px;color:rgba(92,74,50,.35);font-style:italic}
.save-slot .slot-time{font-size:8px;color:rgba(92,74,50,.3);margin-left:auto;white-space:nowrap}
.sp-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.sp-actions button{padding:8px 18px;font-family:'Noto Serif SC',serif;font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;border:1px solid rgba(80,65,40,.25);background:rgba(255,252,245,.7);color:var(--ink)}
.sp-actions button:hover{border-color:rgba(80,65,40,.45);background:rgba(80,65,40,.08)}
.sp-actions button.danger{color:#c03030;border-color:rgba(192,48,48,.3)}
.sp-actions button.danger:hover{background:rgba(192,48,48,.06)}
.sp-actions button:disabled{opacity:.35;cursor:not-allowed}
.btn-save-hdr{padding:4px 10px;background:none;border:1px solid rgba(80,65,40,.2);color:var(--ink-l);font-family:'Noto Serif SC',serif;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;margin-right:4px}
.btn-save-hdr:hover{border-color:rgba(80,65,40,.4);color:var(--ink);background:rgba(80,65,40,.05)}
.btn-ai-toggle{padding:4px 10px;background:none;border:1px solid rgba(80,65,40,.2);color:var(--ink-l);font-family:'Noto Serif SC',serif;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;margin-right:4px;border-radius:2px}
.btn-ai-toggle:hover{border-color:rgba(80,65,40,.4);background:rgba(80,65,40,.05)}
.btn-ai-toggle.ai-on{background:rgba(46,120,180,.15);border-color:rgba(46,120,180,.5);color:#1a6fa0}

#stackPicker{position:fixed;z-index:650;background:rgba(245,238,225,.98);border:1px solid var(--ink-l);
  min-width:180px;padding:6px 0;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none}
#stackPicker::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-bottom:5px solid var(--ink-l)}
.sp-header{font-family:'Noto Serif SC',serif;font-size:9px;color:rgba(92,74,50,.55);letter-spacing:2px;
  padding:4px 12px 6px;border-bottom:1px solid rgba(80,65,40,.12);margin-bottom:2px}
.sp-row{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;transition:background .12s}
.sp-row:hover{background:rgba(80,65,40,.06)}
.sp-row.sel{background:rgba(80,65,40,.08)}
.sp-flag{width:10px;height:10px;border-radius:1px;flex-shrink:0}
.sp-name{font-family:'Noto Serif SC',serif;font-size:11px;font-weight:700}
.sp-status{font-size:8px;padding:1px 4px;border:1px solid;border-radius:1px;margin-left:4px}

/* FACTION CARDS */
.fc{border:1px solid var(--border);padding:9px 11px;margin-bottom:7px;cursor:pointer;position:relative;overflow:hidden;transition:all .2s;background:rgba(255,252,245,.6)}
.fc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.fc.wei::before{background:var(--wei)}.fc.shu::before{background:var(--shu)}.fc.wu::before{background:var(--wu)}.fc.nanman::before{background:var(--nanman)}
.fc:hover{background:rgba(80,65,40,.06);border-color:rgba(80,65,40,.3)}
.fc.active{background:rgba(80,65,40,.08);border-color:var(--ink-l)}
.fc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.fc-n{font-family:'Noto Serif SC',serif;font-weight:700;font-size:14px}
.fc-n.wei{color:var(--wei)}.fc-n.shu{color:var(--shu)}.fc-n.wu{color:var(--wu)}.fc-n.nanman{color:var(--nanman)}
.fc-r{font-size:10px;color:var(--ink-ll)}
.fc-s{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.sr{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(44,36,22,.55)}
.sr-v{margin-left:auto;color:var(--ink);font-size:10px}
.sr-v.warn{color:#b87a10}.sr-v.danger{color:#c03030}
/* 新增：势力卡底部净值行 */
.fc-netrow{display:flex;gap:8px;margin-top:5px;padding-top:5px;border-top:1px solid rgba(80,65,40,.1);font-size:9px}
.fc-netitem{display:flex;align-items:center;gap:3px}
.fc-netlabel{color:var(--ink-ll)}
/* ★ v168: 朝堂状态行 */
.fc-court{margin-top:4px;padding:3px 6px;font-size:9px;border-radius:2px;letter-spacing:.5px;cursor:pointer}
.fc-court.court-ok{color:#5a8a5a;background:rgba(90,138,90,.06)}
.fc-court.court-warn{color:#b8860b;background:rgba(184,134,11,.06)}
.fc-court.court-danger{color:#c03030;background:rgba(192,48,48,.06)}
/* ★ v168: 派系Tab内政概览 */
.court-narrative{color:var(--ink-l);font-size:11px;line-height:1.6;padding:8px 10px;background:rgba(255,252,245,.5);border-left:2px solid rgba(180,160,120,.3);margin-bottom:10px;letter-spacing:.3px}
.court-warn-item{display:flex;align-items:flex-start;gap:6px;padding:5px 8px;margin-bottom:4px;border-radius:3px;font-size:11px;line-height:1.5}
.court-warn-item.cw-red{background:rgba(192,48,48,.05);border:1px solid rgba(192,48,48,.15)}
.court-warn-item.cw-yellow{background:rgba(184,134,11,.05);border:1px solid rgba(184,134,11,.15)}
.court-warn-item.cw-green{background:rgba(90,138,90,.05);border:1px solid rgba(90,138,90,.15)}
.court-warn-item .cw-text{flex:1;color:var(--ink-l)}
.court-warn-item .cw-action{font-size:10px;color:rgba(92,74,50,.5);cursor:pointer;white-space:nowrap;text-decoration:underline;text-decoration-style:dotted;align-self:center}
.court-warn-item .cw-action:hover{color:var(--ink)}
.court-vacant{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:11px;border-bottom:1px solid rgba(80,65,40,.06)}
.court-vacant .cv-label{color:var(--ink-l)}
.court-vacant .cv-link{font-size:10px;color:rgba(92,74,50,.45);cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.court-vacant .cv-link:hover{color:var(--ink)}

/* JUN (COMMANDERY) LIST */
.jun-item{margin-bottom:12px}
.jun-hd{font-family:'Noto Serif SC',serif;font-size:11px;color:var(--ink-l);letter-spacing:1px;padding:4px 6px;border-left:2px solid var(--ink-ll);margin-bottom:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.jun-hd:hover{color:var(--ink)}
.jun-city{font-size:10px;padding:3px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;border-radius:1px}
.jun-city:hover{background:rgba(80,65,40,.06);color:var(--ink)}
.city-tags-mini{display:flex;gap:3px;margin-left:auto;align-items:center}
.tag-mini{font-size:10px;padding:1px 4px;border:1px solid rgba(80,65,40,.15);color:var(--ink-l);border-radius:2px;cursor:default;position:relative;line-height:1.2}
.tag-mini:hover{border-color:rgba(80,65,40,.3);background:rgba(80,65,40,.04)}
.tag-mini:hover .tag-mini-tip{display:block}
.tag-mini-tip{display:none;position:absolute;bottom:calc(100% + 4px);right:0;background:rgba(245,238,225,.99);border:1px solid var(--ink-l);padding:4px 7px;font-size:9px;color:var(--ink);white-space:nowrap;z-index:100;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.1);border-radius:2px}
.tag-elite{font-size:10px;padding:1px 4px;border:1px solid rgba(168,42,26,.25);color:#a82a1a;border-radius:2px;cursor:default;position:relative;line-height:1.2;background:rgba(168,42,26,.04)}
.tag-elite:hover{border-color:rgba(168,42,26,.4);background:rgba(168,42,26,.08)}
.tag-elite:hover .tag-mini-tip{display:block}

/* MAP */
.map-wrap{position:relative;background:#e8dfc8;overflow:hidden}
.map-svg{width:100%;height:100%}
.road{stroke:rgba(120,90,40,.15);stroke-width:1;fill:none;stroke-dasharray:3,4}
.city-g{cursor:pointer}
.city-g:hover .cc{filter:brightness(1.6)}
.city-g.sel .cc{filter:brightness(2) drop-shadow(0 0 5px currentColor)}
.cc{transition:all .2s}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:11px}
.tab{padding:5px 11px;font-size:10px;color:var(--ink-ll);cursor:pointer;font-family:'Noto Serif SC',serif;letter-spacing:1px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab:hover{color:var(--ink-l)}
.tab.active{color:var(--ink);border-bottom-color:var(--ink-l)}

/* CITY DETAIL */
.cd-name{font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;font-size:16px;font-weight:700;margin-bottom:2px;color:var(--ink)}
.cd-jun{font-size:10px;color:var(--ink-ll);margin-bottom:8px}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.tag-badge{display:flex;align-items:center;gap:3px;padding:3px 7px;border:1px solid;font-size:10px;font-family:'Noto Serif SC',serif;border-radius:1px;cursor:default;position:relative}
.tag-badge:hover .tag-tip{display:block}
.tag-tip{display:none;position:absolute;bottom:calc(100% + 4px);left:0;background:rgba(245,238,225,.99);border:1px solid var(--ink-l);padding:5px 8px;font-size:9px;color:var(--ink);white-space:nowrap;z-index:100;pointer-events:none;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.bar-wrap{margin-bottom:7px}
.bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-ll);margin-bottom:2px}
.bar{height:4px;background:rgba(80,65,40,.1)}
.bar-fill{height:100%;transition:width .5s}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:9px}
.ri{background:rgba(255,252,245,.5);border:1px solid var(--border);padding:6px 8px}
.ri-n{font-size:9px;color:var(--ink-ll);letter-spacing:1px;margin-bottom:2px}
.ri-v{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--ink)}
.ri-d{font-size:9px;margin-top:1px}
.pos{color:#1a7a3a}.neg{color:#c03030}.neuc{color:#8a6a20}

/* 粮食状态框 - 新版"可撑旬数"判断 */
.fs-ok  {padding:7px 9px;border:1px solid rgba(26,122,58,.35); background:rgba(26,122,58,.06); color:#1a7a3a;font-size:11px;font-family:'Noto Serif SC',serif;margin-bottom:9px}
.fs-warn{padding:7px 9px;border:1px solid rgba(184,122,16,.35);background:rgba(184,122,16,.06);color:#8a6a10;font-size:11px;font-family:'Noto Serif SC',serif;margin-bottom:9px}
.fs-crit{padding:7px 9px;border:1px solid rgba(192,48,48,.35); background:rgba(192,48,48,.06);color:#c03030;font-size:11px;font-family:'Noto Serif SC',serif;margin-bottom:9px}

/* 存粮进度条 */
.storage-bar-wrap{margin-bottom:9px}
.storage-bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-ll);margin-bottom:3px}
.storage-bar{height:6px;background:rgba(80,65,40,.1);border-radius:1px}
.storage-bar-fill{height:100%;transition:width .5s;border-radius:1px}

/* BUILDINGS */
.bld-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:9px}
.bld{border:1px solid var(--border);padding:5px 7px;cursor:pointer;transition:all .2s;position:relative;background:rgba(255,252,245,.4)}
.bld:hover{border-color:rgba(80,65,40,.35);background:rgba(80,65,40,.05)}
.bld.maxed{border-color:var(--ink-ll);background:rgba(80,65,40,.07)}
.bld.building{border-color:rgba(26,95,138,.4);background:rgba(26,95,138,.06)}
.bld.locked{opacity:.35;cursor:not-allowed}
.bld-n{font-size:10px;color:var(--ink);margin-bottom:2px}
.bld-lv{font-size:9px;color:var(--ink-ll)}
.bld-prog{position:absolute;bottom:0;left:0;height:2px;background:var(--ink-l);transition:width .3s}

/* ACTIONS */
.act-btn{width:100%;padding:7px;background:transparent;border:1px solid var(--border);color:var(--ink);font-family:'Noto Serif SC',serif;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .2s;margin-bottom:4px;text-align:left;display:flex;align-items:center;gap:6px}
.act-btn:hover{background:rgba(80,65,40,.06);border-color:var(--ink-ll);color:var(--ink)}
.act-btn:disabled{opacity:.3;cursor:not-allowed}

/** 获取squad当前生效标签（多标签读_classChoice，单标签读[0]） */
function getSquadClass(sq) {
  if(!sq || !sq.genName) return 'warrior';
  if(sq._classChoice && (GEN_CLASS[sq.genName]||[]).includes(sq._classChoice)) return sq._classChoice;
  return (GEN_CLASS[sq.genName]||['warrior'])[0];
}

/** 计算一支部队的四类buff汇总 */
function getUnitClassBuffs(unit) {
  let warriors=0, commanders=0, strategists=0, ministers=0;
  (unit.squads||[]).forEach(sq => {
    if(!sq) return;
    const cls = getSquadClass(sq);
    if(cls==='warrior') warriors++;
    else if(cls==='commander') commanders++;
    else if(cls==='strategist') strategists++;
    else if(cls==='minister') ministers++;
  });
  const hasCmd = commanders === 1; // ≥2失效
  return {
    morale: hasCmd ? 5 : 0,
    duelPct: warriors * (hasCmd ? 0.05 : 0.03),
    tacticPct: strategists * (hasCmd ? 0.05 : 0.03),
    supplyRange: ministers > 0 ? (hasCmd ? 2 : 1) : 0,
    cmdConflict: commanders >= 2,
    warriors, commanders, strategists, ministers,
  };
}

/** 被动单挑中，按标签修正该武将被选为单挑对象的权重 */
function getClassDuelWeight(genName, classChoice) {
  const cls = classChoice || (GEN_CLASS[genName]||['warrior'])[0];
  if(cls==='commander') return 0.5;
  if(cls==='strategist' || cls==='minister') return 0.1;
  return 1.0; // warrior
}

/** 生成武将类型标签HTML（用于列表/详情等） */
function genClassTagsHtml(genName) {
  const classes = GEN_CLASS[genName] || ['warrior'];
  return classes.map(c => {
    const m = CLASS_META[c];
    return `<span class="gen-class-tag ${c}" title="${m.label}">${m.icon}${m.label}</span>`;
  }).join('');
}

/** 生成多标签选择器HTML（编组弹窗用） */
function genClassSelectorHtml(genName, currentChoice, slotKey) {
  const classes = GEN_CLASS[genName] || ['warrior'];
  if(classes.length <= 1) return genClassTagsHtml(genName); // 单标签直接显示
  const chosen = currentChoice || classes[0];
  return `<span class="gen-class-sel">${classes.map(c => {
    const m = CLASS_META[c];
    return `<span class="gen-class-btn ${c}${c===chosen?' active':''}" onclick="_rmSetClass('${slotKey}','${c}')" title="${m.label}">${m.icon}${m.label}</span>`;
  }).join('')}</span>`;
}

/** 生成编组buff预览HTML */
function genClassBuffsHtml(mainGen, mainClass, sub1Gen, sub1Class, sub1Active, sub2Gen, sub2Class, sub2Active) {
  // 构造虚拟unit计算buff
  const squads = [];
  if(mainGen) squads.push({genName:mainGen, _classChoice:mainClass});
  if(sub1Active && sub1Gen) squads.push({genName:sub1Gen, _classChoice:sub1Class});
  if(sub2Active && sub2Gen) squads.push({genName:sub2Gen, _classChoice:sub2Class});
  if(squads.length === 0) return '';
  const b = getUnitClassBuffs({squads});
  const lines = [];
  if(b.cmdConflict) lines.push('<span class="warn">⚠ 双统帅冲突：统帅增幅失效</span>');
  if(b.morale > 0) lines.push(`🏴 统帅增幅：战斗士气+${b.morale}`);
  if(b.duelPct > 0) lines.push(`⚔️ 武将×${b.warriors}${b.morale>0?'（增幅）':''}：被动单挑+${Math.round(b.duelPct*100)}%`);
  if(b.tacticPct > 0) lines.push(`🧠 谋士×${b.strategists}${b.morale>0?'（增幅）':''}：计谋+${Math.round(b.tacticPct*100)}%`);
  if(b.supplyRange > 0) lines.push(`📜 能臣${b.morale>0?'（增幅）':''}：补给+${b.supplyRange}格`);
  if(lines.length === 0) return '';
  return `<div class="rm-buffs">${lines.join('<br>')}</div>`;
}

/** 显示朝议弹窗（玩家） */
function showCourtCouncil(proposals){
  if(!proposals || !proposals.length) return;
  const selectCount = proposals.length >= 2 ? 2 : 1;
  const autoPass = proposals.length === 1;

  // ★ I3 fix: 仅1个提案时自动通过，不弹弹窗（仅日志通知）
  if(autoPass){
    _applyCourtDecisions(G.playerFac, proposals, [0]);
    renderAllLight();
    return;
  }

  let selected = [];

  function fmtEffect(p){
    if(p.proposal.buffKey === 'morale') return `+${p.effectVal.toFixed(1)}/旬`;
    return (p.effectVal > 0 ? '+' : '') + (p.effectVal*100).toFixed(1) + '%';
  }

  const modal = document.getElementById('courtModal');
  const body = document.getElementById('courtModalBody');
  const seasonLabel = document.getElementById('courtSeasonLabel');
  seasonLabel.textContent = (YEARS[G.year]||'') + ' · ' + (SEASONS[G.seasonIdx]||'');

  function render(){
    let html = `<div style="font-size:11px;color:rgba(44,36,22,.55);margin-bottom:14px;text-align:center">
      ${proposals.length}位重臣各呈一策，请择二而行。
    </div><div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:18px">`;
    proposals.forEach((p, i) => {
      const sel = selected.includes(i);
      const facDef = FACTION_DEFS.find(f=>f.id===p.factionId);
      const facLabel = facDef?.label || '无派系';
      const statName = p.proposal.statScale === 'com' ? '统' : '政';
      const statVal = p.proposer[p.proposal.statScale] || 70;
      const pctStr = fmtEffect(p);
      const tierLabel = p.postDef.tier === 1 ? '一品' : '二品';
      html += `<div class="court-card" data-cidx="${i}" style="
        width:145px;padding:14px;border-radius:3px;cursor:pointer;user-select:none;
        border:1px solid ${sel?'rgba(92,74,50,.55)':'rgba(80,65,40,.14)'};
        background:${sel?'rgba(80,65,40,.06)':'rgba(255,252,245,.50)'};
        box-shadow:${sel?'0 2px 12px rgba(80,65,40,.10)':'none'};
        transition:all .15s;position:relative;
      ">
        ${sel?'<div style="position:absolute;top:5px;right:7px;color:var(--ink-l);font-size:13px;font-weight:bold">✓</div>':''}
        <div style="font-size:14px;color:#6b5530;font-weight:bold;margin-bottom:5px">${p.proposal.name}</div>
        <div style="font-size:10px;color:rgba(44,36,22,.40);margin-bottom:8px">${tierLabel}·${p.postDef.name}</div>
        <div style="font-size:11px;color:rgba(44,36,22,.80);margin-bottom:3px">
          提案人：<span style="color:#6b5530">${p.proposer.name}</span>
        </div>
        <div style="font-size:9px;color:rgba(92,74,50,.45);margin-bottom:8px">${facLabel}</div>
        <div style="font-size:11px;color:rgba(44,36,22,.60);line-height:1.7">
          ${p.proposal.desc}<br>
          <span style="color:#1a7a3a;font-weight:bold">效果：${pctStr}</span>
          <span style="font-size:9px;color:rgba(44,36,22,.30)">（${statName}${statVal}）</span>
        </div>
      </div>`;
    });
    html += `</div>`;
    const canConfirm = selected.length === selectCount;
    html += `<div style="text-align:center;padding-bottom:4px">
      <button id="_courtBtnOk" style="
        padding:9px 32px;border:1px solid ${canConfirm?'rgba(92,74,50,.45)':'rgba(80,70,50,.18)'};border-radius:2px;font-size:13px;
        font-family:'Noto Serif SC',serif;letter-spacing:2px;
        background:${canConfirm?'rgba(245,238,225,.95)':'rgba(245,238,225,.5)'};
        color:${canConfirm?'var(--ink)':'rgba(44,36,22,.25)'};
        cursor:${canConfirm?'pointer':'not-allowed'};
        opacity:${canConfirm?'1':'0.5'};box-shadow:${canConfirm?'0 1px 6px rgba(80,65,40,.12)':'none'};
        transition:all .2s;
      ">批准（${selected.length}/${selectCount}）</button>
    </div>`;
    body.innerHTML = html;

    // Bind card clicks
    body.querySelectorAll('.court-card').forEach(card => {
      card.addEventListener('click', function(){
        const idx = parseInt(this.dataset.cidx);
        const si = selected.indexOf(idx);
        if(si >= 0) selected.splice(si, 1);
        else if(selected.length < selectCount) selected.push(idx);
        render();
      });
    });
    // Bind confirm button
    const btn = document.getElementById('_courtBtnOk');
    if(btn) btn.addEventListener('click', function(){
      if(selected.length !== selectCount) return;
      _applyCourtDecisions(G.playerFac, proposals, selected);

/** 迁民弹窗UI */
function showMigrateDialog(srcCityId){
  const check = canMigrate(srcCityId);
  if(!check.ok){ showNotif(check.reason, 'warn'); return; }
  const src = G.cities[srcCityId];
  const targets = getMigrateTargets(srcCityId);
  const srcReg = CITY_TO_STATE[srcCityId];

  // 构建弹窗
  let dstId = targets[0];
  let ratio = 0.50;

  function buildContent(){
    const dst = G.cities[dstId];
    // ★ v166: 科技减免
    const _uiLossReduce = getTechEffect(src.fac, 'migrateLossReduce');
    const _uiDstReduce = 1 - getTechEffect(src.fac, 'migrateDstPenReduce');
    const _uiLossRate = Math.max(0.10, MIGRATE_LOSS_RATE - _uiLossReduce);
    const hasMigTech = _uiLossReduce > 0;

    const movedPop = Math.floor(src.pop * ratio);
    const arrivedPop = Math.floor(movedPop * (1 - _uiLossRate));
    const lostPop = movedPop - arrivedPop;
    const srcScale = ratio / 0.50;
    const dstPopBefore = dst.pop;
    const dstRatio = arrivedPop / Math.max(1, dstPopBefore);
    const dstScale = dstRatio / 0.30;
    const dstReg = CITY_TO_STATE[dstId];
    const isSameReg = srcReg && dstReg && srcReg === dstReg;
    const countyMod = isSameReg ? MIGRATE_COUNTY_SAME : MIGRATE_COUNTY_CROSS;

    // 目的城粮食预估
    const dstFoodNow = getCityFoodTurns(dst);
    // 粗估迁入后可撑旬数
    const dstNetNow = getCityFoodNet(dst);
    const extraCost = arrivedPop * 0.0004;
    const dstNetAfter = dstNetNow - extraCost;
    const dstFoodAfter = dstNetAfter >= 0 ? Infinity : (dst.storage > 0 ? dst.storage / (-dstNetAfter) : 0);

    const dstOptions = targets.map(tid => {
      const tc = G.cities[tid];
      return `<option value="${tid}" ${tid===dstId?'selected':''}>${tc.name}（${fmt(tc.pop)}人）</option>`;
    }).join('');

    const warnColor = dstRatio > 0.50 ? '#c03030' : dstRatio > 0.25 ? '#8a6a10' : 'rgba(44,36,22,.6)';
    const foodWarnAfter = dstFoodAfter < 5 ? '#c03030' : dstFoodAfter < 10 ? '#8a6a10' : '#1a7a3a';

    return `<div style="font-family:'Noto Serif SC',serif;padding:18px 22px;max-width:380px">
      <div style="font-size:15px;color:#6b5530;font-weight:700;margin-bottom:12px">⇄ 迁移人口 — ${src.name}</div>
      <div style="font-size:10px;color:rgba(44,36,22,.4);margin-bottom:14px">强制迁移城市人口至邻城。代价极大，仅适用于预判丢城时的焦土策略。</div>

      <div style="margin-bottom:10px">
        <span style="font-size:10px;color:rgba(44,36,22,.55)">目的地：</span>
        <select id="_migDst" style="font-size:11px;padding:3px 6px;border:1px solid rgba(80,65,40,.2);border-radius:2px;background:rgba(255,252,245,.8);font-family:inherit">${dstOptions}</select>
        <span style="font-size:9px;color:rgba(92,74,50,.35);margin-left:4px">${isSameReg?'同地域':'跨地域 ⚠'}</span>
      </div>

      <div style="margin-bottom:6px;font-size:10px;color:rgba(44,36,22,.55)">迁移比例：<b style="color:#6b5530">${Math.round(ratio*100)}%</b></div>
      <input type="range" id="_migSlider" min="${MIGRATE_MIN_RATIO*100}" max="${MIGRATE_MAX_RATIO*100}" value="${Math.round(ratio*100)}" step="5" style="width:100%;margin-bottom:4px;accent-color:#8a7040">
      <div style="display:flex;justify-content:space-between;font-size:9px;color:rgba(92,74,50,.4);margin-bottom:14px">
        <span>迁出 ${fmt(movedPop)}人</span>
        <span style="color:#c03030">损耗 ${fmt(lostPop)}人（${Math.round(_uiLossRate*100)}%${hasMigTech?' <span style="color:#5a8a3a;font-size:8px">徙民实边-10%</span>':''}）</span>
        <span style="color:#1a7a3a">到达 ${fmt(arrivedPop)}人</span>
      </div>

      <div style="border-top:1px solid rgba(80,65,40,.1);padding-top:10px;margin-bottom:8px">
        <div style="font-size:10px;color:#6b5530;font-weight:700;margin-bottom:6px">来源城（${src.name}）</div>
        <div style="font-size:10px;color:rgba(44,36,22,.6);line-height:2">
          人口　${fmt(src.pop)} → <b>${fmt(src.pop - movedPop)}</b><br>
          <span style="color:#c03030">民心 ${(MIGRATE_SRC_BASE.morale*srcScale).toFixed(1)}</span>　
          <span style="color:#c03030">质量 ${(MIGRATE_SRC_BASE.quality*srcScale).toFixed(1)}</span>　
          <span style="color:#c03030">存粮 ${Math.round(MIGRATE_SRC_BASE.storagePct*srcScale*100)}%</span><br>
          <span style="color:#c03030">属县忠诚 全县${countyMod.src>0?'+':''}${Math.round(countyMod.src*srcScale)}</span>
        </div>
      </div>

      <div style="border-top:1px solid rgba(80,65,40,.1);padding-top:10px;margin-bottom:8px">
        <div style="font-size:10px;color:#6b5530;font-weight:700;margin-bottom:6px">目的城（${dst.name}）</div>
        <div style="font-size:10px;color:rgba(44,36,22,.6);line-height:2">
          人口　${fmt(dstPopBefore)} → <b>${fmt(dstPopBefore + arrivedPop)}</b><br>
          涌入比　<span style="color:${warnColor};font-weight:700">${Math.round(dstRatio*100)}%</span><br>
          <span style="color:#c03030">民心 ${(MIGRATE_DST_BASE.morale*dstScale*_uiDstReduce).toFixed(1)}</span>　
          <span style="color:#c03030">质量 ${(MIGRATE_DST_BASE.quality*dstScale*_uiDstReduce).toFixed(1)}</span>${hasMigTech?'<span style="color:#5a8a3a;font-size:8px"> 徙民实边-30%</span>':''}<br>
          <span style="color:#c03030">属县忠诚 全县${countyMod.dst>0?'+':''}${Math.round(countyMod.dst*dstScale)}</span><br>
          粮食可撑　<span style="color:${foodWarnAfter}">${dstFoodAfter===Infinity?'∞':dstFoodAfter.toFixed(1)}旬</span>
          <span style="font-size:9px;color:rgba(92,74,50,.35)">（现${dstFoodNow===Infinity?'∞':dstFoodNow.toFixed(1)}旬）</span>
        </div>
      </div>

      <div style="border-top:1px solid rgba(80,65,40,.1);padding-top:10px;margin-bottom:14px">
        <div style="font-size:10px;color:#6b5530;font-weight:700;margin-bottom:4px">势力影响</div>
        <div style="font-size:10px;color:rgba(44,36,22,.6);line-height:1.8">
          价值观冲击：<span style="color:#c03030">文治→暴政 +3　武略→铁血 +1</span>
          ${!isSameReg?'<br><span style="color:#8a6a10">⚠ 跨地域迁移，士族冲击更大</span>':''}
        </div>
      </div>

      <div style="display:flex;gap:10px;justify-content:center">
        <button id="_migOk" class="act-btn" style="padding:8px 24px;color:#c03030;border-color:rgba(192,48,48,.3)">确认迁移</button>
        <button id="_migCancel" class="act-btn" style="padding:8px 24px">取消</button>
      </div>
    </div>`;
  }

  // 创建modal
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:800;display:flex;align-items:center;justify-content:center';
  const box = document.createElement('div');
  box.style.cssText = 'background:var(--parch,#f5eee1);border:1px solid rgba(80,65,40,.25);border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto';
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  function render(){
    box.innerHTML = buildContent();
    // Bind events
    const slider = document.getElementById('_migSlider');
    const sel = document.getElementById('_migDst');
    if(slider) slider.addEventListener('input', e => { ratio = parseInt(e.target.value)/100; render(); });
    if(sel) sel.addEventListener('change', e => { dstId = e.target.value; render(); });
    const okBtn = document.getElementById('_migOk');
    if(okBtn) okBtn.addEventListener('click', () => {
      executeMigration(srcCityId, dstId, ratio);
      document.body.removeChild(overlay);
      renderAll();
    });
    const cancelBtn = document.getElementById('_migCancel');
    if(cancelBtn) cancelBtn.addEventListener('click', () => document.body.removeChild(overlay));
  }
  render();
  overlay.addEventListener('click', e => { if(e.target === overlay) document.body.removeChild(overlay); });
}

function _doFATransfer(cityId){
  const a=(G.foodAlertCards||[]).find(x=>x.cityId===cityId);
  if(!a||!a.donor) return;
  const donor=G.cities[a.donor.id]; if(!donor) return;
  const amount=Math.floor(getCityFoodCost(G.cities[cityId]).total*8);
  if(amount<=0) return;
  const dist=cityDist(cityId,donor.id);
  doTransfer(donor.id,cityId,amount,Math.ceil(dist*1.5),dist<=1?.05:dist<=2?.12:.20);
}
function confirmFALong(cityId){
  const a=(G.foodAlertCards||[]).find(x=>x.cityId===cityId);
  if(!a||!a.donor) return;
  if(!G.supplyLines) G.supplyLines={};
  G.supplyLines[cityId]={fromId:a.donor.id,fromName:a.donor.name};
  log(`📦 长期补给线：${a.donor.name}→${a.cityName}`,'transfer');
  _doFATransfer(cityId);
  G.foodAlertCards=G.foodAlertCards.filter(x=>x.cityId!==cityId);
  renderFoodAlerts(); renderAllLight();
}
function confirmFAOnce(cityId){
  _doFATransfer(cityId);
  G.foodAlertCards=G.foodAlertCards.filter(x=>x.cityId!==cityId);
  renderFoodAlerts(); renderAllLight();
}
function dismissFA(cityId){
  G.foodAlertCards=G.foodAlertCards.filter(x=>x.cityId!==cityId);
  renderFoodAlerts();
}

// ─── 势力染色叠加层系统（v78：不透明单层纯色，完全覆盖底图） ───

// BFS领地缓存
const _OV_RADIUS = {large:10, medium:7, small:5};
let _ovTerritoryCache = null;
let _ovTerritoryTurn = -1;

function _buildTerritoryMap(){
  if(_ovTerritoryCache && _ovTerritoryTurn === G.turn) return _ovTerritoryCache;
  const territory = {};
  CITIES_DEF.forEach(def => {
    const city = G.cities[def.id]; if(!city) return;
    const fac = city.fac; if(!fac || fac==='rebel') return;
    const radius = (_OV_RADIUS[def.size]||5) + (def.isCapital ? 2 : 0);
    const queue = [{col:def.q, row:def.r, dist:0}];
    const visited = new Set();
    visited.add(hkey(def.q, def.r));
    while(queue.length){
      const {col, row, dist} = queue.shift();
      const k = hkey(col, row);
      const terrain = HEX_TERRAIN[k] || 'plain';
      if(dist > 0 && (terrain === 'impassable' || terrain === 'coastal_water' || terrain === 'deep_water')) continue;
      if(!territory[k] || territory[k].dist > dist){
        territory[k] = {fac, cityId:def.id, dist, cityDef:def};
      }
      if(dist < radius){
        hexNeighbors(col, row).forEach(nb => {
          const nk = hkey(nb.col, nb.row);
          if(!visited.has(nk) && nb.col>=0 && nb.col<HEX_COLS && nb.row>=0 && nb.row<HEX_ROWS){
            visited.add(nk);
            queue.push({col:nb.col, row:nb.row, dist:dist+1});
          }
        });
      }
    }
  });

  // 第二轮：无限BFS回填——所有可通行但无主的hex，归入最近已有归属的hex的城市
  // 确保全地图可通行区域100%被覆盖（解决偏远地区盲区）
  {
    const floodQ = [];
    for(const k in territory){
      const {col, row} = hparse(k);
      hexNeighbors(col, row).forEach(nb => {
        const nk = hkey(nb.col, nb.row);
        if(!territory[nk]){
          const t = HEX_TERRAIN[nk] || 'plain';
          if(t !== 'impassable' && t !== 'coastal_water' && t !== 'deep_water'){
            floodQ.push({col:nb.col, row:nb.row, src:territory[k]});
          }
        }
      });
    }
    let qi = 0;
    while(qi < floodQ.length){
      const {col, row, src} = floodQ[qi++];
      const k = hkey(col, row);
      if(territory[k]) continue; // 已被覆盖（可能被更近的城先到）
      const t = HEX_TERRAIN[k] || 'plain';
      if(t === 'impassable' || t === 'coastal_water' || t === 'deep_water') continue;
      territory[k] = {fac:src.fac, cityId:src.cityId, dist:src.dist+1, cityDef:src.cityDef};
      hexNeighbors(col, row).forEach(nb => {
        const nk = hkey(nb.col, nb.row);
        if(!territory[nk]){
          const nt = HEX_TERRAIN[nk] || 'plain';
          if(nt !== 'impassable' && nt !== 'coastal_water' && nt !== 'deep_water'){
            floodQ.push({col:nb.col, row:nb.row, src:territory[k]});
          }
        }
      });
    }
  }

  _ovTerritoryCache = territory;
  _ovTerritoryTurn = G.turn;
  return territory;
}

// 不透明底层：暗底覆盖全图，每旬缓存
let _ovBaseCache = null;
let _ovBaseTurn = -1;
function _renderOvBase(){
  if(_ovBaseCache && _ovBaseTurn === G.turn) return _ovBaseCache;
  const parts = [];
  for(let c=0; c<HEX_COLS; c++){
    for(let r=0; r<HEX_ROWS; r++){
      const k = hkey(c,r);
      const t = HEX_TERRAIN[k] || 'plain';
      const px = hexToPixel(c,r);
      let fill;
      // ★ v134: 水墨风overlay底色——宣纸暖灰
      if(t === 'water')                               fill = 'rgba(180,175,160,.88)';
      else if(t === 'coastal_water' || t === 'deep_water') fill = 'rgba(155,168,178,.90)';
      else if(t === 'impassable')                     fill = 'rgba(80,72,58,.92)';
      else                                            fill = 'rgba(218,210,192,.93)';
      parts.push(`<path d="${HEX_PATH}" transform="translate(${px.x.toFixed(1)},${px.y.toFixed(1)})" fill="${fill}"/>`);
    }
  }
  _ovBaseCache = parts.join('');
  _ovBaseTurn = G.turn;
  return _ovBaseCache;
}

// ─── 势力范围：水墨晕染风，中心浓边缘淡 ───
const _OV_FAC_RGB = {
  wei:{r:55,g:85,b:125}, shu:{r:45,g:95,b:60}, wu:{r:150,g:55,b:40}, nanman:{r:139,g:105,b:20}
};
function renderOverlayFaction(){
  const terr = _buildTerritoryMap();
  const hexes = [];
  for(let c=0; c<HEX_COLS; c++){
    for(let r=0; r<HEX_ROWS; r++){
      const k = hkey(c,r);
      const t = HEX_TERRAIN[k] || 'plain';
      if(t === 'coastal_water' || t === 'deep_water' || t === 'impassable') continue;
      if(terr[k]) continue;
      const px = hexToPixel(c,r);
      // ★ v134: 无主地用淡墨灰
      hexes.push(`<path d="${HEX_PATH}" transform="translate(${px.x.toFixed(1)},${px.y.toFixed(1)})" fill="rgba(165,155,138,.30)"/>`);
    }
  }
  Object.entries(terr).forEach(([k, {fac, dist, cityDef}]) => {
    const fc = _OV_FAC_RGB[fac]; if(!fc) return;
    const {col, row} = hparse(k);
    const px = hexToPixel(col, row);
    const maxR = (_OV_RADIUS[cityDef.size]||5) + (cityDef.isCapital?2:0);
    // ★ v134: 水墨晕染——中心浓(alpha~0.55)边缘淡(alpha~0.18)
    const alpha = 0.55 - (dist/maxR) * 0.37;
    hexes.push(`<path d="${HEX_PATH}" transform="translate(${px.x.toFixed(1)},${px.y.toFixed(1)})" fill="rgba(${fc.r},${fc.g},${fc.b},${alpha.toFixed(2)})" stroke="rgba(${fc.r},${fc.g},${fc.b},.06)" stroke-width=".3"/>`);
  });
  const FAC_NAME={wei:'曹魏',shu:'蜀汉',wu:'孫吳',nanman:'南蛮'};
  const centers = {};
  CITIES_DEF.forEach(def => {
    const city = G.cities[def.id]; if(!city || !city.fac || city.fac==='rebel') return;
    if(!centers[city.fac]) centers[city.fac] = {sx:0,sy:0,n:0};
    const px = hexToPixel(def.q, def.r);
    centers[city.fac].sx += px.x; centers[city.fac].sy += px.y; centers[city.fac].n++;
  });
  Object.entries(FAC_NAME).forEach(([fac,name]) => {
    const c = centers[fac]; if(!c || !c.n) return;
    const fc = _OV_FAC_RGB[fac]||{r:80,g:65,b:40};
    hexes.push(`<text x="${(c.sx/c.n).toFixed(0)}" y="${(c.sy/c.n).toFixed(0)}" text-anchor="middle" font-family="ZCOOL XiaoWei,Noto Serif SC,serif" font-size="30" font-weight="900" fill="rgba(${fc.r},${fc.g},${fc.b},.18)" pointer-events="none" letter-spacing="10px">${name}</text>`);
  });
  return hexes.join('');
}

// ─── 金钱产出：水墨赭石色系，淡墨→浓赭 ───
function renderOverlayGold(){
  const terr = _buildTerritoryMap();
  const cityGold = {};
  let maxGold = 1;
  CITIES_DEF.forEach(def => {
    const city = G.cities[def.id]; if(!city) return;
    const g = getCityProd(city).gold || 0;
    cityGold[def.id] = g;
    if(g > maxGold) maxGold = g;
  });
  const hexes = [];
  Object.entries(terr).forEach(([k, {fac, cityId, dist, cityDef}]) => {
    const {col, row} = hparse(k);
    const px = hexToPixel(col, row);
    const val = cityGold[cityId] || 0;
    const intensity = val / maxGold;
    const maxR = (_OV_RADIUS[cityDef.size]||5) + (cityDef.isCapital?2:0);
    const distFade = 1.0 - (dist/maxR) * 0.4;
    const t = intensity * distFade;
    // ★ v134: 赭石墨色——淡灰棕→浓赭石
    const alpha = 0.20 + t * 0.50;
    const cr = Math.round(140 + t * 55);  // 140→195 赭
    const cg = Math.round(115 + t * 25);  // 115→140 石
    const cb = Math.round(75 - t * 20);   // 75→55 暖
    hexes.push(`<path d="${HEX_PATH}" transform="translate(${px.x.toFixed(1)},${px.y.toFixed(1)})" fill="rgba(${cr},${cg},${cb},${alpha.toFixed(2)})"/>`);
  });
  hexes.push(`<g transform="translate(8,530)"><rect width="155" height="28" rx="3" fill="rgba(245,238,225,.94)" stroke="rgba(80,65,40,.25)" stroke-width=".8"/><text x="8" y="12" font-family="Noto Serif SC,serif" font-size="8" fill="rgba(44,36,22,.75)">💰 金钱产出</text><rect x="8" y="17" width="55" height="6" rx="2" fill="url(#ovGoldGrad)"/><text x="67" y="23" font-size="6.5" font-family="Noto Serif SC,serif" fill="rgba(44,36,22,.55)">低 → 高</text></g>`);
  hexes.push(`<defs><linearGradient id="ovGoldGrad"><stop offset="0%" stop-color="rgba(140,115,75,.25)"/><stop offset="100%" stop-color="rgba(195,140,55,.70)"/></linearGradient></defs>`);
  return hexes.join('');
}

// ─── 存粮：水墨风——朱砂红/赭黄/松烟绿，半透明晕染 ───
function renderOverlayFood(){
  const terr = _buildTerritoryMap();
  const cityData = {};
  CITIES_DEF.forEach(def => {

  });
  const hexes = [];
  Object.entries(terr).forEach(([k, {fac, cityId, dist, cityDef}]) => {
    const {col, row} = hparse(k);
    const px = hexToPixel(col, row);
    const d = cityData[cityId]; if(!d) return;
    const maxR = (_OV_RADIUS[cityDef.size]||5) + (cityDef.isCapital?2:0);

// ─── 产粮：暗褐→亮绿渐变，一层纯色 ───
// ─── v88: 补给线覆盖层——绿色=补给充足，红色=断补 ───
function renderOverlaySupply(){
  const supplyMap = buildSupplyMap(G.playerFac);
  const hexes = [];
  for(let c=0; c<HEX_COLS; c++){
    for(let r=0; r<HEX_ROWS; r++){
      const k = hkey(c,r);
      const t = HEX_TERRAIN[k] || 'plain';
      if(t === 'coastal_water' || t === 'deep_water' || t === 'impassable') continue;
      if(t === 'water') continue;
      const px = hexToPixel(c,r);
      const remaining = supplyMap[k];
      if(remaining !== undefined){
        // ★ v134: 水墨松烟绿——越近越浓
        const intensity = Math.max(0.25, remaining / SUPPLY_MAX_RANGE);
        const alpha = 0.15 + intensity * 0.45;
        hexes.push(`<path d="${HEX_PATH}" transform="translate(${px.x.toFixed(1)},${px.y.toFixed(1)})" fill="rgba(55,110,65,${alpha.toFixed(2)})"/>`);
      } else {
        // ★ v134: 断补用淡朱砂
        hexes.push(`<path d="${HEX_PATH}" transform="translate(${px.x.toFixed(1)},${px.y.toFixed(1)})" fill="rgba(155,45,35,.30)"/>`);
      }
    }
  }
  // 标注断粮部队
  G.units.filter(u => u.fac === G.playerFac && (u._noSupplyTurns||0) > 0).forEach(u => {
    const px = hexToPixel(u.hq??0, u.hr??0);
    const turns = u._noSupplyTurns;
    const label = turns <= SUPPLY_RATIONS ? `存粮${SUPPLY_RATIONS-turns}旬` : `断粮${turns-SUPPLY_RATIONS}旬`;
    hexes.push(`<circle cx="${px.x}" cy="${px.y}" r="8" fill="none" stroke="rgba(175,50,40,.80)" stroke-width="1.5" stroke-dasharray="3,2">
      <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/></circle>`);
    hexes.push(`<text x="${px.x}" y="${px.y-12}" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="7" fill="rgba(175,50,40,.85)" font-weight="700">${label}</text>`);
  });
  // 图例
  hexes.push(`<g transform="translate(8,530)"><rect width="160" height="28" rx="3" fill="rgba(245,238,225,.94)" stroke="rgba(80,65,40,.25)" stroke-width=".8"/>
    <text x="8" y="12" font-family="Noto Serif SC,serif" font-size="8" fill="rgba(44,36,22,.75)">🚚 补给覆盖</text>
    <rect x="8" y="17" width="20" height="6" rx="2" fill="rgba(55,110,65,.55)"/><text x="32" y="23" font-size="6" fill="rgba(44,36,22,.55)">充足</text>
    <rect x="55" y="17" width="20" height="6" rx="2" fill="rgba(155,45,35,.40)"/><text x="79" y="23" font-size="6" fill="rgba(44,36,22,.55)">断补</text>
  </g>`);
  return hexes.join('');
}

function renderOverlayFoodFlow(){
  const terr = _buildTerritoryMap();
  const cityFood = {};
  let maxFood = 1;
  CITIES_DEF.forEach(def => {
    const city = G.cities[def.id]; if(!city) return;
    const f = Math.max(0, getCityProd(city).food || 0);
    cityFood[def.id] = f;
    if(f > maxFood) maxFood = f;
  });
  const hexes = [];
  Object.entries(terr).forEach(([k, {fac, cityId, dist, cityDef}]) => {
    const {col, row} = hparse(k);
    const px = hexToPixel(col, row);
    const val = cityFood[cityId] || 0;
    const intensity = val / maxFood;
    const maxR = (_OV_RADIUS[cityDef.size]||5) + (cityDef.isCapital?2:0);
    const distFade = 1.0 - (dist/maxR) * 0.4;
    const t = intensity * distFade;
    // ★ v134: 松烟墨绿——淡灰→浓松烟
    const alpha = 0.18 + t * 0.48;
    const cr = Math.round(70 - t * 25);   // 70→45
    const cg = Math.round(85 + t * 55);   // 85→140
    const cb = Math.round(60 + t * 15);   // 60→75
    hexes.push(`<path d="${HEX_PATH}" transform="translate(${px.x.toFixed(1)},${px.y.toFixed(1)})" fill="rgba(${cr},${cg},${cb},${alpha.toFixed(2)})"/>`);
  });
  hexes.push(`<g transform="translate(8,530)"><rect width="155" height="28" rx="3" fill="rgba(245,238,225,.94)" stroke="rgba(80,65,40,.25)" stroke-width=".8"/><text x="8" y="12" font-family="Noto Serif SC,serif" font-size="8" fill="rgba(44,36,22,.75)">📊 粮食产量</text><rect x="8" y="17" width="55" height="6" rx="2" fill="url(#ovFoodGrad)"/><text x="67" y="23" font-size="6.5" font-family="Noto Serif SC,serif" fill="rgba(44,36,22,.55)">低 → 高</text></g>`);
  hexes.push(`<defs><linearGradient id="ovFoodGrad"><stop offset="0%" stop-color="rgba(70,85,60,.22)"/><stop offset="100%" stop-color="rgba(45,140,75,.65)"/></linearGradient></defs>`);
  return hexes.join('');
}

function _buildStaticMapCache() {

        if(r3>0.25){

        if(r2>0.4) h += `<ellipse cx="${p.x-S*(.08+r0*.05)}" cy="${p.y+ty+S*.03}" rx="${S*(.12+r4*.04)}" ry="${S*(.10+r1*.03)}" fill="rgba(18,42,15,.28)" stroke="none"/>`;
      } else if(terrain === 'hill'){

        h += `<path d="M${-S*.28},${ay} Q${-S*.08+r1*S*.05},${-S*.12-r2*S*.08} ${S*.10},${ay}" transform="translate(${px},${py})" fill="none" stroke="rgba(60,45,25,.45)" stroke-width="${(.5+r3*.4).toFixed(2)}" stroke-linecap="round"/>`;

let _fogSvgCache = '';

function invalidateFogCache() { _fogCacheVersion++; }

function _getFogSvgCache() {
  if (_fogCacheTurn === _fogCacheVersion && _fogSvgCache) return _fogSvgCache;
  const pFog = G.fog?.[G.playerFac];
  if (!pFog) { _fogSvgCache = ''; _fogCacheTurn = _fogCacheVersion; return ''; }
  let fogExplored = '', fogUnexplored = '';
  for (let col = 0; col < HEX_COLS; col++) {
    for (let row = 0; row < HEX_ROWS; row++) {
      const k = hkey(col, row);
      const level = pFog[k] ?? FOG_UNEXPLORED;
      if (level === FOG_VISIBLE) continue;
      if ((HEX_TERRAIN[k] || 'plain') === 'impassable') continue; // impassable始终可见
      if ((HEX_TERRAIN[k] || 'plain') === 'deep_water') continue; // 深海始终可见
      if ((HEX_TERRAIN[k] || 'plain') === 'coastal_water') continue; // 近海始终可见
      const p = hexToPixel(col, row);
      const tx = p.x.toFixed(1), ty = p.y.toFixed(1);
      if (level === FOG_UNEXPLORED) {
        fogUnexplored += `<path d="${HEX_PATH}" transform="translate(${tx},${ty})"/>`;
      } else {
        fogExplored += `<path d="${HEX_PATH}" transform="translate(${tx},${ty})"/>`;
      }
    }
  }
  let result = '';
  if (fogUnexplored) result += `<g fill="rgba(110,100,80,.93)" stroke="rgba(95,85,68,.95)" stroke-width="0.5" pointer-events="none">${fogUnexplored}</g>`;
  if (fogExplored) result += `<g fill="rgba(170,160,138,.48)" stroke="rgba(155,145,125,.50)" stroke-width="0.5" pointer-events="none">${fogExplored}</g>`;
  _fogSvgCache = result;
  _fogCacheTurn = _fogCacheVersion;

}

// ★ v115优化: 围城指示独立渲染函数（供增量更新调用）
function _renderSiegeIndicators() {
  let sh = '';
  CITIES_DEF.forEach(def => {
    const city = G.cities[def.id]; if (!city) return;
    const fogLv = G.fog?.[G.playerFac] ? (G.fog[G.playerFac][hkey(def.q, def.r)] ?? FOG_UNEXPLORED) : FOG_VISIBLE;
    if (fogLv !== FOG_VISIBLE) return;
    const siegeUnits = G.units.filter(u => u.status === 'siege' && u.siegeTarget === def.id);
    if (!siegeUnits.length) return;
    const atkFac = siegeUnits[0].fac;
    const atkCol = FAC[atkFac]?.color || '#c03030';
    const defMult = getSiegeDefMult(city);
    const invS = 'scale(' + (1/_mapScale).toFixed(4) + ')';
    const siegeTurns = siegeUnits[0]._siegeTurnCount || 0;
    const mainLabel = '围' + siegeTurns + '旬·' + city.name;
    const defLabel = ' 防' + Math.round((defMult-1)*100) + '%';
    const boxW = mainLabel.length * 5.8 + defLabel.length * 5.2 + 6;
    const ax = 12, ay = -8;
    sh += '<g transform="translate(' + def.x + ',' + def.y + ')" pointer-events="none">' +
      '<g transform="' + invS + '">' +
      '<rect x="' + ax + '" y="' + (ay-8) + '" width="' + boxW.toFixed(0) + '" height="15" rx="3"' +
        ' fill="rgba(245,238,225,.92)" stroke="' + atkCol + '" stroke-width=".9"/>' +
      '<text x="' + (ax+3) + '" y="' + (ay+3) + '" font-size="6.5" font-family="Noto Serif SC,serif"' +
        ' fill="' + atkCol + '" font-weight="700">' + mainLabel + '</text>' +
      '<text x="' + (ax+3+mainLabel.length*5.8) + '" y="' + (ay+3) + '" font-size="6"' +
        ' font-family="Noto Serif SC,serif" fill="rgba(44,36,22,.65)">' + defLabel + '</text>' +
      '</g></g>';
  });
  return sh;
}

// ★ v115优化: 移动范围+选中提示独立渲染函数
let _moveRangeCache = { unitId: null, ap: -1, svg: '' }; // ★ v167fix #35
function _renderMoveRange() {
  let mh = '';
  if (!G.selUnitId) { _moveRangeCache.unitId = null; return mh; }
  mh += `<rect x="0" y="0" width="960" height="28" fill="rgba(55,30,6,.80)"/>
    <text x="480" y="19" text-anchor="middle" font-family="Noto Serif SC,serif"
      font-size="11" fill="rgba(228,202,148,.88)" letter-spacing="1">点击目标城市或地图hex出发 · 右键取消选中</text>`;
  const selUnit = G.units.find(u => u.id === G.selUnitId);
  const _canShowRange = selUnit && selUnit.fac === G.playerFac
    && !(selUnit.mobilizingTurns > 0)
    && selUnit.status !== 'camp' && selUnit.status !== 'ambush' && selUnit.status !== 'siege';
  if (_canShowRange) {
    const ap = selUnit._apRemaining ?? calcUnitAP(selUnit);
    // ★ v167fix #35: 缓存BFS结果，同一部队+同AP不重算
    if (_moveRangeCache.unitId === G.selUnitId && _moveRangeCache.ap === ap) {
      return mh + _moveRangeCache.svg;
    }
    let _rangeSvg = ''; // ★ v167fix #35
    const troopType = getMainTroopType(selUnit);
    const visited = {};
    const _selOnWater = isUnitOnWater(selUnit); // ★ v138
    const queue = [{col: selUnit.hq, row: selUnit.hr, cost: 0, onWater: _selOnWater}];
    visited[hkey(selUnit.hq, selUnit.hr)] = 0;
    while (queue.length) {
      const cur = queue.shift();
      for (const nb of hexNeighbors(cur.col, cur.row)) {
        const nk = hkey(nb.col, nb.row);
        const nbIsWater = WATER_TERRAINS.has(HEX_TERRAIN[nk] || 'plain'); // ★ v138
        const mc = getHexMoveCost(nb.col, nb.row, troopType, cur.onWater);
        if (mc >= 999) continue;
        const cid = HEX_CITY[nk];
        if (cid) { const cc = G.cities[cid]; if (cc && cc.fac !== selUnit.fac && cc.fac !== 'none') continue; }
        if (G.units.some(ou => ou.id !== selUnit.id && ou.hq === nb.col && ou.hr === nb.row)) {
          const isOwnCityHex = cid && G.cities[cid] && G.cities[cid].fac === selUnit.fac;
          if (!isOwnCityHex) continue;
        }
        // ★ v138: 水陆转换消耗全部剩余AP（到达后AP清零，不能继续走）
        const _transition = cur.onWater !== nbIsWater;
        const nc = _transition ? ap : cur.cost + mc; // transition = 用光AP
        if (nc <= ap && (visited[nk] === undefined || nc < visited[nk])) {
          visited[nk] = nc;
          // transition后不继续扩展（AP已清零），只有非transition才入队
          if (!_transition) queue.push({col: nb.col, row: nb.row, cost: nc, onWater: nbIsWater});
        }
      }
    }
    for (const [k, cost] of Object.entries(visited)) {
      if (k === hkey(selUnit.hq, selUnit.hr)) continue;
      const {col: hc, row: hr} = hparse(k);
      const p = hexToPixel(hc, hr);
      _rangeSvg += `<path d="${HEX_PATH_INNER}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})"
        fill="rgba(120,95,45,.12)" stroke="rgba(120,95,45,.35)" stroke-width="0.8" pointer-events="none"/>`;
    }
    _moveRangeCache = { unitId: G.selUnitId, ap, svg: _rangeSvg };
    mh += _rangeSvg;
  }
  return mh;
}

  const cur = tech.current;

  const branchIcons = {'经济':'💰','军事':'⚔','练兵':'🏋','政治':'📋','民生':'🏘'};
  const branchStats = {'经济':'INT','军事':'COM','练兵':'WAR','政治':'CHA','民生':'POL'};

  // 获取闲置武将列表（用于选择研究武将）
  const deployed = new Set();

  const researchingGen = cur ? cur.genName : null;
  const idleGens = (G.generals[fid] || []).filter(g =>

  let html = `<div class="sec">科技总览 ${_tabHelpHtml('tech')}</div>`;

  if (cur) {
    const def = TECH_TREE[cur.techId];
    const pct = Math.round(((cur.turnsTotal - cur.turnsLeft) / cur.turnsTotal) * 100);
    const gen = GEN_MAP[cur.genName];

        <div style="background:rgba(80,65,40,.10);height:8px;border-radius:4px;overflow:hidden;margin:4px 0">

      </div>`;
  } else {
    html += `<div class="sec">当前研究</div>

    const researchedCount = branchTechs.filter(([tid]) => tech.researched.has(tid)).length;
    html += `<div class="sec" style="margin-top:6px">${branchIcons[branch]} ${branch}（${researchedCount}/${branchTechs.length}）<span style="float:right;font-size:8px;color:rgba(92,74,50,.35)">${branchStats[branch]}</span></div>`;

    branchTechs.forEach(([tid, def]) => {
      const isResearched = tech.researched.has(tid);
      const isAvailable = available.includes(tid);
      const isCurrent = cur && cur.techId === tid;
      const canAfford = isAvailable && canAffordTech(fid, tid);
      const prereqMet = def.prereq.every(p => tech.researched.has(p));
      const locked = !isResearched && !prereqMet;

      // 颜色和状态
      let bg, border, nameCol, statusText, statusCol, descCol, leftBar;
      if (isResearched) {
        bg = 'rgba(26,122,58,.04)'; border = 'rgba(26,122,58,.18)'; nameCol = '#1a7a3a'; statusText = '✅ 已研发';
        statusCol = 'rgba(26,122,58,.5)'; descCol = 'rgba(92,74,50,.45)'; leftBar = '#1a7a3a';
      } else if (isCurrent) {
        bg = 'rgba(100,180,255,.08)'; border = 'rgba(100,180,255,.35)'; nameCol = '#2a6fa8'; statusText = `🔬 研究中（${cur.turnsLeft}旬）`;
        statusCol = '#64b4ff'; descCol = 'rgba(44,36,22,.55)'; leftBar = '#64b4ff';
      } else if (isAvailable && canAfford && !cur) {
        bg = 'rgba(138,112,64,.08)'; border = 'rgba(138,112,64,.35)'; nameCol = 'rgba(44,36,22,.9)'; statusText = '◆ 可研究';
        statusCol = '#8a7040'; descCol = 'rgba(44,36,22,.6)'; leftBar = '#8a7040';
      } else if (isAvailable && !canAfford) {
        bg = 'rgba(80,65,40,.03)'; border = 'rgba(80,65,40,.12)'; nameCol = 'rgba(60,50,35,.55)'; statusText = '资源不足';
        statusCol = '#b04040'; descCol = 'rgba(92,74,50,.4)'; leftBar = 'rgba(80,65,40,.15)';
      } else {
        bg = 'rgba(80,65,40,.02)'; border = 'rgba(80,65,40,.08)'; nameCol = 'rgba(80,65,40,.4)'; statusText = '🔒 未解锁';
        statusCol = 'rgba(80,65,40,.25)'; descCol = 'rgba(92,74,50,.35)'; leftBar = 'rgba(80,65,40,.08)';
      }

      // 费用文本
      const costText = Object.entries(def.cost).map(([r, v]) => {
        const icons = {gold:'💰',wood:'🪵',iron:'⚒',horses:'🐴'};
        const has = (G.factions[fid]?.res?.[r] || 0) >= v;
        return `<span style="color:${has?'rgba(92,74,50,.5)':'#b04040'}">${icons[r]||r}${v}</span>`;
      }).join(' ');

      // 点击研究
      const canClick = isAvailable && canAfford && !cur && !isResearched && idleGens.length > 0;

      html += `<div style="padding:5px 8px 5px 11px;margin:2px 0;background:${bg};border:1px solid ${border};border-left:3px solid ${leftBar};border-radius:3px;${canClick?'cursor:pointer':''};transition:background .15s"
        ${canClick ? `onclick="openTechResearchPicker('${tid}')" onmouseover="this.style.background='rgba(138,112,64,.12)'" onmouseout="this.style.background='${bg}'"` : ''}>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="color:${nameCol};font-size:10px;font-weight:600">${def.icon} ${def.name}</span>
          <span style="font-size:8px;color:${statusCol}">${statusText}</span>
        </div>
        <div style="font-size:8px;color:${descCol};margin-top:1px">${def.desc} · ${def.turns}旬 · ${costText}</div>
        ${locked ? `<div style="font-size:8px;margin-top:2px">前置：${def.prereq.map(p => {
          const pd = TECH_TREE[p];
          const done = tech.researched.has(p);
          return '<span style="color:'+(done?'#50d070':'#b04040')+'">'+(pd?.icon||'')+' '+(pd?.name||p)+(done?' ✓':' ✗')+'</span>';
        }).join(' + ')}</div>` : ''}
      </div>`;
    });
  });

  // ── 闲置武将提示 ──
  if (!cur && idleGens.length === 0) {
    html += `<div style="padding:8px;font-size:9px;color:#8a6a10;text-align:center;margin-top:6px">
      ⚠ 无闲置武将可主持研究（需非出征、非太守的武将）
    </div>`;
  }

  c.innerHTML = html;
}

// 科技研究武将选择弹窗
function openTechResearchPicker(techId) {
  const fid = G.playerFac;
  const def = TECH_TREE[techId];
  if (!def) return;
  if (!canAffordTech(fid, techId)) { showNotif('资源不足', 'warn'); return; }
  if (G.factions[fid]?._tech?.current) { showNotif('已有研究进行中', 'warn'); return; }

  const deployed = new Set();
  G.units.filter(u => u.fac === fid).forEach(u => u.squads.forEach(sq => deployed.add(sq.genName)));
  const prefects = new Set(Object.values(G.cities).filter(c => c.fac === fid && c.prefect).map(c => c.prefect));

  const candidates = (G.generals[fid] || []).filter(g =>
    g.role !== 'ruler' && !deployed.has(g.name) && !prefects.has(g.name)
  ).sort((a, b) => (b[def.stat] || 0) - (a[def.stat] || 0));

  if (!candidates.length) { showNotif('无闲置武将可主持研究', 'warn'); return; }

  const statLabel = {com:'统率',war:'武力',int:'智力',pol:'政治',cha:'魅力'}[def.stat] || def.stat;
  const costText = Object.entries(def.cost).map(([r, v]) => {
    const names = {gold:'金',wood:'木',iron:'铁',horses:'马'};
    return `${names[r]||r}${v}`;
  }).join('·');

  const body = candidates.map(g => {
    const statVal = g[def.stat] || 0;
    return `<div onclick="confirmTechResearch('${techId}','${g.name}')" style="cursor:pointer;padding:6px 10px;border-bottom:1px solid rgba(80,65,40,.06);display:flex;justify-content:space-between;align-items:center" onmouseover="this.style.background='rgba(80,65,40,.05)'" onmouseout="this.style.background='none'">
      <div>
        <span style="color:rgba(44,36,22,.8);font-weight:600">${g.name}</span>
        <span style="font-size:9px;color:rgba(92,74,50,.40);margin-left:4px">${statLabel}${statVal}</span>
      </div>
      <span style="font-size:9px;color:rgba(92,74,50,.35)">经验+${def.expReward}</span>
    </div>`;
  }).join('');

  const el = document.getElementById('genericModal');
  document.getElementById('genericModalTitle').textContent = `${def.icon} 研究${def.name}`;
  document.getElementById('genericModalBody').innerHTML = `
    <div style="padding:6px 12px;font-size:9px;color:rgba(92,74,50,.45)">
      ${def.desc} · ${def.turns}旬 · ${costText}<br>
      选择主持武将（研究期间不可出征/任太守，完成后${statLabel}+${def.expReward}经验）
    </div>
    ${body}`;
  el.style.display = 'flex';
}

function confirmTechResearch(techId, genName) {
  closeModal();
  const ok = startTechResearch(G.playerFac, techId, genName);
  if (ok) {
    const def = TECH_TREE[techId];
    showNotif(`开始研究${def?.name||techId}（${genName}主持，${def?.turns}旬）`, 'info');
    renderAllLight();
  } else {
    showNotif('研究启动失败', 'warn');
  }
}

function renderStatsTab(c){
  const FAC_COL={wei:'#1a5f8a',shu:'#1a7a3a',wu:'#a82a1a',nanman:'#8b6914'};
  const FAC_NAME={wei:'魏',shu:'蜀',wu:'吴',nanman:'蛮'};
  const h=_statsHistory;

  // ── 当前快照 ──
  const now=ALL_FACS.map(fid=>{
    const fc=Object.values(G.cities).filter(x=>x.fac===fid);
    const ut=G.units.filter(u=>u.fac===fid);
    const pop=fc.reduce((s,x)=>s+x.pop,0);
    const troops=fc.reduce((s,x)=>s+x.garrison,0)+ut.reduce((s,u)=>s+getUnitTroops(u),0);
    const gold=Math.round(G.factions[fid]?.res.gold||0);
    const cities=fc.length;
    const food=fc.reduce((s,x)=>s+x.storage,0);
    const morale=fc.length?Math.round(fc.reduce((s,x)=>s+x.morale,0)/fc.length):0;
    return {fid,pop,troops,gold,cities,food,morale};
  });

  // ── SVG 折线图生成器 ──
  function sparkline(key, maxOverride){
    if(h.length<2) return '<div style="color:var(--ink-ll);font-size:9px;text-align:center;padding:8px">暂无数据</div>';
    const W=240,H=56,pad=6;
    const iw=W-pad*2, ih=H-pad*2;
    const allVals=h.flatMap(s=>ALL_FACS.map(f=>s[f]?.[key]||0));
    const maxV=maxOverride||Math.max(...allVals,1);
    const lines=ALL_FACS.map(fid=>{
      const pts=h.map((s,i)=>{
        const v=s[fid]?.[key]||0;
        const x=pad+i/(h.length-1)*iw;
        const y=pad+ih-(v/maxV)*ih;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const last=h[h.length-1];
      const lv=last[fid]?.[key]||0;
      const lx=(pad+iw).toFixed(1);
      const ly=(pad+ih-(lv/maxV)*ih).toFixed(1);
      return `<polyline points="${pts}" fill="none" stroke="${FAC_COL[fid]}" stroke-width="1.5" stroke-opacity="0.8"/>
        <circle cx="${lx}" cy="${ly}" r="2.5" fill="${FAC_COL[fid]}"/>`;
    }).join('');
    return `<svg width="${W}" height="${H}" style="display:block">
      <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${pad+ih}" stroke="rgba(80,65,40,.12)" stroke-width="0.5"/>
      <line x1="${pad}" y1="${pad+ih}" x2="${pad+iw}" y2="${pad+ih}" stroke="rgba(80,65,40,.12)" stroke-width="0.5"/>
      ${lines}</svg>`;
  }

  // ── 城池归属比例条 ──
  const totalCities=CITIES_DEF.length;
  const barHtml=ALL_FACS.map(fid=>{
    const cnt=Object.values(G.cities).filter(x=>x.fac===fid).length;
    const pct=(cnt/totalCities*100).toFixed(1);
    return `<div style="flex:${cnt};background:${FAC_COL[fid]};height:8px;transition:flex .5s" title="${FAC_NAME[fid]} ${cnt}城"></div>`;

  // ── 势力总览卡 ──
  const cardsHtml=now.map(({fid,pop,troops,gold,cities,food,morale})=>{

    return `<div style="background:rgba(255,252,245,.5);border:1px solid ${col}30;border-radius:6px;padding:10px 12px;position:relative;overflow:hidden">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:10px">
        <div style="background:rgba(80,65,40,.04);border:1px solid rgba(80,65,40,.08);border-radius:3px;padding:5px 7px">
          <div style="color:var(--ink-ll);font-size:8px;margin-bottom:2px">人口</div>

  }).join('');

  // ── 折线图面板 ──
  const chartSec=(label,key,unit='')=>`
    <div style="background:rgba(255,252,245,.4);border:1px solid rgba(80,65,40,.08);border-radius:6px;padding:10px 12px;margin-bottom:8px">

  const yearStr=YEARS[G.year]||`第${G.year+1}年`;

      <select id="ffSelect" onchange="_ffTurns=+this.value"

            ${buffLine}
          </div>
          <div style="font-size:8px;color:rgba(80,65,40,.15);white-space:nowrap">${postDef.salary}金/旬</div>
        </div>`;
      });
      const emptyCount = maxSlots - filled.length;
      for(let i=0; i<emptyCount; i++){
        const availDef = defs.find(d=>!filledNames.has(d.name));
        const postName = availDef ? availDef.name : defs[i%defs.length]?.name || '?';
        const meritReq = availDef ? availDef.merit : 0;
        const buffDesc = availDef?.buffDesc || '';
        html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:4px;background:rgba(245,240,228,.5);border:1px dashed rgba(80,65,40,.12);border-radius:3px;cursor:pointer;transition:background .15s" onmouseover="this.style.background='rgba(80,65,40,.05)'" onmouseout="this.style.background='rgba(245,240,228,.5)'" onclick="openPostAppoint('${postName}','${fid}')">
          <div style="min-width:50px">
            <div style="font-size:11px;color:rgba(92,74,50,.35);font-family:'Noto Serif SC',serif">${postName}</div>
          </div>
          <div style="flex:1">
            <span style="font-size:9px;color:rgba(80,65,40,.12)">空缺 · 功绩≥${meritReq}</span>
            ${buffDesc ? `<div style="font-size:7px;color:rgba(80,65,40,.10);margin-top:1px">${buffDesc}</div>` : ''}
          </div>
          <div style="font-size:9px;color:rgba(80,65,40,.10)">点击任命</div>
        </div>`;
        filledNames.add(postName);
      }
    });
    return html;
  }

  // buff汇总
  const buffEntries = [];
  if(buffs.goldProd) buffEntries.push(`金+${(buffs.goldProd*100).toFixed(1)}%`);
  if(buffs.foodProd) buffEntries.push(`粮+${(buffs.foodProd*100).toFixed(1)}%`);
  if(buffs.recruitCost) buffEntries.push(`征兵${(buffs.recruitCost*100).toFixed(0)}%`);
  if(buffs.reinforce) buffEntries.push(`补员+${(buffs.reinforce*100).toFixed(0)}%`);
  if(buffs.upkeep) buffEntries.push(`维护${(buffs.upkeep*100).toFixed(0)}%`);
  if(buffs.foodCost) buffEntries.push(`粮耗${(buffs.foodCost*100).toFixed(0)}%`);
  if(buffs.morale) buffEntries.push(`民心+${buffs.morale.toFixed(2)}/旬`);
  if(buffs.buildSpeed) buffEntries.push(`建设+${(buffs.buildSpeed*100).toFixed(0)}%`);
  if(buffs.stratRate) buffEntries.push(`计谋+${(buffs.stratRate*100).toFixed(0)}%`);
  if(buffs.giftEffect) buffEntries.push(`送礼+${(buffs.giftEffect*100).toFixed(0)}%`);
  if(buffs.expGain) buffEntries.push(`经验+${(buffs.expGain*100).toFixed(0)}%`);
  const buffStr = buffEntries.length ? buffEntries.join('  ') : '无';

  const totalSlots = slots.mil[0]+slots.mil[1]+slots.mil[2]+slots.civ[0]+slots.civ[1]+slots.civ[2];

  // ★ v181: 档位进度条 — 拆为「势力规模」+「政权阶段」两条独立显示
  const cityCount = Object.values(G.cities).filter(cc=>cc.fac===fid).length;
  const curTier = getFacPostTier(fid);
  const stage = getStage(fid);
  const stageLabel = STAGE_NAMES[stage] || stage;
  const stageColor = getStageColor(stage);
  const capLabel = STAGE_LABEL_CAP[stage] || '王';
  // 城市数指向的"原始档"（不受 stage 卡）
  const rawCityTier = POST_TIERS.find(t=>cityCount>=t.minCities) || POST_TIERS[POST_TIERS.length-1];
  // ★ v181 fix: 区分 cap（城市数高过 stage 上限，限制性提示）和 floor（城市数低于 stage 下限，有利提示）
  const rawCityIdx = POST_TIERS.indexOf(rawCityTier);
  const curIdx     = POST_TIERS.indexOf(curTier);
  const stageCapped = curIdx > rawCityIdx; // cur label 比 rawCity 低（idx 大）→ 被 cap 卡下来；floor 情况不需要变量，直接看 !stageCapped 即可
  const nextTier = curIdx > 0 ? POST_TIERS[curIdx - 1] : null;
  const tierColors = {'王':'#c08040','公':'#6b5530','侯':'#2a7a9a','诸侯':'#888'};
  const t1Slots = STAGE_TIER1_SLOTS[stage] || STAGE_TIER1_SLOTS.warlord;
  const tier1Unlocked = (t1Slots.mil + t1Slots.civ) > 0;
  // 下一档是否被 stage cap 永远锁死
  const capIdx = POST_TIERS.findIndex(t => t.label === capLabel);
  const nextBlockedByStage = nextTier ? POST_TIERS.indexOf(nextTier) < capIdx : false;
  const tierProgressHtml = (() => {
    // ── 第一条：势力规模（label + 城市数 + 下一档需求） ──
    let html = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <span style="font-size:10px;color:rgba(92,74,50,.55)">势力规模</span>
      <span style="font-family:'Noto Serif SC',serif;font-size:12px;color:${tierColors[curTier.label]||'#6b5530'};font-weight:700">${curTier.label}</span>
      <span style="font-size:9px;color:rgba(92,74,50,.35)">（${cityCount}城）</span>
      ${stageCapped ? `<span style="font-size:8px;color:rgba(192,128,64,.7);margin-left:auto">城数已达${rawCityTier.label}级，受【${stageLabel}】阶段限制</span>` : ''}
    </div>`;
    // ★ v181 fix BUG A: 下一档被 stage cap 永远锁死时不显示进度（避免"还差 X 城"误导）
    // ★ v181 fix BUG B: stageCapped 时不显示进度；floor 情况（curIdx<rawCityIdx）正常显示城市数升级路径
    if(nextTier && !stageCapped && !nextBlockedByStage){
      // 正常城市数升级路径
      const need = Math.max(0, nextTier.minCities - cityCount);
      const pct = Math.min(100, Math.round(cityCount / nextTier.minCities * 100));
      const newMil = nextTier.mil[0]+nextTier.mil[1];
      const newCiv = nextTier.civ[0]+nextTier.civ[1];
      const curMil = curTier.mil[0]+curTier.mil[1];
      const curCiv = curTier.civ[0]+curTier.civ[1];
      html += `<div style="margin-bottom:2px">
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:3px">
          <span style="font-size:9px;color:rgba(92,74,50,.45)">▸ 下一档</span>
          <span style="font-size:10px;color:${tierColors[nextTier.label]||'#6b5530'};font-family:'Noto Serif SC',serif;font-weight:600">${nextTier.label}</span>
          <span style="font-size:8px;color:rgba(92,74,50,.35)">（需${nextTier.minCities}城，还差${need}城）</span>
        </div>
        <div style="height:4px;background:rgba(80,65,40,.08);border-radius:2px;overflow:hidden;margin-bottom:3px">
          <div style="width:${pct}%;height:100%;background:${tierColors[nextTier.label]||'#6b5530'};transition:width .3s;border-radius:2px"></div>
        </div>
        <div style="font-size:8px;color:rgba(92,74,50,.35);line-height:1.5">
          升级后：武官${curMil}→${newMil}  文官${curCiv}→${newCiv}
        </div>
      </div>`;
    } else if(!nextTier){
      html += `<div style="font-size:8px;color:rgba(192,128,64,.6)">已达最高档位</div>`;
    }
    // stageCapped 或 nextBlockedByStage 时，城市数升级路径无意义，由下方"政权阶段"行接力引导

    // ── 第二条：政权阶段（决定一品官是否解锁） ──
    html += `<div style="display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:5px;border-top:1px dashed rgba(92,74,50,.15)">
      <span style="font-size:10px;color:rgba(92,74,50,.55)">政权阶段</span>
      <span style="font-family:'Noto Serif SC',serif;font-size:12px;color:${stageColor};font-weight:700">${stageLabel}</span>
      <span style="font-size:9px;color:rgba(92,74,50,.45)">·</span>
      <span style="font-size:9px;color:${tier1Unlocked?'#c08040':'rgba(92,74,50,.40)'}">${tier1Unlocked?'★ 一品官已解锁':'一品官未解锁（需达成「政权」）'}</span>
    </div>`;
    return html;
  })();

  c.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink-l);letter-spacing:1px">官职总览 ${_tabHelpHtml('post')}</div>
      <div style="font-size:9px;color:rgba(92,74,50,.40)">${fd.full} · ${slots.label}级 · ${posts.length}/${totalSlots}人</div>
    </div>
    <div style="background:rgba(255,252,245,.45);border:1px solid rgba(92,74,50,.18);border-radius:3px;padding:6px 8px;margin-bottom:10px">
      ${tierProgressHtml}
    </div>
    <div style="background:rgba(255,252,245,.45);border:1px solid rgba(92,74,50,.18);border-radius:3px;padding:6px 8px;margin-bottom:10px">
      <div style="font-size:9px;color:rgba(92,74,50,.55);margin-bottom:3px">势力加成汇总</div>
      <div style="font-size:10px;color:var(--ink-l);line-height:1.6">${buffStr}</div>
      <div style="font-size:8px;color:rgba(92,74,50,.35);margin-top:3px">官俸支出: ${salary}金/旬</div>
    </div>
    ${renderTrack('mil','武官','⚔',MIL_POSTS,slots.mil)}
    ${renderTrack('civ','文官','📜',CIV_POSTS,slots.civ)}
  `;
}

function openPostAppoint(postName, fid){
  const postDef = ALL_POSTS.find(p=>p.name===postName);
  if(!postDef) return;
  const gens = (G.generals[fid]||[]).filter(g=>g.role!=='ruler');
  // 候选人：功绩够 + 无官职 + 无太守
  const candidates = gens.filter(g=>{
    if(G.genPost && G.genPost[g.name]) return false;
    if(Object.values(G.cities).some(c=>c.fac===fid && c.prefect===g.name)) return false;
    return (G.genMerit[g.name]||0) >= postDef.merit;
  }).sort((a,b)=>(G.genMerit[b.name]||0)-(G.genMerit[a.name]||0));

  if(!candidates.length){ showNotif(`无合适人选任${postName}（需功绩≥${postDef.merit}且无其他职务）`,'warn'); return; }

  const buffInfo = postDef.buffDesc ? `<div style="font-size:9px;color:#6b5530;margin:6px 0">效果: ${postDef.buffDesc} (按${postDef.buffStat==='com'?'统帅':'政治'}缩放)</div>` : '';
  const list = candidates.map(g=>{
    const merit = Math.floor(G.genMerit[g.name]||0);
    const stat = postDef.buffStat==='com' ? g.com : g.pol;
    return `<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;cursor:pointer;border-bottom:1px solid rgba(80,65,40,.07);transition:background .15s" onmouseover="this.style.background='rgba(80,65,40,.07)'" onmouseout="this.style.background=''" onclick="appointGenPost('${g.name}','${postName}','${fid}');closeModal();renderAllLight()">
      <span style="font-size:11px;color:var(--ink-l);font-family:'Noto Serif SC',serif">${g.name}</span>
      <span style="font-size:8px;color:rgba(92,74,50,.40)">功${merit} ${postDef.buffStat==='com'?'统':'政'}${stat}</span>
    </div>`;
  }).join('');

  showModal(`任命 ${postName}`, `
    <div style="font-size:10px;color:rgba(92,74,50,.55);margin-bottom:4px">忠诚+${postDef.loyalty}/旬 | 俸禄${postDef.salary}金/旬 | 需功绩≥${postDef.merit}</div>
    ${buffInfo}
    <div style="font-size:9px;color:rgba(92,74,50,.55);margin-bottom:6px">选择任命人选:</div>
    <div style="max-height:200px;overflow-y:auto">${list}</div>
  `);
}

function openPostAction(genName, fid){
  const postDef = getGenPostDef(genName);
  if(!postDef) return;
  const gen = (G.generals[fid]||[]).find(g=>g.name===genName);
  if(!gen) return;
  const merit = Math.floor(G.genMerit[genName]||0);
  const stat = postDef.buffStat==='com' ? gen.com : gen.pol;
  const buffInfo = postDef.buffDesc ? `<div style="font-size:9px;color:#6b5530;margin:6px 0">效果: ${postDef.buffDesc} (×${(stat/100).toFixed(2)})</div>` : '';

  showModal(`${postDef.name} · ${genName}`, `
    <div style="font-size:10px;color:rgba(92,74,50,.55)">忠诚+${postDef.loyalty}/旬 | 俸禄${postDef.salary}金/旬 | 功绩${merit}</div>
    ${buffInfo}
    <div style="margin-top:12px;text-align:center">
      <button onclick="dismissGenPost('${genName}','${fid}');closeModal();renderAllLight()" style="padding:5px 16px;background:rgba(192,48,48,.15);border:1px solid rgba(192,48,48,.3);color:#c03030;font-family:'Noto Serif SC',serif;font-size:10px;cursor:pointer;border-radius:2px">罢免</button>
    </div>
  `);
}

  const _dynPost = getGenPostDef(genName);
