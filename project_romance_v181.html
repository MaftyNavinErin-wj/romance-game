// ★ v99: 即时行军核心——逐格动画 + 迷雾揭开 + 战斗检测
async function _execInstantMarch(unit, walkPath, apLeftAfter, remainPath, attackIntent){
  if(_marchAnimating) return;
  _marchAnimating = true;
  const btn = document.getElementById('btnTurn');
  if(btn) btn.disabled = true;

  let interrupted = false; // ★ 声明在try外部，供finally后的逻辑访问
  let ambushed = false;   // ★ v100: 伏击中断标记（跳过后续战斗检测）

  try { // ★ try-finally确保动画锁一定释放

  // 收集动画前的可见hex集合（用于增量迷雾揭开）
  let prevVisibleKeys = _collectPlayerVisibleKeys();
  const troopType = getMainTroopType(unit);

  for(let i = 0; i < walkPath.length; i++){
    const next = walkPath[i];
    const nextKey = hkey(next.col, next.row);
    const _imCurWater = isWaterHex(unit.hq, unit.hr); // ★ v138
    const _imNextWater = isWaterHex(next.col, next.row); // ★ v138
    const cost = getHexMoveCost(next.col, next.row, troopType, _imCurWater);

    // AP不足检查（安全兜底）
    if(unit._apRemaining < cost && cost < 999){
      unit.hexPath = walkPath.slice(i).concat(remainPath);
      unit.status = remainPath.length > 0 || walkPath.length - i > 0 ? 'march' : 'halt';
      interrupted = true;
      break;
    }

    // ── 敌方城市 → 围城（优先于敌军阻挡检测，城市hex上的敌军=守军）──
    const cityIdHere = HEX_CITY[nextKey];
    if(cityIdHere){
      const destCity = G.cities[cityIdHere];
      if(destCity && destCity.fac !== unit.fac && destCity.fac !== 'none' && isHostile(unit.fac, destCity.fac)){
        // ★ v162fix: 水上部队不可直接围城，需先上岸
        if(isWaterHex(unit.hq, unit.hr)){
          unit.hexPath = walkPath.slice(i).concat(remainPath);
          unit.status = 'halt';
          log('⚓ '+unit.squads[0]?.genName+'部 尚在水域，无法直接围城，需先上岸', 'battle');
          showNotif('水上部队无法直接围城，需先登陆','warn');
          interrupted = true;
          break;
        }
        unit.status = 'siege';
        unit.siegeTarget = cityIdHere;
        unit._siegeTurnCount = 0;
        unit.hexPath = [];
        unit.movePath = [cityIdHere];
        log('🏰 '+unit.squads[0]?.genName+'部 兵临'+destCity.name+'城下，开始围城', 'battle');
        _pendingSiegeArrival = { unitId: unit.id, cityId: cityIdHere };
        interrupted = true;
        break;
      }
    }

    // ── 敌军阻挡（野外hex，非城市hex）──
    const hasHostile = G.units.some(u =>
      u.id !== unit.id && u.hq === next.col && u.hr === next.row &&
      u.fac !== unit.fac && isHostile(unit.fac, u.fac) && getUnitTroops(u) > 0
    );
    if(hasHostile){
      unit.hexPath = walkPath.slice(i).concat(remainPath);
      unit.status = 'halt';
      interrupted = true;
      break;
    }

    // ── v103: 非己方非敌对城市 → 不进入，halt ──
    if(cityIdHere){
      const ncCity = G.cities[cityIdHere];
      if(ncCity && ncCity.fac !== unit.fac && ncCity.fac !== 'none'){
        unit.hexPath = walkPath.slice(i).concat(remainPath);
        unit.status = 'halt';
        const gname = unit.squads[0]?.genName||'?';
        log('⛺ '+gname+'部 抵达'+ncCity.name+'城外（非己方领土，就地驻扎）', 'economy');
        interrupted = true;
        break;
      }
    }

    // ── v103→v112: 堆叠检测——野外hex友军可穿越但不可停留；城市hex同势力可共存 ──
    {
      const occupied = G.units.some(u => u.id !== unit.id && u.hq === next.col && u.hr === next.row);
      if(occupied){
        const nxCityId = HEX_CITY[nextKey];
        const nxCity = nxCityId ? G.cities[nxCityId] : null;
        if(nxCity && nxCity.fac === unit.fac){
          // 己方城市：允许进入
        } else {
          // 野外hex：友军可穿越，但不可停留
          const isFriendly = G.units.some(u =>
            u.id !== unit.id && u.hq === next.col && u.hr === next.row && u.fac === unit.fac
          );
          if(isFriendly) {
            const isLastStep = (i === walkPath.length - 1) && remainPath.length === 0;
            if(isLastStep) {
              // 终点被友军占→停在上一格
              unit.hexPath = walkPath.slice(i).concat(remainPath);
              unit.status = 'halt';
              interrupted = true;
              break;
            }
            // 非终点→穿越（继续走，不break）
          } else {
            // 非友军占位→堵住
            unit.hexPath = walkPath.slice(i).concat(remainPath);
            unit.status = 'halt';
            interrupted = true;
            break;
          }
        }
      }
    }

    // ── 实际移动到该格 ──
    unit.hq = next.col; unit.hr = next.row;
    unit._apRemaining = Math.max(0, (unit._apRemaining || 0) - cost);

    // ★ v138: 水陆转换——入水或上岸时AP清零，本旬停止移动
    if(_imCurWater !== _imNextWater) {
      unit._apRemaining = 0;
      if(i < walkPath.length - 1 || remainPath.length > 0) {
        unit.hexPath = walkPath.slice(i + 1).concat(remainPath);
        unit.status = 'march'; // 保留路径下旬继续
      }
      // 继续执行本格的渲染/迷雾/伏击检测，但循环结束后break
    }

    // 捕获旧迷雾状态（用于动画遮罩颜色）
    const pFogRef = G.fog?.[G.playerFac] || {};
    const oldFogLevels = {};
    // 记录即将被揭开区域的旧fog等级
    const unitVisionKeys = fogBFS(unit.hq, unit.hr, getUnitVisionRadius(unit));
    unitVisionKeys.forEach(k => { if(!prevVisibleKeys.has(k)) oldFogLevels[k] = pFogRef[k] ?? FOG_UNEXPLORED; });

    // 更新迷雾
    updateFog(G.playerFac);
    invalidateFogCache();
    invalidateCityCache(); // ★ v153fix: 新城市进入视野时图标颜色需同步刷新

    // 计算新揭开的hex
    const newVisibleKeys = _collectPlayerVisibleKeys();
    const revealedKeys = [];
    for(const k of newVisibleKeys){
      if(!prevVisibleKeys.has(k)) revealedKeys.push(k);
    }
    prevVisibleKeys = newVisibleKeys;

    // 渲染动画帧
    renderMap();
    renderUnitsOnly();

    // 迷雾揭开动画（传入旧fog等级以选择正确遮罩颜色）
    if(revealedKeys.length > 0) _animateFogReveal(revealedKeys, oldFogLevels);

    // 到达己方/友方城市
    // ★ v123fix: 途经不停，只有终点才garrison
    if(cityIdHere){
      const city = G.cities[cityIdHere];
      if(city && (city.fac === unit.fac || city.fac === 'none' || !isHostile(unit.fac, city.fac))){
        const isDestination = (i === walkPath.length - 1) && remainPath.length === 0;
        if(isDestination){
          unit.status = 'garrison';
          unit.hexPath = [];
          unit.movePath = [cityIdHere];
          interrupted = true;
          await sleep(120);
          break;
        }
        // 途经己方城市：不中断，继续行军
      }
    }

    // ── 伏击检测（走到伏兵附近） ──
    const ambusher = G.units.find(u =>
      u.fac !== unit.fac && isHostile(u.fac, unit.fac) &&
      u.status === 'ambush' &&
      unitsContact(unit, u) && getUnitTroops(u) > 0
    );
    if(ambusher){
      unit.hexPath = walkPath.slice(i+1).concat(remainPath);
      unit.status = 'halt';
      interrupted = true;
      ambushed = true; // ★ v100: 标记伏击中断
      // AI伏击玩家 → 直接结算
      const ambTerrain = getTerrainAt(ambusher.hq, ambusher.hr);
      const aiUseFire = aiDecideFireAttack([ambusher],[unit],ambTerrain,ambusher.fac);
      // ★ v175: 战前位置快照（结算前的 hq/hr）
      const _ambushPosSnap = {};
      [ambusher, unit].forEach(u => { _ambushPosSnap[u.id] = { hq: u.hq, hr: u.hr }; });
      const report = resolveAmbush([ambusher],[unit],ambTerrain,aiUseFire);
      const nodeLabel = G.cities[getUnitNodeId(ambusher)]?.name || '野外';
      report.node = nodeLabel;
      _battleReports.push(report);
      log(`🎯 ${ambusher.squads[0]?.genName||'?'}部 于${nodeLabel}设伏，${report.ambushHit?'奇袭得手！':'伏兵被识破！'}`, 'battle');
      // ★ v175: 直接 await 动画（本函数已在玩家交互的 async 链中，mapRoot 稳定存在）
      try {
        await _playAmbushBattleAnim(report, [ambusher], [unit], _ambushPosSnap);
      } catch(e){ console.error('[AmbushAnim] march trigger failed:', e); }
      await sleep(120);
      break;
    }

    // 每格动画间隔
    await sleep(140);

    // ★ v138: 水陆转换后中断本旬移动
    if(_imCurWater !== _imNextWater) { interrupted = true; break; }
  }

  // ── 移动结束后的状态处理 ──
  // 如果完整走完walkPath，用预计算值；如果中断，_apRemaining已在逐步扣减中保持正确
  if(!interrupted) unit._apRemaining = Math.max(0, apLeftAfter);

  if(!interrupted){
    if(remainPath.length > 0){
      unit.hexPath = remainPath;
      unit.status = 'march';
    } else {
      const loc = getUnitNodeId(unit);
      if(loc && G.cities[loc] && (G.cities[loc].fac === unit.fac || !isHostile(unit.fac, G.cities[loc].fac))){
        unit.status = 'garrison';
      } else {
        unit.status = 'halt';
      }
      unit.hexPath = [];
    }
  }

  // 最终刷新
  updateFog(G.playerFac);
  invalidateFogCache();
  invalidateCityCache(); // ★ v153fix: 同上
  renderAll();

  } finally { // ★ 确保动画锁释放
    _marchAnimating = false;
    if(btn) btn.disabled = false;
  }

  // ★ v99: 战斗检测——只在玩家主动攻击（点击敌军）时触发
  // ★ v100: 被伏击中断后跳过（避免伏击后立即触发二次战斗）
  // 移动到空地/城市不会自动找架打
  if(attackIntent && !ambushed && unit.status !== 'garrison' && unit.status !== 'siege' && getUnitTroops(unit) > 0){
    _checkInstantBattleTrigger(unit);
  }
  // 围城到达弹窗
  if(_pendingSiegeArrival){
    _checkSiegeArrival();
  }
  // 伏击战报弹出
  if(_battleReports.length) setTimeout(showNextBattleReport, 300);
}

// ★ v99: 收集玩家当前可见hex集合
function _collectPlayerVisibleKeys(){
  const pFog = G.fog?.[G.playerFac];
  if(!pFog) return new Set();
  const keys = new Set();
  for(const k in pFog){ if(pFog[k] === FOG_VISIBLE) keys.add(k); }
  return keys;
}

// ★ v99: 迷雾揭开动画——在已渲染的迷雾层上叠加临时遮罩，然后渐隐消失
function _animateFogReveal(revealedKeys, oldFogLevels){
  const svg = document.getElementById('mapSvg');
  if(!svg) return;
  // ★ v118fix: 清理上一步残留的揭雾动画层（快速逐格行军时可能堆积）
  const mapRoot = document.getElementById('mapRoot') || svg;
  mapRoot.querySelectorAll('.fog-reveal-anim').forEach(el => el.remove());
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.createElementNS(ns, 'g');
  g.setAttribute('class', 'fog-reveal-anim');
  g.setAttribute('pointer-events', 'none');
  g.style.transition = 'opacity 0.35s ease-out';
  g.style.opacity = '1';

  revealedKeys.forEach(k => {
    const {col, row} = hparse(k);
    const ter = HEX_TERRAIN[k] || 'plain';
    if(ter === 'impassable' || ter === 'deep_water' || ter === 'coastal_water') return;
    const p = hexToPixel(col, row);
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', HEX_PATH);
    path.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
    // ★ v118fix: 遮罩颜色匹配宣纸风迷雾色（浅底深遮挡→浅底浅遮挡渐隐）
    const oldLv = oldFogLevels?.[k] ?? FOG_UNEXPLORED;
    const wasExplored = oldLv >= FOG_EXPLORED;
    path.setAttribute('fill', wasExplored ? 'rgba(170,160,138,.48)' : 'rgba(110,100,80,.93)');
    path.setAttribute('stroke', wasExplored ? 'rgba(155,145,125,.50)' : 'rgba(95,85,68,.95)');
    path.setAttribute('stroke-width', wasExplored ? '0.5' : '0.5');
    g.appendChild(path);
  });

  mapRoot.appendChild(g);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { g.style.opacity = '0'; });
  });
  setTimeout(() => { if(g.parentNode) g.parentNode.removeChild(g); }, 450);
}

// ★ v99/v100: 即时战斗检测（玩家部队移动后，检查是否与敌军接触）
function _checkInstantBattleTrigger(playerUnit){
  if(!playerUnit || getUnitTroops(playerUnit) <= 0) return;

  const sides = collectBattleSides(playerUnit);
  if(!sides) return;
  const { attackers: sideA, defenders: sideB } = sides;
  const nodeLabel = G.cities[getUnitNodeId(playerUnit)]?.name || '野外';

  // 营寨战检测
  const hasCampDef = sideB.some(u => u.status === 'camp');
  if(hasCampDef){
    _pendingBattleConfirms.push({
      playerSide: sideA, enemySide: sideB.filter(u => u.status === 'camp'),
      nodeLabel, campBattle: true, campRole: 'attacker',
    });
  } else {
    // ★ v133cleanup: 野战（攻城统一走围城系统，此处不处理）
    _pendingBattleConfirms.push({
      playerSide: sideA, enemySide: sideB,
      nodeLabel,
      playerIsAttacker: true,
    });
  }
  if(_pendingBattleConfirms.length) setTimeout(_showNextBattleConfirm, 300);
}

let _stackPickerOpen=false;

function closeStackPicker(){
  const el=document.getElementById('stackPicker');

}

function showStackPicker(e, stackUnits){
  const el=document.getElementById('stackPicker');
  const list=document.getElementById('stackPickerList');
  if(!el||!list) return;

  const facCol=f=>FAC[f]?.color||'#888';
  const facName=f=>({wei:'魏',shu:'蜀',wu:'吴',nanman:'蛮'}[f]||f);
  const statusLabel=u=>u.mobilizingTurns>0?`⚙${u.mobilizingTurns}旬`:u.status==='camp'?'🏕营':u.status==='ambush'?'🌿伏':u.status==='garrison'?'🛡待':'⚔行';

  list.innerHTML=stackUnits.map(u=>{
    const total=getUnitTroops(u);
    const troopStr=total>=10000?(total/10000).toFixed(1)+'万':fmt(total);
    const isSel=G.selUnitId===u.id;
    const col=facCol(u.fac);
    const icons=u.squads.map(sq=>TROOP_TYPES[sq.type]?.icon||'').join('');
    return `<div class="sp-row${isSel?' sel':''}" onclick="onStackPickerSelect('${u.id}',event)">
      <div class="sp-flag" style="background:${col}"></div>
      <div>
        <div class="sp-name" style="color:${col}">${u.squads[0]?.genName}部</div>
        <div style="font-size:9px;color:rgba(92,74,50,.55)">${facName(u.fac)} ${icons} ${troopStr}</div>
      </div>
      <div class="sp-status" style="color:${col};border-color:${col}44">${statusLabel(u)}</div>
    </div>`;
  }).join('');

  // 位置：在鼠标正下方
  el.style.display='block';
  const menuW=el.offsetWidth||200;
  const menuH=el.offsetHeight||100;
  let left=e.clientX-menuW/2;
  let top=e.clientY+8;
  left=Math.max(8,Math.min(window.innerWidth-menuW-8,left));
  if(top+menuH>window.innerHeight-8) top=e.clientY-menuH-8;
  el.style.left=left+'px';
  el.style.top=top+'px';
  _stackPickerOpen=true;
}

function onStackPickerSelect(unitId, e){
  if(e) e.stopPropagation();
  closeStackPicker();
  const unit=G.units.find(u=>u.id===unitId);
  if(!unit) return;

  // 若当前选中了己方部队，点击敌方部队 → 直接向其节点进军
  if(G.selUnitId && G.selUnitId!==unitId){
    const attacker=G.units.find(u=>u.id===G.selUnitId);
    if(attacker && attacker.fac===G.playerFac && unit.fac!==attacker.fac){
      if(unit.hq !== undefined){
        // ★ v99: 走即时移动（攻击意图）
        issueUnitMove(attacker, unit.hq, unit.hr, null, true);
      }
      return;
    }

  if(G.selUnitId===unitId){
    G.selUnitId=null; clearMovePreview();
  } else {
    G.selUnitId=unitId; clearMovePreview();
    G.activeTab='mil'; updateTabs();
  }
  renderAllLight();
}

  if(e)e.stopPropagation();

// 地图左键点击
function svgEventCoords(e){
  const svg=document.getElementById('mapSvg');
  // 使用 SVG 原生坐标转换（精确处理 preserveAspectRatio 带来的 letterbox 偏移）
  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const ctm = svg.getScreenCTM();
  if(!ctm){ // fallback
    const rect=svg.getBoundingClientRect();
    const svgX=(e.clientX-rect.left)*(960/rect.width);
    const svgY=(e.clientY-rect.top)*(740/rect.height);
    return {mx:(svgX-_mapTx)/_mapScale, my:(svgY-_mapTy)/_mapScale};
  }
  const svgPt = pt.matrixTransform(ctm.inverse());
  const mx=(svgPt.x-_mapTx)/_mapScale;
  const my=(svgPt.y-_mapTy)/_mapScale;
  return {mx, my};
}

function handleMapClick(e){
  if(_suppressNextClick){ _suppressNextClick=false; return; }
  if(_marchAnimating) return; // ★ v99: 行军动画中禁用点击
  closeUnitMenu();
  closeStackPicker();

  const {mx,my} = svgEventCoords(e);
  const hex = pixelToHex(mx, my);
  const hexK = hkey(hex.col, hex.row);
  const cityId = HEX_CITY[hexK];

  if(G.selUnitId){
    const unit = G.units.find(u=>u.id===G.selUnitId);
    if(!unit||unit.fac!==G.playerFac){ G.selUnitId=null; clearMovePreview(); renderAllLight(); return; }

    // ── 点击自身位置 → 取消选中 ──
    if(hex.col === unit.hq && hex.row === unit.hr){
      G.selUnitId = null;
      clearMovePreview();
      renderAllLight();
      return;
    }

    // ── 检查hex上是否有可见敌方部队 → 自动转为进军 ──
    // ★ v133fix: 敌方城市hex上的敌军 → 视为进攻城市（走城市移动路径），不走野战攻击
    const pFog = G.fog?.[G.playerFac];
    const isHostileCity = cityId && G.cities[cityId] && G.cities[cityId].fac !== unit.fac
      && G.cities[cityId].fac !== 'none' && isHostile(unit.fac, G.cities[cityId].fac);
    const enemyOnHex = !isHostileCity && G.units.find(eu =>
      eu.fac !== unit.fac &&
      isHostile(unit.fac, eu.fac) &&
      (eu.hq??0) === hex.col && (eu.hr??0) === hex.row &&
      getUnitTroops(eu) > 0 &&
      (!pFog || pFog[hexK] === FOG_VISIBLE)
    );
    if(enemyOnHex){
      // ★ v99: 向敌军进军（攻击意图）
      issueUnitMove(unit, enemyOnHex.hq, enemyOnHex.hr, null, true);
      if(!_marchAnimating) showNotif(`向${enemyOnHex.squads[0]?.genName||'?'}部进军`, 'info');
      return;
    }

    // ── 点击城市 → handleCityClick ──
    if(cityId){
      if(_marchAnimating) return; // ★ v99
      // 城市点击也走预览逻辑
      const destCity = CITY_MAP[cityId];
      if(destCity){
        if(unit.hq === destCity.q && unit.hr === destCity.r){ showNotif('已在该城市','warn'); return; }
        // ★ v99: 短距离城市（1-2格）直接移动
        const cityDist = hexDist(unit.hq??0, unit.hr??0, destCity.q, destCity.r);
        if(cityDist <= 2){
          issueUnitMove(unit, destCity.q, destCity.r, cityId);
          return;
        }
        const prev = G._movePreview;
        if(prev && prev.destCol === destCity.q && prev.destRow === destCity.r){
          // 二次点击确认 → 执行移动
          issueUnitMove(unit, destCity.q, destCity.r, cityId);
          return;
        }
        // 首次点击 → 显示预览
        const result = hexAstar(unit.hq, unit.hr, destCity.q, destCity.r, getMainTroopType(unit), unit.fac);
        if(!result){ showNotif('无法到达该城市','warn'); clearMovePreview(); renderAllLight(); return; }
        const turns = Math.max(1, Math.ceil(result.cost / calcUnitAP(unit)));
        G._movePreview = { destCol: destCity.q, destRow: destCity.r, hexPath: result.path.slice(1), cost: result.cost, turns, label: G.cities[cityId]?.name || cityId };
        renderAllLight();
        return;
      }
      // fallback: 不认识的城市
      handleCityClick(cityId);
      return;
    }

    // ── 普通hex移动：短距直接走，远距预览+确认 ──
    // ★ v99: 动画锁检查
    if(_marchAnimating){ return; }
    const dist = hexDist(unit.hq??0, unit.hr??0, hex.col, hex.row);
    // 短距离（1-2格）：直接移动，不需预览确认
    if(dist <= 2){
      issueUnitMove(unit, hex.col, hex.row);
      return;
    }
    // 远距离：保持预览+二次确认
    const prev = G._movePreview;
    if(prev && prev.destCol === hex.col && prev.destRow === hex.row){
      // 二次点击同一目标 → 确认移动
      issueUnitMove(unit, hex.col, hex.row);
      return;
    }
    // 首次点击 → 计算路径预览
    const result = hexAstar(unit.hq, unit.hr, hex.col, hex.row, getMainTroopType(unit), unit.fac);
    if(!result){
      showNotif('无法到达该位置','warn');
      clearMovePreview();
      renderAllLight();
      return;
    }
    const turns = Math.max(1, Math.ceil(result.cost / calcUnitAP(unit)));
    G._movePreview = { destCol: hex.col, destRow: hex.row, hexPath: result.path.slice(1), cost: result.cost, turns, label: null };
    renderAllLight();
  } else {
    // 无选中部队
    clearMovePreview();
    if(cityId){
      handleCityClick(cityId);
      return;
    }
    G.selCity = null;
    renderAllLight();
  }
}


// 城市点击：选中城市，或（有选中部队时）设为移动目标（带预览确认）
function handleCityClick(cityId){
  if(_marchAnimating) return; // ★ v99
  if(G.selUnitId){
    const unit = G.units.find(u=>u.id===G.selUnitId);
    if(!unit||unit.fac!==G.playerFac) return;
    const destCity = CITY_MAP[cityId];
    if(!destCity){showNotif('找不到目标城市','warn');return;}
    if(unit.hq === destCity.q && unit.hr === destCity.r){showNotif('已在该城市','warn');return;}
    // ★ v99: 短距离直接走
    const cityDist = hexDist(unit.hq??0, unit.hr??0, destCity.q, destCity.r);
    if(cityDist <= 2){
      issueUnitMove(unit, destCity.q, destCity.r, cityId);
      return;
    }
    // v86: 预览+确认
    const prev = G._movePreview;
    if(prev && prev.destCol === destCity.q && prev.destRow === destCity.r){
      issueUnitMove(unit, destCity.q, destCity.r, cityId);
      return;
    }
    const result = hexAstar(unit.hq, unit.hr, destCity.q, destCity.r, getMainTroopType(unit), unit.fac);
    if(!result){ showNotif('无法到达该城市','warn'); clearMovePreview(); renderAllLight(); return; }
    const turns = Math.max(1, Math.ceil(result.cost / calcUnitAP(unit)));
    G._movePreview = { destCol: destCity.q, destRow: destCity.r, hexPath: result.path.slice(1), cost: result.cost, turns, label: G.cities[cityId]?.name || cityId };
    renderAllLight();
  } else {
    G.selCity = cityId;
    G.selUnitId = null;
    clearMovePreview();
    G.activeTab = 'city';
    updateTabs(); renderAll();
  }
}

function getUnitDisplayPos(unit){
  return hexToPixel(unit.hq ?? 0, unit.hr ?? 0);
}

function renderUnitsOnMap(){
  let h='';
  const pFog = G.fog?.[G.playerFac];
  const byPos = {};
  G.units.forEach(u => {
    // C4: 隐藏迷雾中的非己方部队
    if (pFog && u.fac !== G.playerFac && !canSeeFactionData(G.playerFac, u.fac)) {
      const fogLv = pFog[hkey(u.hq??0, u.hr??0)] ?? FOG_UNEXPLORED;
      if (fogLv !== FOG_VISIBLE) return; // 不渲染
    }
    // ★ v134: 敌方伏兵隐身——ambush状态的非己方部队不渲染
    if (u.status === 'ambush' && u.fac !== G.playerFac && !canSeeFactionData(G.playerFac, u.fac)) return;
    const k = hkey(u.hq??0, u.hr??0);
    if(!byPos[k]) byPos[k]=[];
    byPos[k].push(u);
  });

  // C4: 也需要用过滤后的单位列表渲染
  const visibleUnits = Object.values(byPos).flat();
  visibleUnits.forEach(unit => {
    const col = FAC[unit.fac]?.color||'#888';
    const isSel = G.selUnitId === unit.id;
    const isGarr = unit.status === 'garrison';
    const pos = hexToPixel(unit.hq??0, unit.hr??0);
    const stackKey = hkey(unit.hq??0, unit.hr??0);
    const stackUnits = byPos[stackKey] || [unit];
    const stackCount = stackUnits.length;
    const stackIdx = stackUnits.indexOf(unit);

    const fanSpacing = 14;
    const invS = 1/_mapScale;
    const offsetX = (stackIdx-(stackCount-1)/2)*fanSpacing*invS;
    let px = pos.x + offsetX;
    let py = pos.y;

    // 行进路径线 — v111: 只显示玩家部队的路线，AI部队路线隐藏
    if((stackIdx===0||isSel) && unit.hexPath && unit.hexPath.length > 0 && unit.fac === G.playerFac){
      let pts = `${pos.x.toFixed(1)},${pos.y.toFixed(1)}`;
      unit.hexPath.forEach(hp => {
        const pp = hexToPixel(hp.col, hp.row);
        pts += ` ${pp.x.toFixed(1)},${pp.y.toFixed(1)}`;
      });
      const lineCol = isSel ? col : 'rgba(92,74,50,.3)';
      h += `<polyline points="${pts}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="3" stroke-linecap="round"/>`;
      h += `<polyline points="${pts}" fill="none" stroke="${lineCol}" stroke-width="${isSel?2:1.2}"
        stroke-dasharray="6,3" opacity="${isSel?.9:.5}" marker-end="${isSel?'url(#arrowhead)':''}"/>`;
      if(isSel && unit.hexPath.length > 0){
        const last = unit.hexPath[unit.hexPath.length-1];
        const lp = hexToPixel(last.col, last.row);
        h += `<circle cx="${lp.x}" cy="${lp.y}" r="10" fill="${col}" fill-opacity=".1" stroke="${col}" stroke-width="1.5" stroke-dasharray="3,2" opacity=".8"/>`;
      }
    }

    const gname = unit.squads[0]?.genName||'?';
    const total = getUnitTroops(unit);
    // v97: 敌方部队情报模糊
    const isEnemy = unit.fac !== G.playerFac && !canSeeFactionData(G.playerFac, unit.fac);
    const _scoutInt = isEnemy ? getScoutINT(unit) : 99;
    const dispName = isEnemy && _scoutInt < 60 ? '？？' : (gname.length>2?gname.slice(0,2):gname);
    const troopStr = isEnemy ? fuzzyTroopDisplay(total, _scoutInt) : (total>=10000?(total/10000).toFixed(1)+'万':fmt(total));
    // ── 矩形旗帜（全战风格）──
    const flagW=28, flagH=16, poleH=18;
    const isCamp = unit.status==='camp';
    const isAmbush = unit.status==='ambush';
    const FAC_DARK_FLAG = {wei:'rgba(220,235,248,.95)',shu:'rgba(220,242,228,.95)',wu:'rgba(248,225,222,.95)',nanman:'rgba(248,240,210,.95)'};
    const darkFill = FAC_DARK_FLAG[unit.fac]||'rgba(240,235,220,.95)';
    const baseOpacity = (stackCount>1&&!isSel)?'0.82':'1';
    const bw = flagW, bh = flagH;

    h += `<g transform="translate(${px.toFixed(2)},${py.toFixed(1)})" opacity="${baseOpacity}"
      onclick="onUnitLeftClick('${unit.id}',event)"
      oncontextmenu="onUnitRightClick('${unit.id}',event)"
      onmouseenter="showUnitTip(event,'${unit.id}')" onmouseleave="hideTip()">
      <g transform="scale(${invS.toFixed(4)})">
        ${isSel?`<ellipse rx="18" ry="5" fill="none" stroke="#8a7040" stroke-width="1.8" opacity=".8">
          <animate attributeName="rx" values="16;21;16" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".8;.3;.8" dur="1.5s" repeatCount="indefinite"/>
        </ellipse>`:''}
        <ellipse rx="4" ry="1.5" fill="rgba(80,65,40,.15)"/>
        <line x1="0" y1="0" x2="0" y2="${-(poleH+2)}" stroke="rgba(80,65,40,.3)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="0" y2="${-(poleH+2)}" stroke="rgba(80,65,40,.6)" stroke-width="1.2" stroke-linecap="round"/>
        ${isCamp?`<g pointer-events="none" transform="translate(0,5)">
          <rect x="-8" y="-7" width="16" height="9" rx="1" fill="rgba(60,38,12,.55)" stroke="rgba(96,184,224,.8)" stroke-width="1"/>
          <polygon points="0,-12 -5,-7 5,-7" fill="rgba(96,184,224,.5)" stroke="rgba(96,184,224,.8)" stroke-width=".7"/>
        </g>`:isAmbush?`<g pointer-events="none" transform="translate(0,5)">
          <ellipse cx="-4" cy="-2" rx="4" ry="3" fill="rgba(40,100,30,.6)"/>
          <ellipse cx="3" cy="-2" rx="4" ry="3" fill="rgba(40,100,30,.6)"/>
          <ellipse cx="0" cy="-5" rx="5" ry="3.5" fill="rgba(50,130,35,.65)"/>
        </g>`:''}
        <rect x="${-bw/2}" y="${-(poleH+bh)}" width="${bw}" height="${bh}" rx="2"
          fill="${darkFill}" stroke="${isSel?'#8a7040':col}" stroke-width="${isSel?2.5:1.8}"
          ${isSel?'filter="url(#glow)"':''}/>
        ${isGarr?'':`<rect x="${-bw/2}" y="${-(poleH+bh)}" width="${bw}" height="3" rx="1"
          fill="${col}" opacity=".35"/>`}
        <text x="0" y="${-(poleH+bh/2)+1}"
          text-anchor="middle" dominant-baseline="middle"
          font-family="Noto Serif SC,serif" font-size="9.5" fill="rgba(240,228,195,1)" font-weight="700"
          stroke="rgba(0,0,0,.65)" stroke-width="1.8" paint-order="stroke"
          pointer-events="none">${dispName}</text>
        <rect x="${-bw/2+1}" y="${-(poleH)-1}" width="${bw-2}" height="8" rx="1.5"
          fill="rgba(0,0,0,.65)"/>
        <text x="0" y="${-(poleH)+5}"
          text-anchor="middle" dominant-baseline="middle"
          font-family="Noto Serif SC,serif" font-size="6.5" font-weight="600"
          fill="${isSel?'#8a7040':'rgba(255,240,200,.92)'}"
          pointer-events="none">${troopStr}</text>
        ${isSel && unit.fac === G.playerFac ? `<g transform="translate(${bw/2+2},${-(poleH+bh/2)})">
          <rect x="-1" y="-5.5" width="16" height="11" rx="2.5"
            fill="rgba(245,238,225,.92)" stroke="${unit.mobilizingTurns>0?'rgba(138,106,16,.6)':'rgba(138,106,16,.6)'}" stroke-width=".8"/>
          <text x="7" y="1" text-anchor="middle" dominant-baseline="middle"
            font-family="Noto Serif SC,serif" font-size="6" font-weight="700"
            fill="${unit.mobilizingTurns>0?'rgba(138,106,16,.85)':'rgba(138,106,16,.85)'}" pointer-events="none">${unit.mobilizingTurns>0?'⚙':unit._apRemaining !== undefined ? unit._apRemaining : calcUnitAP(unit)}</text>
          <text x="7" y="7" text-anchor="middle" dominant-baseline="middle"
            font-family="Noto Serif SC,serif" font-size="4" font-weight="400"
            fill="${unit.mobilizingTurns>0?'rgba(138,106,16,.35)':'rgba(138,106,16,.45)'}" pointer-events="none">${unit.mobilizingTurns>0?'整备':'AP'}</text>
        </g>` : ''}
      </g>
    </g>`;
  });

  // ── v86/v99: 移动预览路径渲染（双色区分本旬可达/跨旬） ──
  const preview = G._movePreview;
  if(preview && preview.hexPath && preview.hexPath.length > 0 && G.selUnitId){
    const selUnit = G.units.find(u => u.id === G.selUnitId);
    if(selUnit){
      const startPos = hexToPixel(selUnit.hq??0, selUnit.hr??0);
      const ap = selUnit._apRemaining !== undefined ? selUnit._apRemaining : calcUnitAP(selUnit);
      const troopType = getMainTroopType(selUnit);

      // 计算本旬AP可走到哪一格
      let apSim = ap;
      let splitIdx = 0;
      for(let i = 0; i < preview.hexPath.length; i++){
        const cost = getHexMoveCost(preview.hexPath[i].col, preview.hexPath[i].row, troopType);
        if(cost >= 999 || apSim < cost) break;
        apSim -= cost;
        splitIdx = i + 1;
      }

      // 本旬可达段（亮色实线）
      if(splitIdx > 0){
        let pts = `${startPos.x.toFixed(1)},${startPos.y.toFixed(1)}`;
        for(let i = 0; i < splitIdx; i++){
          const pp = hexToPixel(preview.hexPath[i].col, preview.hexPath[i].row);
          pts += ` ${pp.x.toFixed(1)},${pp.y.toFixed(1)}`;
        }
        h += `<polyline points="${pts}" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="3.5" stroke-linecap="round" pointer-events="none"/>`;
        h += `<polyline points="${pts}" fill="none" stroke="rgba(26,122,58,.7)" stroke-width="2.2"
          stroke-linecap="round" pointer-events="none"/>`;
      }

      // 跨旬段（暗色虚线）
      if(splitIdx < preview.hexPath.length){
        const bridgeHp = splitIdx > 0 ? preview.hexPath[splitIdx-1] : {col: selUnit.hq, row: selUnit.hr};
        let pts2 = '';
        const bp = hexToPixel(bridgeHp.col, bridgeHp.row);
        pts2 += `${bp.x.toFixed(1)},${bp.y.toFixed(1)}`;
        for(let i = splitIdx; i < preview.hexPath.length; i++){
          const pp = hexToPixel(preview.hexPath[i].col, preview.hexPath[i].row);
          pts2 += ` ${pp.x.toFixed(1)},${pp.y.toFixed(1)}`;
        }
        h += `<polyline points="${pts2}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3" stroke-linecap="round" pointer-events="none"/>`;
        h += `<polyline points="${pts2}" fill="none" stroke="rgba(138,106,16,.45)" stroke-width="1.5"
          stroke-dasharray="5,3" pointer-events="none"/>`;
      }

      // 终点标记：闪烁圆圈 + 旬数
      const lastHp = preview.hexPath[preview.hexPath.length - 1];
      const lastPos = hexToPixel(lastHp.col, lastHp.row);
      const invS = 1 / _mapScale;
      h += `<circle cx="${lastPos.x}" cy="${lastPos.y}" r="${12*invS}" fill="rgba(138,106,16,.10)" stroke="rgba(138,106,16,.65)" stroke-width="${1.5*invS}" stroke-dasharray="4,2" pointer-events="none">
        <animate attributeName="r" values="${10*invS};${14*invS};${10*invS}" dur="1.2s" repeatCount="indefinite"/>
      </circle>`;
      // 旬数标签（v99: 本旬可达显示绿色"本旬抵达"）
      const canReachThisTurn = splitIdx >= preview.hexPath.length;
      const labelText = canReachThisTurn
        ? (preview.label ? preview.label + ' ' : '') + '本旬抵达'
        : (preview.label ? preview.label + ' ' : '') + '约' + preview.turns + '旬';
      const labelCol = canReachThisTurn ? 'rgba(26,122,58,.8)' : 'rgba(138,106,16,.85)';
      const labelBorder = canReachThisTurn ? 'rgba(26,122,58,.5)' : 'rgba(138,106,16,.5)';
      h += `<g transform="translate(${lastPos.x},${(lastPos.y - 14*invS).toFixed(1)})" pointer-events="none">
        <rect x="${-30*invS}" y="${-7*invS}" width="${60*invS}" height="${14*invS}" rx="${3*invS}"
          fill="rgba(245,238,225,.94)" stroke="${labelBorder}" stroke-width="${0.8*invS}"/>
        <text x="0" y="${1*invS}" text-anchor="middle" dominant-baseline="middle"
          font-family="Noto Serif SC,serif" font-size="${8*invS}" fill="${labelCol}"
          font-weight="700">${labelText}</text>
      </g>`;
      // 提示文字："再次点击确认"（仅远距离需确认时显示）
      if(!canReachThisTurn || preview.hexPath.length > 2){
        h += `<g transform="translate(${lastPos.x},${(lastPos.y + 10*invS).toFixed(1)})" pointer-events="none">
          <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
            font-family="Noto Serif SC,serif" font-size="${6.5*invS}" fill="rgba(138,106,16,.5)"
            font-weight="400">再次点击确认</text>
        </g>`;
      }
    }
  }

  return h;
}



// ═══════════════════════════════════════════════════════
// 右侧面板：部队详情

function renderUnitDetail(c){
  const unit=G.units.find(u=>u.id===G.selUnitId);
  if(!unit){renderMilTab(c);return;}
  const col=FAC[unit.fac]?.color||'#888';
  const isPlayer=unit.fac===G.playerFac;
  const ap=calcUnitAP(unit);
  const total=getUnitTroops(unit);
  const troopType=getMainTroopType(unit);
  const _uhp3=hexToPixel(unit.hq??0,unit.hr??0); const atPx=_uhp3.x,atPy=_uhp3.y;
  const _dpos=getUnitDisplayPos(unit);
  const atCityId2 = getUnitNodeId(unit);
  const atCity = atCityId2 ? G.cities[atCityId2] : null;

  const foodCost=Math.floor(total*getUnitFoodRate(unit));

  const isEnemy = !isPlayer && !canSeeFactionData(G.playerFac, unit.fac);
  if (isEnemy) {
    const _si = getScoutINT(unit);
    const backBtn=`<div style="margin-bottom:8px">
      <button class="act-btn" style="font-size:9px;padding:2px 8px;opacity:.6"

    </div>`;
    const titleName = fuzzyGenDisplay(unit, _si);
    // 编制信息（按INT分层）

    if (_si >= 90) {
      squadHtml = unit.squads.map((sq,i) => {
        const td = TROOP_TYPES[sq.type]||{icon:'?',name:sq.type};
        const gd = GEN_MAP[sq.genName]||{com:70,war:70,int:70};
        return `<div class="ud-squad">
          <div class="ud-squad-header">
            <span class="ud-squad-label">${i===0?'主将':'副将'}</span>
            <span class="ud-squad-gen">${sq.genName}</span>
            <span class="ud-squad-type">${td.icon} ${td.name}</span>
          </div>
          <div class="ud-attrs">
            ${[['统',gd.com],['武',gd.war],['智',gd.int]].map(([l,v])=>{
              const c2=v>=90?'#8a7040':v>=75?'#1a7a3a':v>=60?'#1a5f8a':'#666';
              return`<span class="ud-attr" style="color:${c2};border-color:${c2}30">${l}${v}</span>`;

          </div>
        </div>`;

    } else if (_si >= 75) {
      squadHtml = unit.squads.map((sq,i) => {

          <div class="ud-squad-header">
            <span class="ud-squad-label">${i===0?'主将':'副将'}</span>
            <span class="ud-squad-gen">${sq.genName}</span>
            <span class="ud-squad-type">${td.icon} ${td.name}</span>

        </div>`;

    } else if (_si >= 60) {
      squadHtml = `<div class="ud-squad"><div class="ud-squad-header">
        <span class="ud-squad-label">主将</span>
        <span class="ud-squad-gen">${unit.squads[0]?.genName||'?'}</span>
      </div></div>`;
    } else {
      squadHtml = `<div style="font-size:10px;color:rgba(92,74,50,.35);padding:8px 0">将领身份不明</div>`;
    }
    const intelLabel = _si >= 90 ? '情报精确' : _si >= 75 ? '情报较清晰' : _si >= 60 ? '情报模糊' : '情报极模糊';
    const intelCol = _si >= 90 ? '#1a7a3a' : _si >= 75 ? '#2a7a9a' : _si >= 60 ? '#8a6a10' : '#b04040';

      <div class="cd-name" style="color:${col}">${titleName}</div>

        ${FAC[unit.fac]?.full} · ${atCity?atCity.name:'野外'} ·
        ${unit.status==='garrison'?'🛡驻扎':'⚔行军'}
      </div>
      <div style="font-size:9px;color:${intelCol};margin-bottom:10px;padding:4px 8px;border:1px solid ${intelCol}30;border-radius:3px">
        🔍 ${intelLabel}
      </div>
      <div class="sec">侦知编制</div>
      <div class="ud-squads">${squadHtml}</div>
      <div class="sec">侦知兵力</div>
      <div class="ud-stats">
        <div class="ud-stat-row"><span>兵力</span><b>${fuzzyTroopDisplay(total, _si)}</b></div>
      </div>
    `;
    return;
  }

  const squadRows=unit.squads.map((sq,i)=>{
    const td=TROOP_TYPES[sq.type]||{icon:'?',name:sq.type};
    const gd=GEN_MAP[sq.genName]||{com:70,war:70,int:70};
    const mCol=sq.morale>=70?'#1a7a3a':sq.morale>=40?'#8a6a10':'#c03030';

    const expandBtn=canExpand?
      `<button class="act-btn" style="margin-top:3px;font-size:9px;padding:3px 8px;border-color:rgba(100,180,255,.4);color:rgba(100,180,255,.8)"
        onclick="openExpandModal('${unit.id}',${i})">
        ⬆ 扩编（上限${fmt(getSquadMax(unit.fac))}）
      </button>`:'';
    // ★ v167: 显示当前生效标签
    const _sqCls = getSquadClass(sq);
    const _sqClsMeta = CLASS_META[_sqCls]||CLASS_META.warrior;
    const _sqClsTag = `<span class="gen-class-tag ${_sqCls}">${_sqClsMeta.icon}${_sqClsMeta.label}</span>`;
    return `<div class="ud-squad">
      <div class="ud-squad-header">
        <span class="ud-squad-label">${i===0?'主将':'副将'}</span>
        <span class="ud-squad-gen">${sq.genName}</span>
        ${_sqClsTag}
        <span class="ud-squad-type">${td.icon} ${td.name}</span>
        <span class="ud-squad-troops">${fmt(sq.troops)}/${fmt(sq.maxTroops||sq.troops)}兵${getRetainers(sq.genName)>0?` <span style="color:#8a7040;font-size:8px">（部曲${fmt(getRetainersDisplay(sq.genName))}）</span>`:''}</span>
      </div>
      ${getRetainers(sq.genName)>0?`<div style="font-size:8px;color:rgba(138,112,64,.6);margin:-2px 0 2px 0">有效等级 Lv${getEffectiveSquadLevel(sq, unit.level||1)}${getEffectiveSquadLevel(sq, unit.level||1)!==(unit.level||1)?' <span style="color:#1a7a3a">▲'+(getEffectiveSquadLevel(sq, unit.level||1)-(unit.level||1))+'</span>':''}</div>`:''}
      ${sq._musterTarget ? (()=>{
        const pct = Math.min(100, Math.round(((sq._mustered||0) / sq._musterTarget) * 100));
        const mRate = atPlayerCity ? getMusterRate(atPlayerCity.id) : 2000;
        const remain = sq._musterTarget - (sq._mustered||0);
        const estT = remain > 0 ? Math.ceil(remain / mRate) : 0;
        return `<div style="margin:3px 0 2px;font-size:8px;color:rgba(92,74,50,.55)">
          🏰 集结中 ${fmt(sq._mustered||0)}/${fmt(sq._musterTarget)} (${pct}%)${estT>0?' · 约'+estT+'旬':''}
        </div>
        <div style="height:3px;background:rgba(80,65,40,.10);border-radius:2px;margin-bottom:3px">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#6b5530,#e8c84a);border-radius:2px;transition:width .3s"></div>
        </div>`;
      })() : ''}
      <div class="ud-attrs">
        ${[['统',gd.com],['武',gd.war],['智',gd.int]].map(([l,v])=>{
          const c2=v>=90?'#8a7040':v>=75?'#1a7a3a':v>=60?'#1a5f8a':'#666';
          return`<span class="ud-attr" style="color:${c2};border-color:${c2}30">${l}${v}</span>`;
        }).join('')}
        ${sq.type&&gd.apt?`<span class="ud-attr" style="color:#6b5530;border-color:#6b553030">适${gd.apt[TROOP_TYPES[sq.type]?.baseType||sq.type]||'?'}</span>`:''}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:rgba(92,74,50,.45);margin-bottom:2px">
        <span>士气</span><span style="color:${mCol}">${sq.morale}${(()=>{
          const _fm=getFactionMoraleMod(sq.genName, unit.fac);
          if(_fm<=-5) return ' <span style="color:#c03030;font-size:8px">派系'+_fm+'</span>';
          if(_fm>=5)  return ' <span style="color:#4caf50;font-size:8px">派系+'+_fm+'</span>';

        })()}</span>
      </div>
      <div class="ud-morale-bar"><div class="ud-morale-bar-fill" style="width:${sq.morale}%;background:${mCol}"></div></div>
      ${expandBtn}
    </div>`;
  }).join('');

  // ★ v120: 增编分队按钮 (v121fix: +整备/集结检查)
  const _canAddSq = atPlayerCity && unit.status==='garrison' && unit.squads.length < 3
    && unit.squads.reduce((s,q)=>s+(q.maxTroops||q.troops),0) < getUnitMax(unit.fac)
    && _getIdleGens(G.playerFac).length > 0 && unit.fac === G.playerFac
    && (unit.mobilizingTurns||0) <= 0 && !isUnitMustering(unit);
  const _addSquadBtn = _canAddSq
    ? '<button class="act-btn" style="margin:4px 0 8px;font-size:10px;padding:4px 12px;border-color:rgba(42,122,154,.5);color:rgba(42,122,154,.85);width:100%;text-align:center" onclick="openAddSquadModal(\'' + unit.id + '\')">\uFF0B 增编分队（当前' + unit.squads.length + '/3）</button>'
    : '';

  const backBtn=`<div style="margin-bottom:8px">
    <button class="act-btn" style="font-size:9px;padding:2px 8px;opacity:.6"
      onclick="G.selUnitId=null;renderAllLight()">← 返回部队列表</button>
  </div>`;

  c.innerHTML=`
    ${backBtn}
    <div class="cd-name" style="color:${col}">${unit.squads[0]?.genName} 部</div>
    <div style="font-size:10px;color:rgba(92,74,50,.40);margin-bottom:10px">
      ${FAC[unit.fac]?.full} · ${atCity?atCity.name:'野外('+terrain+')'} ·
      ${unit.mobilizingTurns>0?`⚙整备中(${unit.mobilizingTurns}旬)`:isUnitMustering(unit)?'🏰集结中':unit.status==='garrison'?'🛡待命':unit.status==='camp'?'🏕扎营中':unit.status==='ambush'?'🌿埋伏中':'⚔行军'}
    </div>
    <div class="sec">编制</div>
    <div class="ud-squads">${squadRows}</div>
    ${(()=>{
      const _ub = getUnitClassBuffs(unit);

function billetUnit(uid){
  const u=G.units.find(x=>x.id===uid);
  if(!u||u.fac!==G.playerFac) return;
  const cities = getBilletCities(u.fac);
  if(!cities.length){ showNotif('无可用大城','warn'); return; }
  // 弹窗选目标城市
  const body = cities.map(cid=>{
    const c=G.cities[cid]; if(!c) return '';
    const def=CITY_MAP[cid];
    const dist=def?hexDist(u.hq??0,u.hr??0,def.q,def.r):0;
    const poolCount=(c.billetPool||[]).length;
    const travelT = dist <= 5 ? 0 : Math.ceil((dist - 5) / 5);
    const travelStr = travelT > 0 ? `行程${travelT}旬` : '即到';
    return `<div onclick="_confirmBillet('${uid}','${cid}')" style="cursor:pointer;padding:8px 12px;border-bottom:1px solid rgba(80,65,40,.07);display:flex;justify-content:space-between;align-items:center" onmouseover="this.style.background='rgba(80,65,40,.06)'" onmouseout="this.style.background='none'">
      <div><span style="color:${FAC[u.fac]?.color||'#ccc'}">${c.name}</span>${def?.isCapital?'<span style="color:var(--ink-l);font-size:9px;margin-left:2px">★</span>':''}
        <span style="font-size:9px;color:rgba(92,74,50,.35);margin-left:4px">${poolCount?'已有'+poolCount+'支休整':'空'}</span></div>
      <span style="font-size:9px;color:rgba(92,74,50,.35)">${dist}格 · ${travelStr}</span>
    </div>`;
  }).join('');
  const el=document.getElementById('genericModal');
  document.getElementById('genericModalTitle').textContent='选择休整屯田大城';
  document.getElementById('genericModalBody').innerHTML=`
    <div style="padding:8px 14px;font-size:10px;color:rgba(92,74,50,.45)">
      部队将休整屯田，武将释放回闲置池。<br>兵员保留于选定城市，粮饷降至1/5，屯田产粮。
    </div>${body}`;
  el.style.display='flex';
}
function _confirmBillet(uid, cityId){
  closeModal();
  const u=G.units.find(x=>x.id===uid);
  if(!u) return;
  const city=G.cities[cityId];
  if(!city||!canBilletToCity(cityId,u.fac)){ showNotif('城市不可用','warn'); return; }
  // ★ v113: 遣散行程——按距离决定几旬后兵员到达
  const def=CITY_MAP[cityId];
  const dist=def?hexDist(u.hq??0,u.hr??0,def.q,def.r):0;
  const travelTurns = dist <= 5 ? 0 : Math.ceil((dist - 5) / 5); // 5格内即到，每多5格+1旬
  const readyTurn = G.turn + travelTurns;
  // 提取兵员信息
  const pool = city.billetPool = city.billetPool || [];
  u.squads.forEach(sq=>{
    if(sq.troops<=0) return;
    // ★ v164: billet拆双条目——部曲条目(绑武将)+辅兵条目(通用)
    const _ret = getRetainers(sq.genName);
    const _retInSq = Math.min(_ret, sq.troops);
    const _auxTroops = sq.troops - _retInSq;
    const _retType = getRetainerType(sq.genName) || sq.type;
    // 部曲条目（绑武将，别人不可用）
    if(_retInSq > 0){
      pool.push({
        id: 'bp_'+G.turn+'_'+Math.random().toString(36).slice(2,6),
        troops: _retInSq, maxTroops: _retInSq,
        type: _retType, level: RETAINER_LEVEL, billetTurn: G.turn,
        readyTurn: readyTurn,
        genName: sq.genName, // ★ v164: 绑定武将，只有此武将可用
      });
    }
    // 辅兵条目（通用，兵种锁定）
    if(_auxTroops > 0){
      pool.push({
        id: 'bp_'+G.turn+'_'+Math.random().toString(36).slice(2,6),
        troops: _auxTroops, maxTroops: Math.max(_auxTroops, (sq.maxTroops||sq.troops) - _retInSq),
        type: sq.type, level: u.level||1, billetTurn: G.turn,
        readyTurn: readyTurn,
      });
    }
    // ★ v167fix: 部曲数据转移到仓库后，清零户口本（防止双写）
    if(_retInSq > 0) setRetainers(sq.genName, 0);
  });
  const genNames=u.squads.map(sq=>sq.genName).join('、');
  const totalTroops=getUnitTroops(u);
  const travelMsg = travelTurns > 0 ? `（行程${travelTurns}旬）` : '';
  log(`🏠 ${genNames} 休整屯田于${city.name}，${fmt(totalTroops)}兵入库（Lv${u.level||1}）${travelMsg}，武将归队`,'economy');
  // 删除部队
  G.units=G.units.filter(x=>x.id!==uid);
  if(G.selUnitId===uid) G.selUnitId=null;
  renderAllLight();
}

let _rdp = { cityId:null, slots:[
  {gen:null, retPoolIdx:-1, auxPoolIdx:-1}, // main (required)
  {gen:null, retPoolIdx:-1, auxPoolIdx:-1, active:false}, // sub1
  {gen:null, retPoolIdx:-1, auxPoolIdx:-1, active:false}, // sub2
], editSlot:0 };

function openRedeployModal(cityId, firstPoolIdx){
  const city=G.cities[cityId];
  if(!city||city.fac!==G.playerFac) return;
  const pool=city.billetPool||[];
  const entry=pool[firstPoolIdx];
  if(!entry){ showNotif('兵员不存在','warn'); return; }
  if(entry.readyTurn && entry.readyTurn > G.turn){
    showNotif(`兵员行军中，还需${entry.readyTurn - G.turn}旬抵达`,'warn'); return;
  }
  // 根据点击的条目类型预填
  const s0 = {gen:null, retPoolIdx:-1, auxPoolIdx:-1};
  if(entry.genName){
    s0.gen = entry.genName; s0.retPoolIdx = firstPoolIdx;
  } else {
    s0.auxPoolIdx = firstPoolIdx;
  }
  _rdp={cityId, slots:[
    s0,
    {gen:null, retPoolIdx:-1, auxPoolIdx:-1, active:false},
    {gen:null, retPoolIdx:-1, auxPoolIdx:-1, active:false},
  ], editSlot:0};
  document.getElementById('genericModal').style.display='flex';
  document.getElementById('genericModalTitle').textContent='重新编组 — 配置将领';
  _renderRedeployModal();
}

function _rdpGetReadyPool(){
  const city=G.cities[_rdp.cityId];
  const pool=city?.billetPool||[];
  return pool.map((e,i)=>({e,i})).filter(({e})=>!e.readyTurn || e.readyTurn <= G.turn);
}

/** 获取slot的总兵力和合并信息 */
function _rdpSlotInfo(slot, pool){
  let troops=0, maxTroops=0, type=null, level=0, levelW=0;
  const indices=[];
  if(slot.retPoolIdx>=0 && pool[slot.retPoolIdx]){
    const e=pool[slot.retPoolIdx];
    troops+=e.troops; maxTroops+=e.maxTroops; levelW+=e.level*e.troops;
    type=e.type; indices.push(slot.retPoolIdx);
  }
  if(slot.auxPoolIdx>=0 && pool[slot.auxPoolIdx]){
    const e=pool[slot.auxPoolIdx];
    troops+=e.troops; maxTroops+=e.maxTroops; levelW+=e.level*e.troops;
    if(!type) type=e.type;
    indices.push(slot.auxPoolIdx);
  }
  level = troops>0 ? Math.round(levelW/troops) : 1;
  return {troops, maxTroops, type, level, indices};
}

function _renderRedeployModal(){
  const city=G.cities[_rdp.cityId];
  if(!city) return;
  const pool=city.billetPool||[];
  const deployed=getDeployedGens(G.playerFac);
  const allGens=(G.generals[G.playerFac]||[]).filter(g=>!deployed.has(g.name));
  const readyPool=_rdpGetReadyPool();

  // collect used pool indices and gen names across all active slots
  const usedPoolIdx=new Set();
  const usedGens=new Set();
  _rdp.slots.forEach((s,i)=>{
    if(i>0&&!s.active) return;
    if(s.retPoolIdx>=0) usedPoolIdx.add(s.retPoolIdx);
    if(s.auxPoolIdx>=0) usedPoolIdx.add(s.auxPoolIdx);
    if(s.gen) usedGens.add(s.gen);
  });
  const es=_rdp.editSlot;
  const slot=_rdp.slots[es];

  // total troops across all slots
  const totalTroops=_rdp.slots.filter((s,i)=>i===0||s.active).reduce((sum,s)=>{
    return sum+_rdpSlotInfo(s,pool).troops;
  },0);

  // slot summary cards
  const slotCard=(idx)=>{
    const s=_rdp.slots[idx];
    const isMain=idx===0;
    const active=isMain||s.active;
    const info=_rdpSlotInfo(s,pool);
    const isEdit=es===idx;
    const tIcon=info.type?TROOP_TYPES[info.type]?.icon||'':'';
    const label=isMain?'主将 ★':idx===1?'副将一':'副将二';
    const retE=s.retPoolIdx>=0?pool[s.retPoolIdx]:null;
    const auxE=s.auxPoolIdx>=0?pool[s.auxPoolIdx]:null;
    const detailParts=[];
    if(retE) detailParts.push(`<span style="color:#8a7040">部曲${fmt(retE.troops)}</span>`);
    if(auxE) detailParts.push(`辅兵${fmt(auxE.troops)}`);
    return `<div style="padding:6px 8px;border:1px solid ${isEdit?'rgba(92,74,50,.5)':'rgba(80,65,40,.08)'};background:${isEdit?'rgba(80,65,40,.05)':'none'};cursor:pointer;margin-bottom:3px;opacity:${active?1:.4}" onclick="${!isMain&&!active?`_rdpToggleSub(${idx},true)`:`_rdpEditSlot(${idx})`}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:10px;color:rgba(92,74,50,.55)">${label}</span>
        ${!isMain?`<label style="font-size:9px;color:rgba(92,74,50,.40)" onclick="event.stopPropagation()"><input type="checkbox" ${active?'checked':''} onchange="_rdpToggleSub(${idx},this.checked)"> 启用</label>`:''}
      </div>
      ${active?`<div style="margin-top:3px;font-size:10px">
        <span style="color:rgba(92,74,50,.7)">${s.gen||'<span style=color:rgba(200,80,60,.6)>未选将领</span>'}</span>
        ${info.troops>0?` · ${tIcon} ${fmt(info.troops)}兵 Lv${info.level} <span style="font-size:8px;color:rgba(92,74,50,.4)">(${detailParts.join('+')})</span>`
          :'<span style="color:rgba(200,80,60,.6)"> · 未选兵员</span>'}
      </div>`:`<div style="font-size:9px;color:rgba(80,65,40,.15);margin-top:2px">点击启用副将</div>`}
    </div>`;
  };

  // edit area for current slot
  let editArea='';
  if(_rdp.slots[es] && (es===0 || _rdp.slots[es].active)){
    // ── 武将选择（先选将）──
    const genCards=allGens.map(g=>{
      const isSel=slot.gen===g.name;
      const usedOther=usedGens.has(g.name)&&!isSel;
      const hasRet=getRetainers(g.name)>0;
      const retType=getRetainerType(g.name);
      const retTag=hasRet?` <span style="color:#8a7040;font-size:8px">部曲${getRetainersDisplay(g.name)}${retType?' '+(TROOP_TYPES[retType]?.icon||''):''}</span>`:'';
      return `<div onclick="${usedOther?'':`_rdpPickGen(${es},'${g.name}')`}" style="cursor:${usedOther?'not-allowed':'pointer'};padding:5px 8px;border:1px solid ${isSel?'rgba(92,74,50,.55)':'rgba(80,65,40,.07)'};background:${isSel?'rgba(80,65,40,.07)':'none'};margin:2px 0;opacity:${usedOther?.35:1};display:flex;justify-content:space-between;align-items:center">
        <div><span style="color:rgba(44,36,22,.8);font-size:10px">${g.name}</span>
          <span style="font-size:9px;color:rgba(92,74,50,.40);margin-left:4px">统${g.com} 武${g.war} 智${g.int}</span>${retTag}</div>
      </div>`;
    }).join('');

    // ── 辅兵选择（选了将领后才显示）──
    let auxSection='';
    if(slot.gen){
      const retE=slot.retPoolIdx>=0?pool[slot.retPoolIdx]:null;
      const lockedType=retE?.type || (getRetainers(slot.gen)>0 ? getRetainerType(slot.gen) : null);
      let retInfo='';
      if(retE){
        retInfo=`<div style="padding:4px 8px;margin:2px 0;border:1px solid rgba(138,112,64,.25);background:rgba(138,112,64,.06);font-size:10px;color:#8a7040">
          🔒 ${TROOP_TYPES[retE.type]?.icon||''} ${slot.gen}部曲 · ${fmt(retE.troops)}兵 · Lv${retE.level}（自动绑定）
        </div>`;
      }
      const auxCandidates=readyPool.filter(({e,i})=>{
        if(e.genName) return false;
        if(usedPoolIdx.has(i) && i!==slot.auxPoolIdx) return false;
        if(lockedType && e.type !== lockedType) return false;
        return true;
      });
      const auxCards=auxCandidates.map(({e,i})=>{
        const sel=slot.auxPoolIdx===i;
        const tI=TROOP_TYPES[e.type]?.icon||'';
        const tN=TROOP_TYPES[e.type]?.name||e.type;
        return `<div onclick="_rdpPickAux(${es},${i})" style="cursor:pointer;padding:5px 8px;border:1px solid ${sel?'rgba(92,74,50,.55)':'rgba(80,65,40,.07)'};background:${sel?'rgba(80,65,40,.07)':'none'};margin:2px 0;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:10px;color:rgba(92,74,50,.7)">${tI} ${tN} · ${fmt(e.troops)}兵 · Lv${e.level}</span>
          <span style="font-size:8px;color:rgba(92,74,50,.35)">满编${fmt(e.maxTroops)}</span>
        </div>`;
      }).join('');
      const auxLabel=lockedType?`补充辅兵（${TROOP_TYPES[lockedType]?.name||lockedType}·可选）`:'选择兵员';
      auxSection=`${retInfo}
        <div style="font-size:10px;color:rgba(92,74,50,.55);margin:6px 0 4px">${auxLabel}</div>
        <div style="max-height:100px;overflow-y:auto">${auxCards||`<div style="font-size:9px;color:rgba(92,74,50,.35);padding:4px">${lockedType?'无同兵种辅兵可用':'无可用兵员'}</div>`}</div>`;
    }

    editArea=`<div style="margin-top:8px;border-top:1px solid rgba(80,65,40,.08);padding-top:8px">
      <div style="font-size:10px;color:rgba(92,74,50,.55);margin-bottom:4px">选择将领</div>
      <div style="max-height:120px;overflow-y:auto">${genCards||'<div style="font-size:9px;color:rgba(92,74,50,.35);padding:4px">无闲置武将</div>'}</div>
      ${auxSection}
    </div>`;
  }

  const mainInfo=_rdpSlotInfo(_rdp.slots[0],pool);
  const mainOk=_rdp.slots[0].gen && mainInfo.troops>0;
  const canConfirm=mainOk;

  document.getElementById('genericModalBody').innerHTML=`
    <div style="padding:12px 14px">
      <div style="font-size:10px;color:rgba(92,74,50,.40);margin-bottom:8px">
        ${city.name} · 先选将领，部曲自动绑定 · 总兵力${fmt(totalTroops)}
      </div>
      ${slotCard(0)}${slotCard(1)}${slotCard(2)}
      ${editArea}
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="rm-btn cancel" onclick="closeModal()" style="flex:1">取消</button>
        <button class="rm-btn confirm${canConfirm?'':' disabled'}" onclick="${canConfirm?`_confirmRedeploy()`:`showNotif('请为主将选将领','warn')`}" style="flex:1">
          ⚔ 编组出征（2旬整备）
        </button>
      </div>
    </div>`;
}

function _rdpEditSlot(idx){
  if(idx>0&&!_rdp.slots[idx].active) return;
  _rdp.editSlot=idx;
  _renderRedeployModal();
}
function _rdpToggleSub(idx,on){
  _rdp.slots[idx].active=on;
  if(!on){_rdp.slots[idx].gen=null;_rdp.slots[idx].retPoolIdx=-1;_rdp.slots[idx].auxPoolIdx=-1;}
  if(on) _rdp.editSlot=idx;
  _renderRedeployModal();
}
function _rdpPickAux(slotIdx,poolIdx){
  _rdp.slots[slotIdx].auxPoolIdx=(_rdp.slots[slotIdx].auxPoolIdx===poolIdx?-1:poolIdx);
  _renderRedeployModal();
}
function _rdpPickGen(slotIdx,name){
  const toggling = _rdp.slots[slotIdx].gen===name;
  _rdp.slots[slotIdx].gen = toggling ? null : name;
  _rdp.slots[slotIdx].retPoolIdx=-1;
  _rdp.slots[slotIdx].auxPoolIdx=-1;
  if(!toggling && name){
    const city=G.cities[_rdp.cityId];
    const pool=city?.billetPool||[];
    const usedIdx=new Set();
    _rdp.slots.forEach((s,i)=>{
      if(i===slotIdx) return;
      if(i>0&&!s.active) return;
      if(s.retPoolIdx>=0) usedIdx.add(s.retPoolIdx);
      if(s.auxPoolIdx>=0) usedIdx.add(s.auxPoolIdx);
    });
    const retIdx=pool.findIndex((e,i)=>e.genName===name && !usedIdx.has(i) && (!e.readyTurn||e.readyTurn<=G.turn));
    if(retIdx>=0) _rdp.slots[slotIdx].retPoolIdx=retIdx;
  }
  _renderRedeployModal();
}

function _confirmRedeploy(){
  const city=G.cities[_rdp.cityId];
  if(!city) return;
  const pool=city.billetPool||[];
  const mainInfo=_rdpSlotInfo(_rdp.slots[0],pool);
  if(!_rdp.slots[0].gen || mainInfo.troops<=0){ showNotif('请为主将选将领','warn'); return; }

  if(G.units.filter(u=>u.fac===G.playerFac).length >= MAX_FIELD_UNITS_ABS){
    showNotif(`部队数已达上限(${MAX_FIELD_UNITS_ABS})，无法重编`,'warn'); return;
  }

  const squads=[];
  const removeIndices=[];
  for(let i=0;i<3;i++){
    const s=_rdp.slots[i];
    if(i>0&&!s.active) continue;
    if(!s.gen) continue;
    const info=_rdpSlotInfo(s,pool);
    if(info.troops<=0) continue;
    if(s.retPoolIdx>=0 && pool[s.retPoolIdx]?.genName && pool[s.retPoolIdx].genName !== s.gen){
      showNotif(`${pool[s.retPoolIdx].genName}的部曲不可交给${s.gen}指挥`,'warn'); return;
    }
    squads.push({genName:s.gen, type:info.type, troops:info.troops, maxTroops:info.maxTroops, morale:75});
    info.indices.forEach(idx=>removeIndices.push(idx));
  }
  if(!squads.length) return;

  const totalT=squads.reduce((s,sq)=>s+sq.troops,0);
  let wLv=0,wT=0;
  removeIndices.forEach(pi=>{
    const e=pool[pi]; if(!e)return;
    wLv+=e.level*e.troops; wT+=e.troops;
  });
  const unitLevel=wT>0?Math.round(wLv/wT):1;

  const unit=createUnit({fac:G.playerFac, spawnCityId:_rdp.cityId, squads});
  if(!unit) return;
  unit.level=unitLevel; unit.exp=0;
  unit.mobilizingTurns=2; unit._apRemaining=0;
  G.units.push(unit);

  const uniqueRemove=[...new Set(removeIndices)].sort((a,b)=>b-a);
  // ★ v167fix: 部曲条目取出→写回户口本
  uniqueRemove.forEach(pi=>{
    const bp = pool[pi];
    if(bp && bp.genName && bp.troops > 0) setRetainers(bp.genName, bp.troops, bp.type);
  });
  uniqueRemove.forEach(pi=>pool.splice(pi,1));

  const genNames=squads.map(sq=>sq.genName).join('、');
  log(`⚔ ${genNames} 于${city.name}重编${fmt(totalT)}老兵（Lv${unitLevel}），2旬整备`,'economy');
  closeModal();
  G.selCity=_rdp.cityId; G.activeTab='city'; updateTabs();
  renderAllLight();
}

// ═══════════════════════════════════════════════════════
// 扩征系统（★ v114: 手动补员已删除，补员完全由processReinforcement自动处理）

// 军事链 MIL8.k (getUnitAtCity,L21689-L21692) 已抽离到 src/chains/military.js

// ═══════════════════════════════════════════════════════
// ★ v113: 扩编系统（提高maxTroops + 即时征入新兵）
// ═══════════════════════════════════════════════════════
let _ex={unitId:null, squadIdx:0, amount:1000};

function openExpandModal(unitId, squadIdx){
  const unit=G.units.find(u=>u.id===unitId);
  if(!unit)return;
  const sq=unit.squads[squadIdx];
  if(!sq)return;
  // ★ v114: 集结中不能再扩编
  if(sq._musterTarget){showNotif('该队正在集结中，请等集结完成后再扩编','warn');return;}
  if(unit.status!=='garrison'){
    showNotif('扩编需驻扎于己方城市','warn');return;
  }
  const atCity=getUnitAtCity(unit);
  if(!atCity||atCity.fac!==G.playerFac){
    showNotif('扩编需驻扎于己方城市','warn');return;
  }
  const maxExpand=getSquadMax(G.playerFac)-(sq.maxTroops||sq.troops);
  if(maxExpand<=0){
    showNotif(`已达满编上限${fmt(getSquadMax(G.playerFac))}`,'warn');return;
  }
  // 部队总兵力上限检查
  const totalTroopsCurrent=unit.squads.reduce((s,q)=>s+(q.maxTroops||q.troops),0);
  const unitMaxExpand=getUnitMax(G.playerFac)-totalTroopsCurrent;
  if(unitMaxExpand<=0){
    showNotif(`部队总编制已达上限${fmt(getUnitMax(G.playerFac))}`,'warn');return;
  }
  const cap=Math.min(maxExpand, unitMaxExpand);
  _ex={unitId, squadIdx, amount:Math.min(1000, cap)};
  document.getElementById('exTitle').textContent=`扩编 · ${sq.genName}队`;
  document.getElementById('expandModal').style.display='flex';
  renderExpandModal();
}

function closeExpandModal(){
  document.getElementById('expandModal').style.display='none';
}

function renderExpandModal(){
  const unit=G.units.find(u=>u.id===_ex.unitId);
  if(!unit)return;
  const sq=unit.squads[_ex.squadIdx];
  const atCity=getUnitAtCity(unit);
  const fac=G.factions[G.playerFac];
  const currentMax=sq.maxTroops||sq.troops;
  const squadCap=getSquadMax(G.playerFac)-currentMax;
  const totalTroopsCurrent=unit.squads.reduce((s,q)=>s+(q.maxTroops||q.troops),0);
  const unitCap=getUnitMax(G.playerFac)-totalTroopsCurrent;
  const maxExpand=Math.min(squadCap, unitCap);
  const amt=Math.min(_ex.amount, maxExpand);

  // 费用：与征兵同价
  const _gentryMult=getGentryRecruitMult(atCity?.id);
  const _barrDisc=getBarracksDiscount(atCity);
  const _yibing=atCity?._yibingBuff&&atCity._yibingBuff.expiresAt>G.turn?0.70:1.0;
  const _techRC=1+getTechEffect(G.playerFac,'recruitCostMult'); // ★ v115
  const _exDispCM = TROOP_TYPES[sq.type]?.costMult || 1.0; // ★ v116
  const costGold=Math.floor(1200*amt/5000*_gentryMult*_barrDisc*_yibing*_techRC*_exDispCM);
  const goldOk=fac.res.gold>=costGold;

  // 等级预览
  // ★ v116: 特色兵种扩编eliteLevel
  const _exDispEliteLv = TROOP_TYPES[sq.type]?.eliteLevel || 0;
  const cityLevel = _exDispEliteLv > 0 ? Math.max(_exDispEliteLv, getInitLevel(atCity)) : getInitLevel(atCity);
  const currentLevel=unit.level||1;
  const newLevel=((sq.troops*currentLevel)+(amt*cityLevel))/(sq.troops+amt);

  const _exDispMatCost = calcSlotMatCost(sq.type, amt);
  const matOk = canAffordMat(G.playerFac, _exDispMatCost);

  const canConfirm=amt>0&&goldOk&&matOk;

  document.getElementById('exContent').innerHTML=`
    <div style="font-size:10px;color:rgba(92,74,50,.55);margin-bottom:10px">
      ${TROOP_TYPES[sq.type]?.icon||''} ${sq.genName} ${genClassTagsHtml(sq.genName)}
      · ${TROOP_TYPES[sq.type]?.name||sq.type}
      · 现有${fmt(sq.troops)}/${fmt(currentMax)}兵 · 上限${fmt(getSquadMax(G.playerFac))}
    </div>
    <div class="rm-troop-input-row">
      <span class="rm-troop-label">扩编兵力</span>
      <button class="rm-num-btn" onclick="exAdj(-500)">−</button>
      <input class="rm-num-input" type="number" value="${amt}" min="500" max="${maxExpand}" step="500"
        oninput="exSet(this.value)">
      <button class="rm-num-btn" onclick="exAdj(500)">＋</button>
    </div>
    <div class="rm-cost-bar">
      <div class="rm-cost-row">
        💰 <span class="${goldOk?'rm-cost-ok':'rm-cost-bad'}">${fmt(costGold)}</span><span style="color:rgba(44,36,22,.30)">/${fmt(fac.res.gold)}</span>
        ${Object.entries(_exDispMatCost).map(([r,v])=>{
          const icons={iron:'⚙',wood:'🪵',horses:'🐴'};
          const names={iron:'铁',wood:'木',horses:'马'};
          const has=(fac.res[r]||0)>=v;
          return `<span style="margin-left:10px">${icons[r]||r} <span class="${has?'rm-cost-ok':'rm-cost-bad'}">${v}</span><span style="color:rgba(44,36,22,.30)">/${fmt(fac.res[r]||0)}</span></span>`;
        }).join('')}
      </div>
    </div>
    <div style="font-size:9px;color:rgba(92,74,50,.40);margin:8px 0;line-height:1.6">
      扩编后：${fmt(sq.troops+amt)}/${fmt(currentMax+amt)}兵<br>
      新兵等级Lv${cityLevel} → 部队等级Lv${currentLevel}→Lv${Math.round(newLevel)}<br>
      <span style="color:#8a6a10">整备1旬${amt<=getMusterRate(getUnitAtCity(unit)?.id)?'（当旬即满编）':'＋集结约'+Math.ceil((amt-getMusterRate(getUnitAtCity(unit)?.id))/getMusterRate(getUnitAtCity(unit)?.id))+'旬'}</span><br>
      <span style="color:rgba(100,180,255,.6)">🏰 集结速率 ${fmt(getMusterRate(getUnitAtCity(unit)?.id))}/旬</span>
    </div>
    <div class="rm-btn-row">
      <button class="rm-btn cancel" onclick="closeExpandModal()">取消</button>
      <button class="rm-btn confirm${canConfirm?'':' disabled'}"
        onclick="${canConfirm?'confirmExpand()':'showNotif(\'资源不足\',\'warn\')'}">
        ⬆ 扩编${fmt(amt)}人
      </button>
    </div>`;
}

function exAdj(delta){
  const unit=G.units.find(u=>u.id===_ex.unitId);
  const sq=unit?.squads[_ex.squadIdx];
  if(!sq)return;
  const currentMax=sq.maxTroops||sq.troops;
  const squadCap=getSquadMax(G.playerFac)-currentMax;
  const totalTroopsCurrent=unit.squads.reduce((s,q)=>s+(q.maxTroops||q.troops),0);
  const unitCap=getUnitMax(G.playerFac)-totalTroopsCurrent;
  const maxExpand=Math.min(squadCap, unitCap);
  _ex.amount=Math.max(500,Math.min(_ex.amount+delta,maxExpand));
  renderExpandModal();
}
function exSet(v){
  const unit=G.units.find(u=>u.id===_ex.unitId);
  const sq=unit?.squads[_ex.squadIdx];
  if(!sq)return;
  const currentMax=sq.maxTroops||sq.troops;
  const squadCap=getSquadMax(G.playerFac)-currentMax;
  const totalTroopsCurrent=unit.squads.reduce((s,q)=>s+(q.maxTroops||q.troops),0);
  const unitCap=getUnitMax(G.playerFac)-totalTroopsCurrent;
  const maxExpand=Math.min(squadCap, unitCap);
  _ex.amount=Math.max(500,Math.min(parseInt(v)||500,maxExpand));
  renderExpandModal();
}

function confirmExpand(){
  const unit=G.units.find(u=>u.id===_ex.unitId);
  if(!unit)return;
  const sq=unit.squads[_ex.squadIdx];
  if(!sq)return;
  const atCity=getUnitAtCity(unit);
  const fac=G.factions[G.playerFac];
  const currentMax=sq.maxTroops||sq.troops;
  const squadCap=getSquadMax(G.playerFac)-currentMax;
  const totalTroopsCurrent=unit.squads.reduce((s,q)=>s+(q.maxTroops||q.troops),0);
  const unitCap=getUnitMax(G.playerFac)-totalTroopsCurrent;
  const maxExpand=Math.min(squadCap, unitCap);
  const amt=Math.min(_ex.amount, maxExpand);
  if(amt<=0)return;

  // 费用
  const _gentryMult=getGentryRecruitMult(atCity?.id);
  const _barrDisc=getBarracksDiscount(atCity);
  const _yibing=atCity?._yibingBuff&&atCity._yibingBuff.expiresAt>G.turn?0.70:1.0;
  const _exEliteCM = TROOP_TYPES[sq.type]?.costMult || 1.0; // ★ v116
  const costGold=Math.floor(1200*amt/5000*_gentryMult*_barrDisc*_yibing*(1+getTechEffect(G.playerFac,'recruitCostMult'))*_exEliteCM); // ★ v115+v116
  if(fac.res.gold<costGold){showNotif('金钱不足','warn');return;}
  // ★ v118fix: 扩编也扣材料
  const _exMatCost = calcSlotMatCost(sq.type, amt);
  for(const[r,v] of Object.entries(_exMatCost)){
    const resName={iron:'铁矿',wood:'木材',horses:'马匹'}[r]||r;
    if((fac.res[r]||0)<v){showNotif(`${resName}不足（需${v}）`,'warn');return;}
  }

  // 扣资源
  safeSub(fac.res, 'gold', costGold);
  deductMat(G.playerFac, _exMatCost);

  // 征兵惩罚（与征兵一致）
  if(atCity){
    // ★ v164fix: 惩罚系数与征兵/AI扩编统一（旧：×30/×30，修正：×100/×120）
    const rcRatio=amt/atCity.pop;
    atCity.popQuality=Math.max(20,(atCity.popQuality||80)-rcRatio*100);
    atCity.morale=Math.max(0,(atCity.morale||50)-rcRatio*120);
  }

  // 等级加权平均（★ v121fix: 基于部队总兵力而非单分队）
  // ★ v116: 特色兵种扩编出厂eliteLevel
  const _exEliteLv = TROOP_TYPES[sq.type]?.eliteLevel || 0;
  const cityLevel = _exEliteLv > 0 ? Math.max(_exEliteLv, getInitLevel(atCity)) : getInitLevel(atCity);
  const oldLevel=unit.level||1;
  const oldTotal=getUnitTroops(unit);
  const newLevelRaw=(oldTotal*oldLevel+amt*cityLevel)/(oldTotal+amt);
  unit.level=Math.max(1,Math.min(UNIT_LEVEL_MAX,Math.round(newLevelRaw)));

  // ★ v114: 扩编走集结——maxTroops立即提升，当旬立即集结第一批
  const mRate = getMusterRate(atCity?.id);
  const firstBatch = Math.min(mRate, amt);
  sq.maxTroops=currentMax+amt;
  sq.troops += firstBatch; // 当旬立即加入第一批
  if(firstBatch < amt) {
    // 还有剩余需要集结
    sq._musterTarget = sq.troops + (amt - firstBatch);
    sq._mustered = sq.troops;
  }
  // else: 当旬就满了，不需要集结标记

  // 扩编恢复整备1旬：当旬有兵但不能动，下旬可动
  unit.mobilizingTurns=1;
  unit._apRemaining=0;

  const estTurns = amt <= mRate ? 0 : Math.ceil((amt - mRate) / mRate);
  log(`⬆ ${sq.genName}队 扩编${fmt(amt)}人（首批${fmt(firstBatch)}），编制${fmt(currentMax)}→${fmt(sq.maxTroops)}${estTurns>0?'，集结约'+estTurns+'旬':''}，等级Lv${oldLevel}→Lv${unit.level}`,'economy');
  closeExpandModal();
  renderAllLight();
}

// ═══════════════════════════════════════════════════════
// ★ v120: 增编分队系统（2分队部队→3分队）
// ═══════════════════════════════════════════════════════
let _as = { unitId:null, gen:null, type:null, troops:2000 };

function _getIdleGens(fid) {
  // 闲将 = 在势力武将池中，但不在任何部队squads中，不是太守，不是军师
  const gens = G.generals[fid] || [];
  const busyNames = new Set();
  G.units.filter(u => u.fac === fid).forEach(u => u.squads.forEach(sq => { if(sq.genName) busyNames.add(sq.genName); }));
  Object.values(G.cities).forEach(city => { if(city.fac === fid && city.prefect) busyNames.add(city.prefect); });
  const fac = G.factions[fid];
  if(fac?.strategist) busyNames.add(fac.strategist);
  return gens.filter(g => !busyNames.has(g.name));
}

function openAddSquadModal(unitId) {
  const unit = G.units.find(u => u.id === unitId);
  if(!unit) return;
  if(unit.fac !== G.playerFac) return; // ★ v121fix: 安全校验
  if(unit.squads.length >= 3) { showNotif('已有3个分队，无法增编','warn'); return; }
  if(unit.status !== 'garrison') { showNotif('增编需驻扎于己方城市','warn'); return; }
  if(unit.mobilizingTurns > 0) { showNotif('部队整备中，请稍后增编','warn'); return; } // ★ v121fix
  if(isUnitMustering(unit)) { showNotif('部队集结中，请稍后增编','warn'); return; } // ★ v121fix
  const atCity = getUnitAtCity(unit);
  if(!atCity || atCity.fac !== G.playerFac) { showNotif('增编需驻扎于己方城市','warn'); return; }
  const idles = _getIdleGens(G.playerFac);
  if(!idles.length) { showNotif('无闲置武将可编入','warn'); return; }
  _as = { unitId, gen:null, type:null, troops:2000 };
  document.getElementById('asTitle').textContent = `增编分队 · ${unit.squads[0]?.genName || ''}部`;
  document.getElementById('addSquadModal').style.display = 'flex';
  renderAddSquadModal();
}

function closeAddSquadModal() {
  document.getElementById('addSquadModal').style.display = 'none';
}

function renderAddSquadModal() {
  const unit = G.units.find(u => u.id === _as.unitId);
  if(!unit) return;
  const atCity = getUnitAtCity(unit);
  const fac = G.factions[G.playerFac];
  const idles = _getIdleGens(G.playerFac);
  const totalTroopsCurrent = unit.squads.reduce((s,q) => s + (q.maxTroops||q.troops), 0);
  const unitCap = getUnitMax(G.playerFac) - totalTroopsCurrent;
  const squadMax = getSquadMax(G.playerFac);
  const maxT = Math.min(squadMax, unitCap);
  const amt = Math.min(_as.troops, maxT);

  // 武将卡片
  const _asAptLbl={cavalry:'骑',light:'轻',heavy:'重',archer:'弓',siege:'攻',naval:'水'};
  const _asAptCol=v=>v==='S'?'#8a7040':v==='A'?'#1a7a3a':v==='B'?'#1a5f8a':v==='C'?'#888':'#aaa';
  const _asSelBase=_as.type?TROOP_TYPES[_as.type]?.baseType||_as.type:null;
  const genCards = idles.map(g => {
    const gd = GEN_MAP[g.name] || {};
    const sel = _as.gen === g.name;
    const aptRow=gd.apt?['cavalry','light','heavy','archer','siege','naval'].map(k=>{
      const v=gd.apt[k]||'C';
      const hl=_asSelBase===k;
      return `<span style="font-size:8px;color:${_asAptCol(v)};${hl?'font-weight:700;text-decoration:underline;':''}">${_asAptLbl[k]}${v}</span>`;
    }).join('<span style="color:rgba(80,65,40,.15);font-size:7px"> · </span>'):'';
    return `<div class="rm-gen-card${sel?' selected':''}" onclick="asPickGen('${g.name}')" style="cursor:pointer;padding:4px 8px;margin:2px;border:1px solid ${sel?'var(--wei)':'rgba(92,74,50,.2)'};border-radius:4px;display:inline-block;font-size:10px;background:${sel?'rgba(42,122,154,.08)':'transparent'}">
      <b>${g.name}</b> ${genClassTagsHtml(g.name)} <span style="color:rgba(92,74,50,.45)">武${gd.war||'?'} 统${gd.com||'?'} 智${gd.int||'?'}</span>
      ${aptRow?`<div style="margin-top:1px">${aptRow}</div>`:''}
    </div>`;
  }).join('');

  // 兵种选择
  // ★ v164: 部曲兵种锁定视觉
  const _asRetLock = _as.gen && getRetainers(_as.gen) > 0 ? getRetainerType(_as.gen) : (_as.gen ? _getBilletRetainerType(_as.gen) : null);
  const typeIds = ['cavalry','light','archer','heavy','siege'];
  const typeCards = typeIds.map(tid => {
    const td = TROOP_TYPES[tid];
    if(!td) return '';
    const sel = _as.type === tid;
    const locked = _asRetLock && tid !== _asRetLock;
    const lockTag = (_asRetLock && tid === _asRetLock) ? ' 🔒' : '';
    return `<div class="rm-gen-card${sel?' selected':''}" onclick="asPickType('${tid}')" style="cursor:${locked?'not-allowed':'pointer'};padding:4px 8px;margin:2px;border:1px solid ${sel?'var(--wei)':'rgba(92,74,50,.2)'};border-radius:4px;display:inline-block;font-size:10px;background:${sel?'rgba(42,122,154,.08)':'transparent'};opacity:${locked?0.35:1}">
      ${td.icon} ${td.name}${lockTag}
    </div>`;
  }).join('');

  // 特色兵种（如果城市有）
  let eliteCards = '';
  if(atCity) {
    Object.entries(TROOP_TYPES).forEach(([tid, td]) => {
      if(!td.elite || td.homeCity !== atCity.id) return; // ★ v120fix: homeCity not city
      if(atCity.fac !== G.playerFac) return; // 城市必须是己方的
      const cur = G.units.filter(u=>u.fac===G.playerFac).flatMap(u=>u.squads).filter(sq=>sq.type===tid).length;
      if(cur >= (td.maxSquads||3)) return;
      const sel = _as.type === tid;
      eliteCards += '<div class="rm-gen-card' + (sel?' selected':'') + '" onclick="asPickType(\'' + tid + '\')" style="cursor:pointer;padding:4px 8px;margin:2px;border:1px solid ' + (sel?'#c09030':'rgba(92,74,50,.2)') + ';border-radius:4px;display:inline-block;font-size:10px;background:' + (sel?'rgba(192,144,48,.1)':'transparent') + '">' + td.icon + ' ' + td.name + ' ★</div>';
    });
  }

  // 费用计算
  const _gentryMult = getGentryRecruitMult(atCity?.id);
  const _barrDisc = getBarracksDiscount(atCity);
  const _yibing = atCity?._yibingBuff && atCity._yibingBuff.expiresAt > G.turn ? 0.70 : 1.0;
  const _techRC = 1 + getTechEffect(G.playerFac, 'recruitCostMult');
  const _eliteCM = _as.type ? (TROOP_TYPES[_as.type]?.costMult || 1.0) : 1.0;
  const costGold = Math.floor(1200 * amt / 5000 * _gentryMult * _barrDisc * _yibing * _techRC * _eliteCM);
  const goldOk = fac.res.gold >= costGold;
  const matCost = _as.type ? calcSlotMatCost(_as.type, amt) : {};
  const matOk = canAffordMat(G.playerFac, matCost);
  const canConfirm = _as.gen && _as.type && amt >= 500 && goldOk && matOk;
  const mRate = getMusterRate(atCity?.id);

  // Pre-compute complex HTML to avoid nested template literals
  const _asMatHtml = Object.entries(matCost).map(function(pair) {
    const r = pair[0], v = pair[1];
    const icons = {iron:'⚙', wood:'🪵', horses:'🐴'};
    const has = (fac.res[r]||0) >= v;
    return '<span style="margin-left:10px">' + (icons[r]||r) + ' <span class="' + (has?'rm-cost-ok':'rm-cost-bad') + '">' + v + '</span><span style="color:rgba(44,36,22,.30)">/' + fmt(fac.res[r]||0) + '</span></span>';
  }).join('');
  const _asMusterInfo = amt <= mRate ? '（当旬即满编）' : '＋集结约' + Math.ceil((amt - mRate) / mRate) + '旬';
  const _asEliteHtml = eliteCards ? '<div style="margin-bottom:6px">' + eliteCards + '</div>' : '';
  const _asConfirmAttr = canConfirm ? 'confirmAddSquad()' : "showNotif('请选武将、兵种并确认资源','warn')";

  document.getElementById('asContent').innerHTML = `
    <div style="font-size:10px;color:rgba(92,74,50,.55);margin-bottom:8px">
      当前${unit.squads.length}个分队 → 增编至${unit.squads.length+1}个分队
      · 部队总兵力 ${fmt(totalTroopsCurrent)}/${fmt(getUnitMax(G.playerFac))}
    </div>
    <div style="font-size:10px;font-weight:600;margin:6px 0 4px;color:var(--ink)">选择武将</div>
    <div style="max-height:100px;overflow-y:auto;margin-bottom:6px">${genCards || '<span style="color:rgba(92,74,50,.35)">无闲置武将</span>'}</div>
    <div style="font-size:10px;font-weight:600;margin:6px 0 4px;color:var(--ink)">选择兵种</div>
    <div style="margin-bottom:4px">${typeCards}</div>
    ${_asEliteHtml}
    <div style="font-size:10px;font-weight:600;margin:6px 0 4px;color:var(--ink)">兵力</div>
    <div class="rm-troop-input-row">
      <button class="rm-num-btn" onclick="asAdjTroops(-500)">−</button>
      <input class="rm-num-input" type="number" value="${amt}" min="500" max="${maxT}" step="500"
        oninput="asSetTroops(this.value)">
      <button class="rm-num-btn" onclick="asAdjTroops(500)">＋</button>
      <span style="font-size:9px;color:rgba(92,74,50,.4);margin-left:6px">上限${fmt(maxT)}</span>
    </div>
    <div class="rm-cost-bar" style="margin-top:8px">
      <div class="rm-cost-row">
        💰 <span class="${goldOk?'rm-cost-ok':'rm-cost-bad'}">${fmt(costGold)}</span><span style="color:rgba(44,36,22,.30)">/${fmt(fac.res.gold)}</span>
        ${_asMatHtml}
      </div>
    </div>
    <div style="font-size:9px;color:rgba(92,74,50,.40);margin:6px 0;line-height:1.5">
      <span style="color:rgba(100,180,255,.6)">🏰 集结速率 ${fmt(mRate)}/旬 · 整备1旬${_asMusterInfo}</span>
    </div>
    <div class="rm-btn-row">
      <button class="rm-btn cancel" onclick="closeAddSquadModal()">取消</button>
      <button class="rm-btn confirm${canConfirm?'':' disabled'}"
        onclick="${_asConfirmAttr}"
      >＋ 增编分队</button>
    </div>`;
}

function asPickGen(name) {
  _as.gen = name;
  // ★ v164: 有部曲的武将→兵种锁定
  const _rType = getRetainerType(name);
  if(_rType && getRetainers(name) > 0) _as.type = _rType;
  // ★ v167fix: 部曲在billet池中时也锁兵种
  else { const _bType = _getBilletRetainerType(name); if(_bType) _as.type = _bType; }
  renderAddSquadModal();
}
function asPickType(tid) {
  // ★ v164: 有部曲的武将兵种锁定
  if(_as.gen && getRetainers(_as.gen) > 0 && getRetainerType(_as.gen)){
    showNotif(`${_as.gen}有部曲，兵种锁定为${TROOP_TYPES[getRetainerType(_as.gen)]?.name||''}`,'warn');
    return;
  }
  // ★ v167fix: billet池中部曲也锁兵种
  if(_as.gen){
    const _bType = _getBilletRetainerType(_as.gen);
    if(_bType && tid !== _bType){ showNotif(`${_as.gen}有休整部曲，兵种锁定为${TROOP_TYPES[_bType]?.name||_bType}`,'warn'); return; }
  }
  _as.type = tid; renderAddSquadModal();
}
function asAdjTroops(delta) {
  const unit = G.units.find(u => u.id === _as.unitId);
  if(!unit) return;
  const totalTroopsCurrent = unit.squads.reduce((s,q) => s + (q.maxTroops||q.troops), 0);
  const maxT = Math.min(getSquadMax(G.playerFac), getUnitMax(G.playerFac) - totalTroopsCurrent);
  _as.troops = Math.max(500, Math.min(_as.troops + delta, maxT));
  renderAddSquadModal();
}
function asSetTroops(v) {
  const unit = G.units.find(u => u.id === _as.unitId);
  if(!unit) return;
  const totalTroopsCurrent = unit.squads.reduce((s,q) => s + (q.maxTroops||q.troops), 0);
  const maxT = Math.min(getSquadMax(G.playerFac), getUnitMax(G.playerFac) - totalTroopsCurrent);
  _as.troops = Math.max(500, Math.min(parseInt(v)||500, maxT));
  renderAddSquadModal();
}

function confirmAddSquad() {
  const unit = G.units.find(u => u.id === _as.unitId);
  if(!unit) return;
  if(unit.squads.length >= 3) { showNotif('已有3个分队','warn'); return; }
  const atCity = getUnitAtCity(unit);
  if(!atCity || atCity.fac !== G.playerFac) { showNotif('需驻扎于己方城市','warn'); return; }
  const fac = G.factions[G.playerFac];
  if(!_as.gen || !_as.type) { showNotif('请选武将和兵种','warn'); return; }

  // 校验武将确实是闲将
  const idles = _getIdleGens(G.playerFac);
  if(!idles.find(g => g.name === _as.gen)) { showNotif('该武将已有任务','warn'); return; }

  // 特色兵种上限
  const td = TROOP_TYPES[_as.type];
  if(td?.elite && td.maxSquads) {
    const cur = G.units.filter(u => u.fac === G.playerFac).flatMap(u => u.squads).filter(sq => sq.type === _as.type).length;
    if(cur >= td.maxSquads) { showNotif(`${td.name}已达上限(${td.maxSquads}队)`,'warn'); return; }
  }

  const totalTroopsCurrent = unit.squads.reduce((s,q) => s + (q.maxTroops||q.troops), 0);
  const maxT = Math.min(getSquadMax(G.playerFac), getUnitMax(G.playerFac) - totalTroopsCurrent);
  const amt = Math.min(_as.troops, maxT);
  if(amt < 500) { showNotif('兵力不足500','warn'); return; }

  // 费用
  const _gentryMult = getGentryRecruitMult(atCity?.id);
  const _barrDisc = getBarracksDiscount(atCity);
  const _yibing = atCity?._yibingBuff && atCity._yibingBuff.expiresAt > G.turn ? 0.70 : 1.0;
  const _techRC = 1 + getTechEffect(G.playerFac, 'recruitCostMult');
  const _eliteCM = td?.costMult || 1.0;
  const costGold = Math.floor(1200 * amt / 5000 * _gentryMult * _barrDisc * _yibing * _techRC * _eliteCM);
  if(fac.res.gold < costGold) { showNotif('金钱不足','warn'); return; }
  const matCost = calcSlotMatCost(_as.type, amt);
  for(const [r,v] of Object.entries(matCost)) {
    if((fac.res[r]||0) < v) { showNotif(`${({iron:'铁矿',wood:'木材',horses:'马匹'})[r]||r}不足`,'warn'); return; }
  }

  // 扣资源
  safeSub(fac.res, 'gold', costGold);
  deductMat(G.playerFac, matCost);

  // ★ v136: 征兵惩罚大幅加重——质量×100，民心×120
  const rcRatio = amt / atCity.pop;
  atCity.popQuality = Math.max(20, (atCity.popQuality||80) - rcRatio * 100);
  atCity.morale = Math.max(0, (atCity.morale||50) - rcRatio * 120);

  // 等级加权
  const _eliteLv = td?.eliteLevel || 0;
  const cityLevel = _eliteLv > 0 ? Math.max(_eliteLv, getInitLevel(atCity)) : getInitLevel(atCity);
  const oldLevel = unit.level || 1;
  const oldTotal = getUnitTroops(unit);
  const newLevelRaw = (oldTotal * oldLevel + amt * cityLevel) / (oldTotal + amt);
  unit.level = Math.max(1, Math.min(UNIT_LEVEL_MAX, Math.round(newLevelRaw)));

  // 集结
  const mRate = getMusterRate(atCity?.id);
  const firstBatch = Math.min(mRate, amt);
  const newSq = {
    genName: _as.gen, type: _as.type,
    troops: firstBatch, maxTroops: amt, morale: 80,
  };
  if(firstBatch < amt) {
    newSq._musterTarget = amt;
    newSq._mustered = firstBatch;
  }
  unit.squads.push(newSq);

  // 整备1旬
  unit.mobilizingTurns = 1;
  unit._apRemaining = 0;

  const estTurns = amt <= mRate ? 0 : Math.ceil((amt - mRate) / mRate);
  log(`＋ ${unit.squads[0]?.genName}部 增编分队：${_as.gen}·${td?.name||_as.type}·${fmt(amt)}兵（${unit.squads.length}分队）${estTurns>0?'，集结约'+estTurns+'旬':''}`,'economy');
  closeAddSquadModal();
  renderAllLight();
}


function renderMilTab(c){

  if(G.selUnitId){
    renderUnitDetail(c);
    return;
  }

      <div class="sec">部队总览 ${_tabHelpHtml('mil')}</div>
      <div style="color:rgba(92,74,50,.35);font-size:11px;text-align:center;
        padding:38px 0;font-family:'Noto Serif SC',serif;letter-spacing:2px">
        尚无野战部队<br>
        <span style="font-size:9px;opacity:.6">在城池面板征募编组</span>
      </div>`;
    return;
  }
  const rows=weiUnits.map(u=>{
    const total=getUnitTroops(u);

    const atCityId3 = getUnitNodeId(u);

    const statusLabel=u.mobilizingTurns>0?`⚙ ${u.mobilizingTurns}旬`:u.status==='garrison'?'🛡 待':'⚔ 行';
    const squadIcons=u.squads.map(sq=>TROOP_TYPES[sq.type]?.icon||'').join('');
