        oncontextmenu="onUnitRightClick('${u.id}',event)">
      <div class="mur-left">
        <div class="mur-name">${u.squads[0]?.genName}部</div>
        <div class="mur-sub">${squadIcons} ${fmt(total)}兵 · AP${ap}</div>
      </div>
      <div class="mur-right">
        <div class="mur-loc">${atCity?atCity.name:'野外'}</div>
        <div class="mur-status" style="color:${statusCol}">${statusLabel}</div>
      </div>
    </div>`;
  }).join('');
  c.innerHTML=`
    <div class="sec">部队总览 ${_tabHelpHtml('mil')}
      <span style="float:right;font-size:9px;color:rgba(92,74,50,.35)">${weiUnits.length}支 · 左键详情 右键移动</span>
    </div>
    <div class="mil-unit-list">${rows}</div>
    ${(()=>{
      // ★ v113: 休整兵员汇总
      const allBP=[];
      Object.values(G.cities).filter(c2=>c2.fac===G.playerFac).forEach(c2=>{
        (c2.billetPool||[]).forEach((bp,i)=>allBP.push({...bp,cityId:c2.id,cityName:c2.name,idx:i}));
      });
      if(!allBP.length) return '';
      const bpRows=allBP.map(bp=>{
        const tIcon=TROOP_TYPES[bp.type]?.icon||'';
        const restT=G.turn-bp.billetTurn;
        return `<div class="mil-unit-row" onclick="G.selCity='${bp.cityId}';G.activeTab='city';updateTabs();renderRight();" style="cursor:pointer">
          <div class="mur-left">
            <div class="mur-name">${tIcon} Lv${bp.level} · ${fmt(bp.troops)}兵${bp.genName?` <span style="color:#8a7040;font-size:8px">🔒${bp.genName}</span>`:''}</div>
            <div class="mur-sub">休整${restT}旬 · 满编${fmt(bp.maxTroops)}</div>
          </div>
          <div class="mur-right">
            <div class="mur-loc">${bp.cityName}</div>
            <div class="mur-status" style="color:#1a5f8a">🏠 休</div>
          </div>
        </div>`;
      }).join('');
      const totalBPTroops=allBP.reduce((s,bp)=>s+bp.troops,0);
      return `<div class="sec" style="margin-top:8px">休整屯田
        <span style="float:right;font-size:9px;color:rgba(92,74,50,.35)">${allBP.length}支 · ${fmt(totalBPTroops)}兵 · 点击前往城池编组</span>
      </div><div class="mil-unit-list">${bpRows}</div>`;
    })()}`;
}


// ── 地图缩放/平移辅助 ──────────────────────────────────
function _clampMapTransform(){
  const visW=960, visH=740;
  const mapW=960*_mapScale, mapH=740*_mapScale;
  const pad=80;
  _mapTx=Math.min(pad, Math.max(visW-mapW-pad, _mapTx));
  _mapTy=Math.min(pad, Math.max(visH-mapH-pad, _mapTy));
}
function resetMapView(){
  _mapScale=1.2; _mapTx=-100; _mapTy=-50;
  renderMap(); renderOverlay();
}
// ★ v102: 缩放/拖拽性能优化——只更新transform属性，debounce全量渲染
let _zoomRenderTimer = null;
function _applyMapTransformOnly(){
  const root = document.getElementById('mapRoot');
  if(root) root.setAttribute('transform',`translate(${_mapTx.toFixed(1)},${_mapTy.toFixed(1)}) scale(${_mapScale.toFixed(4)})`);
}
function _debouncedMapRender(){
  if(_zoomRenderTimer) clearTimeout(_zoomRenderTimer);
  _zoomRenderTimer = setTimeout(()=>{ _zoomRenderTimer=null; renderMap(); renderOverlay(); }, 180);
}
function zoomMap(delta, cx, cy){
  const oldScale=_mapScale;
  _mapScale=Math.max(_MAP_SCALE_MIN, Math.min(_MAP_SCALE_MAX, _mapScale*(1+delta)));
  _mapTx=cx-(_mapScale/oldScale)*(cx-_mapTx);
  _mapTy=cy-(_mapScale/oldScale)*(cy-_mapTy);
  _clampMapTransform();
  _applyMapTransformOnly();
  _debouncedMapRender();
}

document.addEventListener('DOMContentLoaded',()=>{
  const mapWrap=document.querySelector('.map-wrap');
  if(!mapWrap) return;

  // 滚轮缩放
  mapWrap.addEventListener('wheel',e=>{
    e.preventDefault();
    const svg=document.getElementById('mapSvg');
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const ctm = svg.getScreenCTM();
    if(!ctm) return;
    const svgPt = pt.matrixTransform(ctm.inverse());
    zoomMap(e.deltaY<0?0.12:-0.12, svgPt.x, svgPt.y);
  },{passive:false});

  // 左键拖拽地图（mousedown后记录起始，mousemove判断是否触发拖拽）
  let _dragStarted=false, _dragMoved=false;
  mapWrap.addEventListener('mousedown',e=>{
    if(e.button!==0&&e.button!==1) return;
    const svg=document.getElementById('mapSvg');
    const ctm = svg.getScreenCTM();
    if(!ctm) return;
    // 拖拽只需相对位移，记录 client→SVG 的缩放因子
    // getScreenCTM 的 a/d 分量 = SVG单位/屏幕像素 的缩放
    _mapDrag={
      startX:e.clientX, startY:e.clientY,
      startTx:_mapTx, startTy:_mapTy,
      scaleX:1/ctm.a, scaleY:1/ctm.d,
      moved:false
    };
    _dragStarted=true; _dragMoved=false;
    if(e.button===1) e.preventDefault();
  });
  // ★ v154fix M3: 具名函数引用，支持backToTitle中removeEventListener
  function _onDocMouseMove(e){
    if(!_mapDrag) return;
    const dx=(e.clientX-_mapDrag.startX)*_mapDrag.scaleX;
    const dy=(e.clientY-_mapDrag.startY)*_mapDrag.scaleY;
    // 移动超过5px才判断为拖拽（避免误触点击）
    if(!_mapDrag.moved && Math.hypot(dx,dy)<5) return;
    _mapDrag.moved=true; _dragMoved=true;
    _mapTx=_mapDrag.startTx+dx;
    _mapTy=_mapDrag.startTy+dy;
    _clampMapTransform();
    mapWrap.style.cursor='grabbing';
    _applyMapTransformOnly();
    _debouncedMapRender();
  }
  function _onDocMouseUp(e){
    if(_mapDrag){
      const wasDrag=_mapDrag.moved;
      _mapDrag=null; _dragStarted=false;
      mapWrap.style.cursor='';
      // ★ v102: 拖拽结束立即做一次全量渲染（确保反缩放文字正确）
      if(wasDrag){ _suppressNextClick=true; if(_zoomRenderTimer){clearTimeout(_zoomRenderTimer);_zoomRenderTimer=null;} renderMap(); renderOverlay(); }
    }
  }
  document.addEventListener('mousemove', _onDocMouseMove);
  document.addEventListener('mouseup', _onDocMouseUp);
  // 存储引用供backToTitle清理
  window._mapDocMouseMove = _onDocMouseMove;
  window._mapDocMouseUp = _onDocMouseUp;
  // 中键拖拽阻止默认滚动
  mapWrap.addEventListener('mousedown',e=>{ if(e.button===1) e.preventDefault(); });
});

const SAVE_SLOT_COUNT = 5;

// ── 存档序列化/反序列化 ──────────────────────────────
function _serializeG(){
  // 深拷贝G，处理Set→Array ★ v154fix M10: 排除已知运行时缓存字段减小存档体积
  const _CACHE_KEYS = new Set(['_corruptRate','_corruptLoss','_salaryDebt','_deployedGensCache','_deployedGensTurn']);
  const snap = JSON.parse(JSON.stringify(G, (key, val) => {
    if(val instanceof Set) return {__set:true, values:[...val]};
    if(_CACHE_KEYS.has(key)) return undefined;
    return val;
  }));
  // 保存额外全局状态
  snap.__meta = {
    version: 172,  // v172: 加入 stage/anchorState 序列化
    savedAt: new Date().toISOString(),
    _unitIdCounter: _unitIdCounter,
    _pendingPeaceOffer: _pendingPeaceOffer,
    _pendingVassalOffer: _pendingVassalOffer,
    tutorialDone: G.tutorialDone || false,
    // v172: FAC_IDENTITY 是模块级常量，其运行时字段（type/stage/anchorState）需单独存档
    facIdentity: Object.fromEntries(Object.entries(FAC_IDENTITY).map(([f, id]) => [f, {
      type: id.type,
      stage: id.stage,
      anchorState: id.anchorState,
    }])),
  };
  return JSON.stringify(snap);
}

function _deserializeG(jsonStr){
  const snap = JSON.parse(jsonStr, (key, val) => {
    if(val && typeof val === 'object' && val.__set) return new Set(val.values);
    return val;
  });
  const meta = snap.__meta || {};
  delete snap.__meta;
  // 恢复G的所有字段
  Object.keys(G).forEach(k => delete G[k]);
  Object.assign(G, snap);
  // 恢复全局变量
  if(meta._unitIdCounter) _unitIdCounter = meta._unitIdCounter;
  _pendingPeaceOffer = meta._pendingPeaceOffer || null;
  _pendingVassalOffer = meta._pendingVassalOffer || null;
  G.tutorialDone = meta.tutorialDone || false;
  // v172: 恢复 FAC_IDENTITY 运行时字段（type/stage/anchorState）
  // 旧存档（无 facIdentity 字段）兼容：保持 initGame 初始值
  if(meta.facIdentity){
    Object.entries(meta.facIdentity).forEach(([f, s]) => {
      if(FAC_IDENTITY[f]){
        if(s.type != null)        FAC_IDENTITY[f].type = s.type;
        if(s.stage != null)       FAC_IDENTITY[f].stage = s.stage;
        if(s.anchorState !== undefined) FAC_IDENTITY[f].anchorState = s.anchorState;
      }
    });
  }
  // v172: 兜底——确保所有势力都有 stage 字段（旧存档加载时 initGame 已设过，双保险）
  ALL_FACS.forEach(fid => {
    if(FAC_IDENTITY[fid] && !FAC_IDENTITY[fid].stage){
      FAC_IDENTITY[fid].stage = (fid === 'nanman') ? 'warlord' : 'regime';
      FAC_IDENTITY[fid].anchorState = null;
    }
  });
  // 恢复科技树Set（JSON.parse的reviver已处理，但双保险）
  ALL_FACS.forEach(fid => {
    const tech = G.factions[fid]?._tech;
    if(tech && tech.researched && !(tech.researched instanceof Set)){
      tech.researched = new Set(tech.researched);
    }
  });
  // 恢复_eventFired如果是对象
  if(G._eventFired && typeof G._eventFired !== 'object') G._eventFired = {};
  // ★ v135fix+v149fix: 确保_unitIdCounter大于所有现有unit.id，避免id冲突
  // unit.id格式为'uN'字符串，需解析数字部分
  if(G.units && G.units.length > 0){
    const maxId = G.units.reduce((mx, u) => {
      const n = typeof u.id === 'string' ? parseInt(u.id.replace(/\D/g, ''), 10) : (u.id || 0);
      return Number.isFinite(n) && n > mx ? n : mx;
    }, 0);
    if(_unitIdCounter <= maxId) _unitIdCounter = maxId + 1;
  }
  // ★ v149fix 中等2: 清理旬级缓存（科技/补给/出征武将），防止旧存档脏数据
  _techEffectCache = {}; _techEffectCacheTurn = -1;
  _supplyCache = {};
  // ★ v149fix 中等3: 清理残留战斗状态，防止幽灵战报
  _battleReports = [];
  _pendingBattleConfirms = [];
  _pendingSiegeArrival = null;
  _currentBattleReport = null;
  _currentBattleConfirm = null;
  // ★ v149fix 中等4: 重置行军动画锁，防止读档后卡死
  _marchAnimating = false;
  // ★ v150fix: 清理遗漏的模块级缓存（士气/领土overlay/叠加层/朝议/单挑/统计）
  _deployedGensMoraleCache = null;
  _ovTerritoryCache = null; _ovTerritoryTurn = -1;
  _activeOverlay = null;
  window._pendingCourtCouncil = null;
  _duelChallenger = null;
  _statsHistory.length = 0; // BUG 6: 清空统计图表数据
  // ★ v150fix A2+A3: 快进状态（offer已在meta恢复，不再重置）
  _fastForward = false;
  // ★ v167fix #6: 删除 _pendingPeaceOffer/_pendingVassalOffer = null（L29848已从meta恢复，此处重置会丢失读档时的求和/附庸请求）
  // ★ v151: 价值观系统旧存档兼容
  ALL_FACS.forEach(fid => {
    if(G.factions[fid] && !G.factions[fid].ethos){
      G.factions[fid].ethos = {...(ETHOS_INIT[fid] || {mandate:0,power:0,civil:0,military:0,strategy:0})};
      G.factions[fid]._ethosLog = [];
      G.factions[fid]._ethosSnap = {};
    }
  });
  // ★ v155fix P0: 重建GEN_MAP指向G.generals中的活跃对象（替代v154的Object.assign方案）
  _rebuildGEN_MAP();
  // ★ v161: 旧存档无counties → 调用initCityGentry初始化
  const _hasCounties = Object.values(G.cities).some(c => c.counties && c.counties.length > 0);
  if(!_hasCounties) initCityGentry();
  // ★ v170: 存档counties迁移（同步到最新COUNTY_DATA，保留已有loyalty/_initPop，补全新增县，同步clanFamily字段）
  Object.entries(G.cities).forEach(([cityId, city]) => {
    const template = COUNTY_DATA[cityId];
    if(!template || !city.counties) return;
    // 建立旧county按name索引
    const oldByName = {};
    city.counties.forEach(c => { oldByName[c.name] = c; });
    // 按模板重建，保留旧loyalty
    const newCounties = template.map(t => {
      const old = oldByName[t.name];
      if(old){
        // 存在：更新 type/clanFamily/popShare/magnate 为模板值（可能变化），保留 loyalty/_initPop
        return {
          name: t.name,
          type: t.type,
          clanFamily: t.clanFamily, // 支持从单值迁移到数组
          popShare: t.popShare,
          magnate: t.magnate === true, // ★ v171: 同步magnate字段（未标记则false）
          loyalty: old.loyalty ?? 50,
          _initPop: old._initPop || Math.floor(city.pop * t.popShare),
        };
      } else {
        // 新县（v170新增）：用城均loyalty初始化
        return {
          name: t.name,
          type: t.type,
          clanFamily: t.clanFamily,
          popShare: t.popShare,
          magnate: t.magnate === true, // ★ v171
          loyalty: city.gentry ?? 50,
          _initPop: Math.floor(city.pop * t.popShare),
        };
      }
    });
    // 归一化popShare（防模板和存档总和不一致）
    const tot = newCounties.reduce((s,c) => s + c.popShare, 0);
    if(Math.abs(tot-1) > 0.001) newCounties.forEach(c => c.popShare /= tot);
    city.counties = newCounties;
    city.gentry = _aggregateGentry(city);
  });
  // ★ v164: genRetainers旧存档兼容（纯数字→{count,type}）
  if(G.genRetainers){
    Object.keys(G.genRetainers).forEach(name => {
      const v = G.genRetainers[name];
      if(typeof v === 'number'){
        G.genRetainers[name] = { count: v, type: RETAINER_PRESET[name]?.type || null };
      }
    });
  }
  // ★ v164: 通商/通使旧存档兼容
  if(!G._tradeCD) G._tradeCD = {};
  if(!G._pendingEnvoyIntel) G._pendingEnvoyIntel = [];
  // ★ v165: 通商协定旧存档兼容
  if(!G._tradeAgreements) G._tradeAgreements = [];
  // ★ v166: 迁民系统旧存档兼容
  if(G._migratedThisTurn === undefined) G._migratedThisTurn = false;
  ALL_FACS.forEach(fid => {
    if(G.strategyCD && G.strategyCD[fid] && G.strategyCD[fid].envoy === undefined){
      G.strategyCD[fid].envoy = 0;
    }
  });
}

// ── 存储兼容层：优先window.storage(Artifact)，降级localStorage ──
const _store = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function'){
      try { const r = await window.storage.get(key); return r; } catch(e){ /* fall through */ }
    }
    // localStorage降级
    try {
      const v = localStorage.getItem('pr_' + key);
      if(v === null) return null;
      return {key, value:v};
    } catch(e){ return null; }
  },
  async set(key, value){
    if(window.storage && typeof window.storage.set === 'function'){
      try { const r = await window.storage.set(key, value); if(r) return r; } catch(e){ /* fall through */ }
    }
    try {
      localStorage.setItem('pr_' + key, value);
      return {key, value};
    } catch(e){ return null; }
  },
  async delete(key){
    if(window.storage && typeof window.storage.delete === 'function'){
      try { const r = await window.storage.delete(key); return r; } catch(e){ /* fall through */ }
    }
    try {
      localStorage.removeItem('pr_' + key);
      return {key, deleted:true};
    } catch(e){ return null; }
  },
};

async function _getSaveSlots(){
  const slots = [];
  for(let i = 1; i <= SAVE_SLOT_COUNT; i++){
    try {
      const result = await _store.get(SAVE_KEY_PREFIX + i);
      if(result && result.value){
        const data = JSON.parse(result.value);
        const meta = data.__meta || {};
        const facNames = {wei:'曹魏',shu:'蜀汉',wu:'东吴',nanman:'南蛮'};
        const yearStr = YEARS[data.year] || `第${(data.year||0)+1}年`;
        const seasonNames = ['春','夏','秋','冬'];
        const seasonStr = seasonNames[data.seasonIdx || 0] || '春';
        const cityCount = Object.values(data.cities||{}).filter(c => c.fac === data.playerFac).length;
        slots.push({
          idx: i,
          exists: true,
          fac: data.playerFac,
          facName: facNames[data.playerFac] || data.playerFac,
          turn: data.turn || 1,
          yearStr, seasonStr, cityCount,
          savedAt: meta.savedAt ? new Date(meta.savedAt).toLocaleString('zh-CN') : '未知时间',
        });
      } else {
        slots.push({idx:i, exists:false});
      }
    } catch(e){
      slots.push({idx:i, exists:false});
    }
  }
  return slots;
}

async function saveToSlot(slotIdx){
  // ★ v179fix P41: 存档保持只读快照契约——有未消化战报则拒绝存档
  // 战报队列内含 unit/squad 的经验/Merit/level 待发放（applyBattleExp 在 closeBattleModal 才执行）
  // 若强行存档会被 _deserializeG 强制清空，导致经验丢失
  if(_battleReports.length > 0 || _currentBattleReport || _pendingBattleConfirms.length > 0){
    showNotif('请先关闭所有战报窗口再存档', 'error');
    return false;
  }
  try {
    const data = _serializeG();
    const r = await _store.set(SAVE_KEY_PREFIX + slotIdx, data);
    return !!r;
  } catch(e){
    console.error('Save failed:', e);
    return false;
  }
}

async function loadFromSlot(slotIdx){
  try {
    const result = await _store.get(SAVE_KEY_PREFIX + slotIdx);
    if(!result || !result.value) return false;
    _deserializeG(result.value);
    return true;
  } catch(e){
    console.error('Load failed:', e);
    return false;
  }
}

async function deleteSlot(slotIdx){
  try {
    await _store.delete(SAVE_KEY_PREFIX + slotIdx);
    return true;
  } catch(e){ return false; }
}

/** v162: 显示Tab帮助弹窗 */
function showTabHelp(tabId){
  const data = TAB_HELP[tabId];
  if(!data) return;
  // 移除已有弹窗
  document.getElementById('tabHelpOverlay')?.remove();
  const ov = document.createElement('div');
  ov.id = 'tabHelpOverlay';
  ov.className = 'tab-help-overlay';
  ov.onclick = function(e){ if(e.target===ov) closeTabHelp(); };

  const secs = (data.sections||[]).map((sec,i) =>
    `<div class="thp-sec">
      <div class="thp-sec-btn" onclick="this.classList.toggle('open')"><span class="arr">▸</span> ${sec.label}</div>
      <div class="thp-sec-body">${sec.content}</div>
    </div>`
  ).join('');

  ov.innerHTML = `<div class="tab-help-card">
    <div class="tab-help-close" onclick="closeTabHelp()">✕ 关闭</div>
    <div class="tab-help-title">${data.title}</div>
    <div class="tab-help-intro">${data.intro}</div>
    ${secs}
  </div>`;
  document.body.appendChild(ov);
}

function closeTabHelp(){
  document.getElementById('tabHelpOverlay')?.remove();
}

/** v162: 返回帮助按钮HTML片段，供各tab标题内联使用 */
function _tabHelpHtml(tabId){
  if(!TAB_HELP[tabId]) return '';
  return `<button class="tab-help-btn" title="查看本页机制详解" onclick="event.stopPropagation();showTabHelp('${tabId}')">?</button>`;
}

let _tutPage = 0;
let _tutHighlighted = [];
const _TUT_SECTIONS = ['#leftPanel', '.map-wrap', '.rp', 'header'];

function showTutorial(){
  _tutPage = 0;
  document.getElementById('tutOverlay')?.remove();
  const ov = document.createElement('div');
  ov.id = 'tutOverlay';
  ov.className = 'tut-overlay';
  ov.innerHTML = '<div class="tut-dim" onclick="closeTutorial()"></div><div class="tut-card" id="tutCard"></div>';
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('show'));
  _renderTutPage();
}

function closeTutorial(){
  G.tutorialDone = true;
  _clearTutHighlight();
  // 清除所有section dim
  _TUT_SECTIONS.forEach(sel => {
    const el = document.querySelector(sel);
    if(el) el.classList.remove('tut-section-dim');
  });
  const ov = document.getElementById('tutOverlay');
  if(ov){ ov.classList.remove('show'); setTimeout(()=>ov.remove(), 400); }
}

function _clearTutHighlight(){
  _tutHighlighted.forEach(el => el.classList.remove('tut-highlight'));
  _tutHighlighted = [];
}

function _applyTutHighlight(page){
  _clearTutHighlight();
  // 切换tab如果需要
  if(page.highlightTab) switchTab(page.highlightTab);

  // 计算哪些section应该被dim（不在reveal列表中的）
  const revealed = page.reveal || [];
  _TUT_SECTIONS.forEach(sel => {
    const el = document.querySelector(sel);
    if(!el) return;
    if(revealed.includes(sel)){
      el.classList.remove('tut-section-dim');
    } else {
      el.classList.add('tut-section-dim');
    }
  });

  // 高亮主目标
  if(page.highlight){
    const el = document.querySelector(page.highlight);
    if(el){ el.classList.add('tut-highlight'); _tutHighlighted.push(el); }
  }
  // 高亮额外目标
  if(page.highlightExtra){
    const el2 = document.querySelector(page.highlightExtra);
    if(el2){ el2.classList.add('tut-highlight'); _tutHighlighted.push(el2); }
  }
}

function _renderTutPage(){
  const card = document.getElementById('tutCard');
  if(!card) return;
  const page = TUT_PAGES[_tutPage];
  if(!page) return;

  // 定位卡片
  _positionTutCard(page);
  // 高亮
  _applyTutHighlight(page);

  // 构建详情展开块
  let detailsHtml = '';
  if(page.details){
    page.details.forEach((d,i) => {
      detailsHtml += `<div class="tut-detail">
        <div class="tut-detail-btn" onclick="this.classList.toggle('open')">
          <span class="arrow">▸</span> ${d.label}
        </div>
        <div class="tut-detail-content">${d.content}</div>
      </div>`;
    });
  }

  // 导航
  const dots = TUT_PAGES.map((_,i) =>
    `<div class="tut-dot${i===_tutPage?' active':''}" onclick="_tutPage=${i};_renderTutPage()"></div>`
  ).join('');

  const prevBtn = _tutPage > 0
    ? `<div class="tut-nav-btn" onclick="_tutPage--;_renderTutPage()">◂ 上一页</div>`
    : `<div style="width:80px"></div>`;

  const nextBtn = page.isFinal
    ? `<div class="tut-nav-btn primary" onclick="closeTutorial()">开始征程 ▸</div>`
    : `<div class="tut-nav-btn" onclick="_tutPage++;_renderTutPage()">下一页 ▸</div>`;

  card.innerHTML = `
    <div class="tut-skip" onclick="closeTutorial()">✕ 跳过</div>
    <div class="tut-card-title">${page.title}</div>
    <div class="tut-card-body">
      ${page.body}
      ${detailsHtml}
    </div>
    <div class="tut-nav">
      ${prevBtn}
      <div class="tut-dots">${dots}</div>
      ${nextBtn}
    </div>`;
}

function _positionTutCard(page){
  const card = document.getElementById('tutCard');
  if(!card) return;
  // 重置定位
  card.style.top = ''; card.style.bottom = ''; card.style.left = ''; card.style.right = '';
  card.style.transform = '';

  if(page.pos === 'center' || !page.highlight){
    card.style.top = '50%'; card.style.left = '50%';
    card.style.transform = 'translate(-50%,-50%)';
  } else if(page.pos === 'left'){
    // 高亮右侧 → 卡片放左边
    card.style.top = '70px'; card.style.left = '16px';
  } else if(page.pos === 'right'){
    // 高亮左侧 → 卡片放右边
    card.style.top = '70px'; card.style.right = '16px';
  }
}

// mode: 'save' | 'load' | 'load-title' (从主菜单读档)
let _saveLoadMode = 'save';
let _saveLoadSelSlot = -1;

function showSaveLoadPanel(mode){
  _saveLoadMode = mode || 'save';
  _saveLoadSelSlot = -1;
  document.getElementById('saveOverlay')?.remove();

  const ov = document.createElement('div');
  ov.id = 'saveOverlay';
  ov.className = 'save-overlay';
  ov.onclick = e => { if(e.target === ov) closeSaveLoadPanel(); };

  const isSave = _saveLoadMode === 'save';
  const title = isSave ? '存 档' : '讀 取 存 檔';

  ov.innerHTML = `
    <div class="save-panel">
      <div class="sp-title">${title}</div>
      <div id="saveSlotList" style="min-height:200px;display:flex;align-items:center;justify-content:center">
        <div style="color:var(--ink-ll);font-size:10px">加载存档信息...</div>
      </div>
      <div class="sp-actions">
        ${isSave ? `
          <button id="spBtnDelete" onclick="_onSlotDelete()" class="danger" disabled>删除存档</button>
          <button id="spBtnAction" onclick="_onSlotSave()" disabled>保存至此槽位</button>
        ` : `
          <button id="spBtnDelete" onclick="_onSlotDelete()" class="danger" disabled>删除存档</button>
          <button id="spBtnAction" onclick="_onSlotLoad()" disabled>读取存档</button>
        `}
        <button onclick="closeSaveLoadPanel()">关闭</button>
      </div>
    </div>
  `;
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('show'));

  _refreshSlotList();
}

async function _refreshSlotList(){
  const list = document.getElementById('saveSlotList');
  if(!list) return;

  let slots;
  try {
    slots = await _getSaveSlots();
  } catch(e){
    list.innerHTML = '<div style="color:#c03030;font-size:10px">存储系统不可用</div>';
    return;
  }

  const facColors = {wei:'#1a5f8a',shu:'#1a7a3a',wu:'#a82a1a',nanman:'#8b6914'};
  list.innerHTML = slots.map(s => {
    if(s.exists){
      const col = facColors[s.fac] || 'var(--ink)';
      return `<div class="save-slot" data-slot="${s.idx}" onclick="_selectSlot(${s.idx})">
        <div class="slot-num">${s.idx}</div>
        <div class="slot-info">
          <div class="slot-fac" style="color:${col}">${s.facName}</div>
          <div class="slot-detail">${s.yearStr} · ${s.seasonStr} · 第${s.turn}旬 · ${s.cityCount}城</div>
        </div>
        <div class="slot-time">${s.savedAt}</div>
      </div>`;
    } else {
      return `<div class="save-slot" data-slot="${s.idx}" onclick="_selectSlot(${s.idx})">
        <div class="slot-num">${s.idx}</div>
        <div class="slot-info"><div class="slot-empty">— 空 —</div></div>
      </div>`;
    }
  }).join('');
  _saveLoadSelSlot = -1;
  _updateSlotButtons();
}

function _selectSlot(idx){
  _saveLoadSelSlot = idx;
  document.querySelectorAll('.save-slot').forEach(el => {
    el.classList.toggle('sel', parseInt(el.dataset.slot) === idx);
  });
  _updateSlotButtons();
}

function _updateSlotButtons(){
  const actionBtn = document.getElementById('spBtnAction');
  const deleteBtn = document.getElementById('spBtnDelete');
  if(!actionBtn) return;

  const isSave = _saveLoadMode === 'save';
  const hasSlot = _saveLoadSelSlot > 0;

  if(isSave){
    actionBtn.disabled = !hasSlot;
  } else {
    // load模式：只有有存档的槽位才能读取
    const slotEl = document.querySelector(`.save-slot[data-slot="${_saveLoadSelSlot}"] .slot-fac`);
    actionBtn.disabled = !hasSlot || !slotEl;
  }
  // 删除按钮：只有有存档的槽位才能删除
  const slotHasData = document.querySelector(`.save-slot[data-slot="${_saveLoadSelSlot}"] .slot-fac`);
  if(deleteBtn) deleteBtn.disabled = !hasSlot || !slotHasData;
}

async function _onSlotSave(){
  if(_saveLoadSelSlot < 1) return;
  // 检查是否有存档，有则确认覆盖
  const slotHasData = document.querySelector(`.save-slot[data-slot="${_saveLoadSelSlot}"] .slot-fac`);
  if(slotHasData && !confirm(`槽位 ${_saveLoadSelSlot} 已有存档，确定覆盖？`)) return;

  const ok = await saveToSlot(_saveLoadSelSlot);
  if(ok){
    showNotif('存档成功', 'success');
    await _refreshSlotList();
    // 重新高亮
    _selectSlot(_saveLoadSelSlot);
  } else {
    showNotif('存档失败', 'error');
  }
}

async function _onSlotLoad(){
  if(_saveLoadSelSlot < 1) return;
  const slotHasData = document.querySelector(`.save-slot[data-slot="${_saveLoadSelSlot}"] .slot-fac`);
  if(!slotHasData){ showNotif('该槽位无存档', 'error'); return; }

  if(!confirm(`确定读取槽位 ${_saveLoadSelSlot} 的存档？当前未保存的进度将丢失。`)) return;

  const ok = await loadFromSlot(_saveLoadSelSlot);
  if(ok){
    closeSaveLoadPanel();
    // 从主菜单读档时需要移除标题画面
    document.getElementById('titleScreen')?.remove();
    document.getElementById('scenarioScreen')?.remove();
    document.getElementById('factionSelectOverlay')?.remove();
    // ★ v135fix: 确保地形数据已构建（从主菜单直接读档时未经initGame）
    if(!HEX_TERRAIN || Object.keys(HEX_TERRAIN).length === 0) buildHexTerrain();
    if(!HEX_CITY || Object.keys(HEX_CITY).length === 0) buildHexTerrain();
    ensureCityNeighbors();
    // 重建游戏界面
    const mr = document.getElementById('mapRoot');
    if(mr) mr.remove();
    _staticMapCache = ''; // 强制重建地图底层缓存
    invalidateCityCache();
    invalidateFogCache();
    _ovTerritoryCache = null; // 清理overlay缓存
    _ovBaseCache = null;
    renderAll();
    showNotif('读档成功', 'success');
  } else {
    showNotif('读档失败', 'error');
  }
}

async function _onSlotDelete(){
  if(_saveLoadSelSlot < 1) return;
  if(!confirm(`确定删除槽位 ${_saveLoadSelSlot} 的存档？此操作不可恢复。`)) return;
  const ok = await deleteSlot(_saveLoadSelSlot);
  if(ok){
    showNotif('已删除', 'success');
    await _refreshSlotList();
  }
}

function closeSaveLoadPanel(){
  const ov = document.getElementById('saveOverlay');
  if(ov){
    ov.classList.remove('show');
    setTimeout(() => ov.remove(), 200);
  }
}

// ═══════════════════════════════════════════════════════
// ★ v119: 完整性审计 — 压力测试后批量断言检查
// ═══════════════════════════════════════════════════════

function runIntegrityAudit(){
  const errors = [];
  const warn = (group, msg) => errors.push({group, msg});
  const VALID_FACS = new Set([...ALL_FACS, 'rebel']);
  const VALID_STATUS = new Set(['garrison','march','halt','camp','ambush','siege']);

  // ── 1. 资源合法性 ──
  ALL_FACS.forEach(fid => {
    const res = G.factions[fid]?.res;
    if(!res){ warn('资源','`G.factions['+fid+'].res` 不存在'); return; }
    ['gold','wood','iron','horses'].forEach(k => {
      const v = res[k];
      if(v === undefined || v === null) warn('资源', `${fid}.res.${k} = undefined/null`);
      else if(Number.isNaN(v)) warn('资源', `${fid}.res.${k} = NaN`);
      else if(v < 0) warn('资源', `${fid}.res.${k} = ${v} (负数)`);
    });
  });
  Object.entries(G.cities).forEach(([cid, city]) => {
    ['pop','garrison','morale'].forEach(k => {
      const v = city[k];
      if(v === undefined || v === null) warn('资源', `city[${cid}].${k} = undefined/null`);
      else if(Number.isNaN(v)) warn('资源', `city[${cid}].${k} = NaN`);
      else if(v < 0) warn('资源', `city[${cid}].${k} = ${v} (负数)`);
    });
    if(city.pop !== undefined && city.pop > 0 && city.popQuality !== undefined){
      if(Number.isNaN(city.popQuality)) warn('资源', `city[${cid}].popQuality = NaN`);
    }
  });

  // ── 2. 兵力 NaN/负数 ──
  G.units.forEach(u => {
    const total = getUnitTroops(u);
    if(Number.isNaN(total)) warn('兵力', `unit[${u.id}] getUnitTroops=NaN`);
    else if(total < 50) warn('兵力', `unit[${u.id}] getUnitTroops=${total} (应已被清除, <50)`);
    (u.squads||[]).forEach((sq, i) => {
      if(Number.isNaN(sq.troops)) warn('兵力', `unit[${u.id}] squad[${i}] troops=NaN (gen=${sq.genName})`);
      else if(sq.troops < 0) warn('兵力', `unit[${u.id}] squad[${i}] troops=${sq.troops} (负数, gen=${sq.genName})`);
    });
  });
  Object.entries(G.cities).forEach(([cid, city]) => {
    if(Number.isNaN(city.garrison)) warn('兵力', `city[${cid}].garrison = NaN`);
    else if(city.garrison < 0) warn('兵力', `city[${cid}].garrison = ${city.garrison} (负数)`);
  });

  // ── 3. loyaltyAccum 同步 ──
  if(G.genLoyalty && G.loyaltyAccum){
    // 只检查当前在某势力中的武将（在野/下野武将不需要loyaltyAccum）
    const activeFacGens = new Set();
    ALL_FACS.forEach(fid => {
      (G.generals[fid]||[]).forEach(g => activeFacGens.add(g.name));
    });
    Object.keys(G.genLoyalty).forEach(name => {
      if(!activeFacGens.has(name)) return; // 在野/下野武将跳过
      const loy = G.genLoyalty[name];
      const acc = G.loyaltyAccum[name];
      if(loy === undefined || Number.isNaN(loy)) warn('忠诚同步', `genLoyalty[${name}] = ${loy}`);
      if(acc === undefined) warn('忠诚同步', `loyaltyAccum[${name}] 不存在 (genLoyalty=${loy})`);
      else if(Number.isNaN(acc)) warn('忠诚同步', `loyaltyAccum[${name}] = NaN`);
      else if(Math.abs(loy - acc) > 1.5) warn('忠诚同步', `${name}: genLoyalty=${loy}, loyaltyAccum=${acc.toFixed(2)}, 差=${Math.abs(loy-acc).toFixed(2)}`);
    });
  }

  // ── 4. 城市 fac 合法性 + prefect 一致性 ──
  Object.entries(G.cities).forEach(([cid, city]) => {
    if(!VALID_FACS.has(city.fac)) warn('城市fac', `city[${cid}].fac = '${city.fac}' (非法)`);
    if(city.prefect){
      if(city.fac === 'rebel') return; // 叛军无武将系统
      const gens = G.generals[city.fac] || [];
      if(!gens.some(g => g.name === city.prefect)){
        warn('城市fac', `city[${cid}] prefect='${city.prefect}' 不在 G.generals[${city.fac}] 中`);
      }
    }
  });

  // ── 5. 死武将残留 ──
  const allAliveGens = new Set();
  ALL_FACS.forEach(fid => {
    (G.generals[fid]||[]).forEach(g => allAliveGens.add(g.name));
  });
  // 5a: 部队squads中的武将
  G.units.forEach(u => {
    if(u.fac === 'rebel') return; // 叛军genName可能不在标准池
    (u.squads||[]).forEach((sq, i) => {
      if(sq.genName && !allAliveGens.has(sq.genName)){
        warn('死将残留', `unit[${u.id}] squad[${i}] genName='${sq.genName}' 不在任何势力武将列表中`);
      }
    });
  });
  // 5b: 城市prefect
  Object.entries(G.cities).forEach(([cid, city]) => {
    if(city.prefect && city.fac !== 'rebel' && !allAliveGens.has(city.prefect)){
      warn('死将残留', `city[${cid}] prefect='${city.prefect}' 不在活武将池`);
    }
  });
  // 5c: 军师
  ALL_FACS.forEach(fid => {
    const strat = G.factions[fid]?.strategist;
    if(strat && !allAliveGens.has(strat)){
      warn('死将残留', `${fid} strategist='${strat}' 不在活武将池`);
    }
  });
  // 5d: 官职表
  if(G.genPost){
    Object.keys(G.genPost).forEach(name => {
      if(G.genPost[name] && !allAliveGens.has(name)){
        warn('死将残留', `genPost['${name}']='${G.genPost[name]}' 但武将不在活武将池`);
      }
    });
  }

  // ── 6. 部队结构 ──
  G.units.forEach(u => {
    if(!u.squads || u.squads.length === 0) warn('部队结构', `unit[${u.id}] squads为空`);
    if(!VALID_FACS.has(u.fac)) warn('部队结构', `unit[${u.id}].fac='${u.fac}' (非法)`);
    if(!VALID_STATUS.has(u.status)) warn('部队结构', `unit[${u.id}].status='${u.status}' (非法)`);
    if(u.hq === undefined || u.hr === undefined) warn('部队结构', `unit[${u.id}] hq/hr 未定义`);
    else if(Number.isNaN(u.hq) || Number.isNaN(u.hr)) warn('部队结构', `unit[${u.id}] hq=${u.hq} hr=${u.hr} NaN`);
  });

  // ── 6b. 属县完整性 (v161) ──
  Object.entries(G.cities).forEach(([cid, city]) => {
    if(!city.counties || !city.counties.length) return;
    const psSum = city.counties.reduce((s,c) => s + c.popShare, 0);
    if(psSum < 0.99 || psSum > 1.01) warn('属县', `city[${cid}] popShare之和=${psSum.toFixed(4)} (应≈1.0)`);
    city.counties.forEach((c,i) => {
      if(c.loyalty === undefined || Number.isNaN(c.loyalty)) warn('属县', `city[${cid}] county[${i}].loyalty=${c.loyalty}`);
      if(c.type === 'clan_base' && !c.clanFamily) warn('属县', `city[${cid}] county[${i}] clan_base无clanFamily`);
    });
  });

  // ── 7. 结构完整性 ──
  // 7a: 重复unit.id
  const uidSet = new Set();
  G.units.forEach(u => {
    if(uidSet.has(u.id)) warn('结构', `重复 unit.id='${u.id}'`);
    uidSet.add(u.id);
  });
  // 7b: 同一武将分身（出现在多支部队squads中）
  const genInUnit = new Map(); // genName -> unitId
  G.units.forEach(u => {
    (u.squads||[]).forEach(sq => {
      if(!sq.genName) return;
      if(genInUnit.has(sq.genName)){
        warn('结构', `武将'${sq.genName}' 同时出现在 unit[${genInUnit.get(sq.genName)}] 和 unit[${u.id}]`);
      } else {
        genInUnit.set(sq.genName, u.id);
      }
    });
  });
  // 7c: genLoyalty中的幽灵武将（不存在于任何势力）
  if(G.genLoyalty){
    Object.keys(G.genLoyalty).forEach(name => {
      if(!allAliveGens.has(name)){
        // 检查是否在在野系统中（不算错误）
        const inWildPool = (G.wildPool||[]).includes(name);
        const inWildGens = typeof WILD_GENS !== 'undefined' && WILD_GENS.some(w => w.name === name);
        if(!inWildPool && !inWildGens) warn('结构', `genLoyalty['${name}'] 存在但武将不在任何势力/在野池/WILD_GENS`);
      }
    });
  }
  // 7d: 城市总数
  const cityCount = Object.keys(G.cities).length;
  if(cityCount !== 45) warn('结构', `城市数=${cityCount} (预期45)`);
  // 7e: 武将同时是太守+部署在外（允许，但检查太守城fac匹配）
  Object.entries(G.cities).forEach(([cid, city]) => {
    if(city.prefect && city.fac !== 'rebel'){
      // 太守势力应与城市势力一致
      const inFac = (G.generals[city.fac]||[]).some(g => g.name === city.prefect);
      if(!inFac){
        // 可能武将已转投他方
        let foundFac = null;
        ALL_FACS.forEach(f => {
          if((G.generals[f]||[]).some(g => g.name === city.prefect)) foundFac = f;
        });
        if(foundFac) warn('结构', `city[${cid}] fac=${city.fac} prefect='${city.prefect}' 实际属于${foundFac}`);
      }
    }
  });

  // ★ v151: 价值观系统审计
  ALL_FACS.forEach(fid => {
    const eth = G.factions[fid]?.ethos;
    if(!eth) { warn('价值观', `${fid} missing ethos object`); return; }
    ETHOS_DIMS.forEach(d => {
      if(typeof eth[d] !== 'number' || eth[d] < -100 || eth[d] > 100)
        warn('价值观', `${fid}.ethos.${d} = ${eth[d]} (expect -100~100)`);
    });
  });

  // ── 汇总输出 ──
  const groups = {};
  errors.forEach(e => {
    if(!groups[e.group]) groups[e.group] = [];
    groups[e.group].push(e.msg);
  });
  const allGroups = ['资源','兵力','忠诚同步','城市fac','死将残留','部队结构','结构','价值观'];
  let report = `\n${'═'.repeat(50)}\n  完整性审计 (第${G.turn}旬)\n${'═'.repeat(50)}\n`;
  let passCount = 0;
  allGroups.forEach(g => {
    const errs = groups[g];
    if(!errs || errs.length === 0){
      report += `  ✅ ${g}: 通过\n`;
      passCount++;
    } else {
      report += `  ❌ ${g}: ${errs.length}个异常\n`;
      errs.forEach(m => { report += `     · ${m}\n`; });
    }
  });
  report += `${'─'.repeat(50)}\n  总计: ${passCount}/${allGroups.length} 通过`;
  if(errors.length > 0) report += `, ${errors.length}个异常`;
  report += `\n${'═'.repeat(50)}`;

  console.log(report);

  // 弹窗摘要
  const summary = errors.length === 0
    ? `✅ 完整性审计通过（第${G.turn}旬）\n8/8 检查组全部通过`
    : `⚠️ 完整性审计（第${G.turn}旬）\n${passCount}/${allGroups.length} 通过，${errors.length}个异常\n\n` +
      allGroups.filter(g => groups[g]?.length).map(g => `❌ ${g}: ${groups[g].length}个`).join('\n') +
      '\n\n详情请查看浏览器控制台 (F12)';
  alert(summary);

  // 同时写入游戏日志
  if(errors.length === 0){
    log(`🔍 审计通过 (第${G.turn}旬): 8/8组全部合格`, 'economy');
  } else {
    log(`⚠️ 审计发现${errors.length}个异常 (第${G.turn}旬): ${allGroups.filter(g=>groups[g]?.length).join('/')}`, 'battle');
  }

  return {pass: errors.length === 0, errors, report};
}

// ═══════════════════════════════════════════════════════
// ★ v119: 势力淘汰 + 胜利/失败判定
// ═══════════════════════════════════════════════════════

function checkElimination(){
  ALL_FACS.forEach(fid => {
    if(G.factions[fid]?._eliminated) return; // 已淘汰
    const cities = Object.values(G.cities).filter(c => c.fac === fid);
    const units = G.units.filter(u => u.fac === fid && getUnitTroops(u) > 0);
    if(cities.length === 0 && units.length === 0){
      // ── 淘汰该势力 ──
      G.factions[fid]._eliminated = true;
      G.factions[fid]._eliminatedTurn = G.turn;

      // 武将全部流入在野池
      const gens = G.generals[fid] || [];
      gens.forEach(g => {
        if(g.role === 'ruler') return; // 君主不入在野池
        clearPrefectByGen(g.name);
        clearAllPostsByGen(g.name);
        if(!WILD_GENS.find(x => x.name === g.name)){
          WILD_GENS.push({...g, defectedFrom: fid, defectedTurn: G.turn, minTurn: G.turn});
        }
        if(!G.wildPool.includes(g.name) && G.wildPool.length < 8) G.wildPool.push(g.name);
      });
      G.generals[fid] = gens.filter(g => g.role === 'ruler'); // 只保留君主（历史记录用）

      // 清除军师
      if(G.factions[fid]) G.factions[fid].strategist = null;

      // 清除外交关系中的该势力（停战/结盟失效）
      // ★ v167fix #32: 用split精确匹配，避免fid为子串时误匹配（如'wu'匹配'wuxing'）
      Object.keys(G.diplo).forEach(key => {
        const [a,b] = key.split('-');
        if(a === fid || b === fid){
          G.diplo[key].status = 'neutral';
        }
      });

      const facName = FAC[fid]?.full || fid;
      log(`💀 ${facName}已覆灭！城池尽失，兵马殆尽。`, 'event');

      if(fid === G.playerFac){
        // 玩家被淘汰
        if(!_fastForward) setTimeout(() => showGameEndOverlay(false), 800);
      } else {
        if(!_fastForward) showNotif(`${facName}已覆灭！`, 'success');
      }
    }
  });

  // ── 胜利判定：只剩一家未淘汰 ──
  const alive = ALL_FACS.filter(f => !G.factions[f]?._eliminated);
  if(alive.length === 1){
    const winner = alive[0];
    if(!G._victoryShown){
      G._victoryShown = true;
      if(winner === G.playerFac){
        if(!_fastForward) setTimeout(() => showGameEndOverlay(true), 1200);
        else log(`🏆 天下一统！${FAC[winner]?.full}称霸四海！`, 'event');
      } else {
        if(!_fastForward) setTimeout(() => showGameEndOverlay(false, winner), 1200);
        else log(`💀 ${FAC[winner]?.full}统一天下，你的势力已成历史尘埃。`, 'event');
      }
    }
  }
}

/** 胜利/失败全屏遮罩 */
function showGameEndOverlay(isVictory, winnerFid){
  const fid = isVictory ? G.playerFac : (winnerFid || G.playerFac);
  const facColor = FAC[fid]?.color || '#2c2416';
  const facName = FAC[fid]?.full || '?';
  const playerFacName = FAC[G.playerFac]?.full || '?';

  // 统计数据
  const turnCount = G.turn;
  const yearStr = YEARS[G.year] || `第${G.year+1}年`;
  const seasonStr = SEASONS[G.seasonIdx] || '';
  const playerCities = Object.values(G.cities).filter(c => c.fac === G.playerFac).length;
  const playerTroops = G.factions[G.playerFac]?.totalTroops || 0;
  const playerPop = G.factions[G.playerFac]?.totalPop || 0;
  const playerGens = (G.generals[G.playerFac] || []).length;

  // 淘汰记录
  const elimRecords = ALL_FACS
    .filter(f => f !== (isVictory ? G.playerFac : winnerFid) && G.factions[f]?._eliminatedTurn)
    .map(f => `${FAC[f]?.name||f} 覆灭于第${G.factions[f]._eliminatedTurn}旬`)
    .join('　·　');

  const overlay = document.createElement('div');
  overlay.id = 'gameEndOverlay';
  overlay.style.cssText = `position:fixed;inset:0;z-index:9999;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0);transition:background 1.5s ease;
    font-family:'Noto Serif SC',serif;`;

  const mainTitle = isVictory ? '天下一统' : '大势已去';
  const subTitle = isVictory
    ? `${playerFacName}扫平四海，一统山河`
    : (winnerFid ? `${facName}横扫天下，${playerFacName}已成旧梦` : `${playerFacName}城池尽失，兵马殆尽`);

  const sealChar = isVictory ? '统' : '亡';

// Claude AI 决策与派发层 (C+D+E+F+G+H+I+J+K) 已抽离到 src/core/claude_ai.js (Session 3.3 / 选项 A)

// ── 辅助：名称→城市ID / 名称→势力ID ──
function _resolveCityId(name) {
  if (G.cities[name]) return name;
  const entry = Object.values(G.cities).find(c => c.name === name);
  return entry ? entry.id : null;
}
function _resolveFacId(name) {
  if (G.factions[name]) return name;
  const entry = Object.entries(FAC).find(([k, v]) => v.name === name || v.full === name);
  return entry ? entry[0] : null;
}
function _findUnit(fid, leaderName) {
  return G.units.find(u => u.fac === fid && u.squads.some(sq => sq.genName === leaderName));
}
function _genInFac(genName, fid) {
  return (G.generals[fid] || []).some(g => g.name === genName);
}
function _genDeployed(genName, fid) {
  return G.units.filter(u => u.fac === fid).some(u => u.squads.some(sq => sq.genName === genName));
}

// ════════════════════════════
// 内政指令执行
// ════════════════════════════

function _execBuild(fid, act) {
  const cityId = _resolveCityId(act.city);
  const city = G.cities[cityId];
  if (!city || city.fac !== fid) { console.warn('[ClaudeAI] build: 城市无效或非己方', act.city); return false; }
  const bldId = act.building;
  const bld = BLDS[bldId];
  if (!bld) { console.warn('[ClaudeAI] build: 建筑ID无效', bldId); return false; }
  const curLv = (city.buildings || {})[bldId] || 0;
  if (curLv >= 3) { console.warn('[ClaudeAI] build: 已满级', cityId, bldId); return false; }
  if ((city.buildQueue || []).find(q => q.id === bldId)) { console.warn('[ClaudeAI] build: 已在队列中', cityId, bldId); return false; }
  if (bld.restrict?.length && !bld.restrict.some(req => (city.tags || []).includes(req))) { console.warn('[ClaudeAI] build: 城市类型不符', cityId, bldId, 'need:', bld.restrict, 'has:', city.tags); return false; }
  const qCap = city.pop >= 500000 ? 4 : city.pop >= 250000 ? 3 : city.pop >= 100000 ? 2 : 1;
  if ((city.buildQueue || []).length >= qCap) { console.warn('[ClaudeAI] build: 队列满', cityId, `${(city.buildQueue||[]).length}/${qCap}`); return false; }
  const ts = getCityStats(city.tags || []);
  const usedSlots = Object.keys(city.buildings || {}).length;
  if (!city.buildings?.[bldId] && usedSlots >= ts.slots) { console.warn('[ClaudeAI] build: 槽位满', cityId, `${usedSlots}/${ts.slots}`); return false; }
  const lvDef = bld.levels?.[curLv];
  if (!lvDef) { console.warn('[ClaudeAI] build: 等级定义不存在', bldId, 'lv', curLv); return false; }
  const fac = G.factions[fid];
  const _milBldDiscount = (bld.cat === 'mil') ? (getCourtDecreeBuffs(fid).milBuildCost || 0) : 0;
  for (const [res, amt] of Object.entries(lvDef.c)) {
    const adj = (res === 'gold' && _milBldDiscount) ? Math.max(100, Math.floor(amt * (1 + _milBldDiscount))) : amt;
    if ((fac.res[res] || 0) < adj) { console.warn('[ClaudeAI] build: 资源不足', cityId, bldId, res, `${Math.round(fac.res[res]||0)}<${adj}`); return false; }
  }
  for (const [res, amt] of Object.entries(lvDef.c)) {
    const adj = (res === 'gold' && _milBldDiscount) ? Math.max(100, Math.floor(amt * (1 + _milBldDiscount))) : amt;
    fac.res[res] -= adj;
  }
  city.buildQueue.push({ id: bldId, targetLevel: curLv + 1, turnsLeft: lvDef.t, totalTurns: lvDef.t });
  log(`🏗 [AI] ${city.name}开始建设${bld.name}Lv${curLv + 1}（${lvDef.t}旬）`, 'economy');
  return true;
}

function _execSetTax(fid, act) {
  const taxId = act.level;
  if (!TAX.find(t => t.id === taxId)) { console.warn('[ClaudeAI] set_tax: 无效税率ID', taxId, '| 合法值:', TAX.map(t=>t.id).join('/')); return false; }
  G.factions[fid].taxId = taxId;
  log(`📋 [AI] ${FAC[fid]?.name}赋税调整为「${TAX.find(t => t.id === taxId).name}」`, 'economy');
  return true;
}

// D-076 fix: 补 _execSetCorvee (Claude AI 缺此 _exec 导致 AI 永远徭役=low)
function _execSetCorvee(fid, act) {
  const corveeId = act.level;
  if (!CORVEE.find(c => c.id === corveeId)) { console.warn('[ClaudeAI] set_corvee: 无效徭役ID', corveeId, '| 合法值:', CORVEE.map(c=>c.id).join('/')); return false; }
  G.factions[fid].corveeId = corveeId;
  log(`📋 [AI] ${FAC[fid]?.name}徭役调整为「${CORVEE.find(c => c.id === corveeId).name}」`, 'economy');
  return true;
}

function _execSetPrefect(fid, act) {
  const cityId = _resolveCityId(act.city);
  const city = G.cities[cityId];
  if (!city || city.fac !== fid) return false;
  const genName = act.general || null;
  if (genName && !_genInFac(genName, fid)) return false;
  if (genName && _genDeployed(genName, fid)) return false;
  setPrefect(cityId, genName);
  return true;
}

function _execTransferFood(fid, act) {
  const fromId = _resolveCityId(act.from);
  const toId = _resolveCityId(act.to);
  const from = G.cities[fromId], to = G.cities[toId];
  if (!from || !to || from.fac !== fid || to.fac !== fid) return false;
  // ★ v159fix: prompt不含amount字段，智能默认——调出源城一半存粮（上限10000，下限500）
  const maxTransfer = Math.floor((from.storage || 0) * 0.5);
  const amount = Math.min(act.amount || maxTransfer, from.storage || 0, 10000);
  if (amount < 500) return false; // 太少不值得调
  from.storage -= amount;
  to.storage = (to.storage || 0) + amount;
  log(`🚚 [AI] ${from.name}→${to.name} 调粮${fmt(amount)}`, 'economy');
  return true;
}

function _execToggleResupply(fid, act) {
  // AI势力的resupply开关（各势力独立）
  if (!G._facResupply) G._facResupply = {};
  G._facResupply[fid] = !G._facResupply[fid];
  return true;
}

function _execCancelSupply(fid, act) {
  // ★ v159fix: 无独立补给线取消机制，返回false避免误导Claude认为指令成功

}

function _execAppointPost(fid, act) {
  const genName = act.general;
  const postName = act.post;
  if (!genName || !postName) { console.warn('[ClaudeAI] appoint: 缺general或post', act); return false; }
  if (!_genInFac(genName, fid)) { console.warn('[ClaudeAI] appoint: 武将不在势力', genName); return false; }
  const gen = (G.generals[fid] || []).find(g => g.name === genName);
  if (!gen || gen.role === 'ruler') { console.warn('[ClaudeAI] appoint: 武将不存在或是君主', genName); return false; }
  const postDef = ALL_POSTS.find(p => p.name === postName);
  if (!postDef) { console.warn('[ClaudeAI] appoint: 官职不存在', postName); return false; }
  if ((G.genMerit[genName] || 0) < postDef.merit) { console.warn('[ClaudeAI] appoint: 功绩不足', genName, G.genMerit[genName] || 0, '<', postDef.merit); return false; }
  if (G.genPost && G.genPost[genName]) { console.warn('[ClaudeAI] appoint: 已有官职', genName, G.genPost[genName]); return false; }
  if (Object.values(G.cities).some(c => c.fac === fid && c.prefect === genName)) { console.warn('[ClaudeAI] appoint: 是太守', genName); return false; }
  // ★ v158: 检查该官职名额是否已满
  // ★ v181: 改走 getPostSlots（自动应用 stage cap tier1），不再直读 POST_TIERS
  const allSlots = getPostSlots(fid);
  const track = postDef.track; // 'mil' or 'civ'
  const postTier = postDef.tier; // 1,2,3
  const slots = track === 'mil' ? allSlots.mil : allSlots.civ;
  const maxSlots = slots[3 - postTier] || 0; // tier1=index2, tier2=index1, tier3=index0
  const currentHolders = Object.entries(G.genPost || {}).filter(([gn, pn]) => {
    const pd = ALL_POSTS.find(p => p.name === pn);
    return pd && pd.track === track && pd.tier === postTier && _genInFac(gn, fid);
  }).length;
  if (currentHolders >= maxSlots) { console.warn('[ClaudeAI] appoint: 名额已满', postName, `${currentHolders}/${maxSlots}`); return false; }
  appointGenPost(genName, postName, fid);
  return true;
}

function _execDismissPost(fid, act) {
  const genName = act.general;
  if (!genName || !G.genPost?.[genName]) return false;
  dismissGenPost(genName, fid);
  return true;
}

function _execSetStrategist(fid, act) {
  const genName = act.general || null;
  if (genName && !_genInFac(genName, fid)) return false;
  if (genName) {
    const gen = (G.generals[fid] || []).find(g => g.name === genName);
    if (!gen || gen.role === 'ruler') return false;
  }
  setStrategist(fid, genName);
  return true;
}

function _execRecruitWild(fid, act) {
  const genName = act.general;
  if (!genName) return false;
  if (!G.wildPool.includes(genName)) return false;
  const cdData = G.wildRecruitCD[genName];
  if (cdData && cdData.until > G.turn) return false;
  const failCount = cdData?.failCount || 0;
  const cost = 1500 + failCount * 500;
  if ((G.factions[fid].res.gold || 0) < cost) return false;
  return _doRecruitWild(genName, fid, true);
}

function _execPoach(fid, act) {
  const genName = act.general;
  if (!genName) return false;
  const rec = G.recruitableGens?.[genName];
  if (!rec || rec.fid === fid) return false;
  const gen = GEN_MAP[genName]; // ★ v167fix #33
  if (!gen) return false;
  const topStat = Math.max(gen.com, gen.war, gen.int, gen.pol, gen.cha);
  // D-064 fix: 加 (1 + _techPoachCost) 科技修正（玩家路径 poachGen L1636 已用，AI 路径漏）
  const _techPoachCost = getTechEffect(fid, 'poachCostMult');
  const cost = Math.floor((topStat >= 90 ? 3000 : 1500) * (1 + _techPoachCost));
  if ((G.factions[fid].res.gold || 0) < cost) return false;
  _aiDoPoach(genName, fid, rec.fid, cost);
  return true;
}

// ════════════════════════════

function _execResearch(fid, act) {
  const techId = act.tech;
  const genName = act.general;
  if (!techId || !genName) { console.warn('[ClaudeAI] research: 缺tech或general', act); return false; }
  const tech = G.factions[fid]?._tech;
  if (!tech) { console.warn('[ClaudeAI] research: _tech不存在', fid); return false; }
  if (tech.current) { console.warn('[ClaudeAI] research: 已有研究进行中', tech.current.techId); return false; }
  const def = TECH_TREE[techId];
  if (!def) { console.warn('[ClaudeAI] research: 科技ID无效', techId); return false; }
  if (tech.researched.has(techId)) { console.warn('[ClaudeAI] research: 已研究过', techId); return false; }
  if (!def.prereq.every(p => tech.researched.has(p))) { console.warn('[ClaudeAI] research: 前置未满足', techId, def.prereq); return false; }
  if (!canAffordTech(fid, techId)) { console.warn('[ClaudeAI] research: 资源不足', techId); return false; }
  const gen = (G.generals[fid] || []).find(g => g.name === genName);
  if (!gen) { console.warn('[ClaudeAI] research: 武将不存在', genName); return false; }
  if (_genDeployed(genName, fid)) { console.warn('[ClaudeAI] research: 武将已部署', genName); return false; }
  if (Object.values(G.cities).some(c => c.fac === fid && c.prefect === genName)) { console.warn('[ClaudeAI] research: 武将是太守', genName); return false; }
  return startTechResearch(fid, techId, genName);
}

// ════════════════════════════
// 外交指令执行（参数化版，不依赖G.playerFac）

function _execDeclareWar(fid, act) {
  const target = _resolveFacId(act.target);
  if (!target || target === fid) return false;
  const k = `${fid}-${target}`, d = G.diplo[k];
  if (!d || d.status !== 'neutral') return false;
  // CD检查
  const cdKey = `_diploCD_${fid}_${target}`;
  if (G[cdKey] && G[cdKey] > 0) return false;
  // 宣称
  const claimType = act.claim || null;
  d.status = 'enemy'; d._warDeclaredTurn = G.turn;
  const rev = G.diplo[`${target}-${fid}`];
  if (rev) { rev.status = 'enemy'; rev._warDeclaredTurn = G.turn; }
  addDiplo(fid, target, -15);
  G[cdKey] = 15;
  // 背刺/反复检测
  if (d._brokenAllyTurn != null && (G.turn - d._brokenAllyTurn) <= 6) {
    d._betrayal = true; if (rev) rev._betrayal = true;
    applyReputationPenalty(fid, 'betray');
  }
  if (d._peaceTurn != null && (G.turn - d._peaceTurn) <= 3) applyReputationPenalty(fid, 'relapse');
  applyWarDeclarationEffects(fid, target, claimType);
  _syncAllyWarStatus(fid, target);
  applyEthosShock(fid, 'strategy', 6, '主动宣战');
  const ct = claimType ? CLAIM_TYPES[claimType] : null;
  const claimLabel = ct ? `以【${ct.label}】` : '';
  log(`⚔️ [AI] ${FAC[fid]?.name}${claimLabel}向${FAC[target]?.name}宣战！`, 'diplo');
  _recordWarJournal(fid, `向${FAC[target]?.name}宣战${claimLabel}`); // ★ v159fix
  return true;
}

function _execProposeAlliance(fid, act) {
  const target = _resolveFacId(act.target);
  if (!target || target === fid) return false;
  const k = `${fid}-${target}`, d = G.diplo[k];
  if (!d || d.status !== 'neutral') return false;
  if (d.rel < 75) return false;
  const fac = G.factions[fid];
  if (fac.res.gold < 500) return false;
  safeSub(fac.res, 'gold', 500);
  const acceptRate = Math.max(0.02, peaceWillingness(target, fid) * 0.6 - _repPenaltyFactor(fid));
  if (Math.random() < acceptRate) {
    d.status = 'ally';
    const rev = G.diplo[`${target}-${fid}`];
    if (rev) rev.status = 'ally';
    log(`🤝 [AI] ${FAC[fid]?.name}与${FAC[target]?.name}结盟！`, 'diplo');
    applyEthosShock(fid, 'strategy', -2, '结盟');
  } else {
    fac.res.gold += 250;
    addDiplo(fid, target, 2);
    log(`❌ [AI] ${FAC[target]?.name}暂不接受${FAC[fid]?.name}的结盟请求`, 'diplo');
  }
  return true;
}

function _execBreakAlliance(fid, act) {
  const target = _resolveFacId(act.target);
  if (!target || target === fid) return false;
  const k = `${fid}-${target}`, d = G.diplo[k];
  if (!d || d.status !== 'ally') return false;
  d.status = 'neutral'; d._brokenAllyTurn = G.turn;
  const rev = G.diplo[`${target}-${fid}`];
  if (rev) { rev.status = 'neutral'; rev._brokenAllyTurn = G.turn; }
  addDiplo(fid, target, -10);
  log(`💔 [AI] ${FAC[fid]?.name}解除与${FAC[target]?.name}的联盟`, 'diplo');
  return true;
}

function _execDiploGift(fid, act) {
  const target = _resolveFacId(act.target);
  const level = act.level || 1;
  if (!target || target === fid) return false;
  const costs = { 1: 500, 2: 1000, 3: 2000 };
  const baseGains = { 1: 5, 2: 10, 3: 18 };
  const cost = costs[level] || 500;
  const fac = G.factions[fid];
  if (fac.res.gold < cost) return false;
  const _geBuff = fac._postBuffs?.giftEffect || 0;
  const gain = Math.max(1, Math.round((baseGains[level] || 5) * _repGiftMult(fid) * (1 + _geBuff)));
  safeSub(fac.res, 'gold', cost);
  addDiplo(fid, target, gain);
  log(`🎁 [AI] ${FAC[fid]?.name}遣使送礼予${FAC[target]?.name}，友好度+${gain}`, 'diplo');
  return true;
}

function _execSchemeScout(fid, act) {

  const targetCity = G.cities[cityId];
  if (!targetCity || targetCity.fac === fid) { console.warn('[ClaudeAI] scout: 目标是己方城市', cityId); return false; }
  if (!G.strategyCD?.[fid] || G.strategyCD[fid].scout > 0) { console.warn('[ClaudeAI] scout: CD中', G.strategyCD?.[fid]?.scout); return false; }
  const fac = G.factions[fid];
  const _zhangsongDiscount = hasFacGen(fid, '张松') && genHasOffice('张松', fid);
  const cost = _zhangsongDiscount ? 400 : 800;
  if (fac.res.gold < cost) { console.warn('[ClaudeAI] scout: 金不足', fac.res.gold, '<', cost); return false; }
  const myCities = Object.values(G.cities).filter(c => c.fac === fid);
  const isAdj = myCities.some(c => (ROAD_ADJ[c.id] || []).includes(cityId));
  if (!isAdj) { console.warn('[ClaudeAI] scout: 目标不相邻', cityId, '己方城:', myCities.map(c=>c.id).join(',')); return false; }
  if ((G.scoutReveals || []).some(sr => sr.fid === fid && sr.cityId === cityId && sr.expiresAt > G.turn)) return false;
  safeSub(fac.res, 'gold', cost);
  const rate = _strategyRate(fid, 0.75);
  if (Math.random() < rate) {
    if (!G.scoutReveals) G.scoutReveals = [];
    G.scoutReveals.push({ fid, cityId, expiresAt: G.turn + 3 });

  G.strategyCD[fid].scout = 6;
  return true;
}

function _execMove(fid, act) {
  const unit = _findUnit(fid, act.leader);
  if (!unit) { console.warn('[ClaudeAI] move: 找不到部队', act.leader, `| ${FAC[fid]?.name}部队:`, G.units.filter(u=>u.fac===fid).map(u=>u.squads.map(s=>s.genName).join('+')).join(', ')); return false; }
  if (unit.mobilizingTurns > 0) { console.warn('[ClaudeAI] move: 整备中', act.leader, unit.mobilizingTurns, '旬'); return false; }
  const cityId = _resolveCityId(act.target);
  if (!cityId) { console.warn('[ClaudeAI] move: 目标城市无效', act.target); return false; }
  const cdef = CITY_MAP[cityId];
  if (!cdef) { console.warn('[ClaudeAI] move: CITY_MAP无此城', cityId); return false; }
  const troopType = getMainTroopType(unit);
  const path = hexAstar(unit.hq, unit.hr, cdef.q, cdef.r, troopType, fid);
  if (!path) { console.warn('[ClaudeAI] move: 寻路失败', act.leader, '→', cityId); return false; }
  unit.hexPath = path.path.slice(1);
  unit.movePath = [cityId];
  unit.status = 'march';
  unit._aiRole = act.type === 'attack' ? 'attack' : (act.role || 'move'); // ★ v159fix: attack type直接标记进攻意图
  unit._aiTarget = cityId;
  return true;
}

function _execRecruit(fid, act) {
  // Claude指定城市和武将征兵
  const cityId = _resolveCityId(act.city);
  const city = G.cities[cityId];
  if (!city || city.fac !== fid) { console.warn('[ClaudeAI] recruit: 城市无效或非己方', act.city); return false; }
  if (city.recruitedThisTurn) { console.warn('[ClaudeAI] recruit: 本旬已征兵', act.city); return false; }
  if (G.units.filter(u => u.fac === fid).length >= (typeof MAX_FIELD_UNITS_ABS !== 'undefined' ? MAX_FIELD_UNITS_ABS : 12)) { console.warn('[ClaudeAI] recruit: 部队数达上限'); return false; }
  // ★ v158: 未指定武将时自动选最高统帅的闲置武将
  let genName = act.general;
  if (!genName) {
    const idle = (G.generals[fid] || []).filter(g => {
      if (g.role === 'ruler') return false;
      if (_genDeployed(g.name, fid)) return false;
      if (Object.values(G.cities).some(c => c.fac === fid && c.prefect === g.name)) return false;
      if (G.factions[fid]?.strategist === g.name) return false;
      if (G.factions[fid]?._tech?.current?.genName === g.name) return false;
      return true;
    }).sort((a, b) => b.com - a.com);
    genName = idle[0]?.name;
  }
  if (!genName || !_genInFac(genName, fid)) { console.warn('[ClaudeAI] recruit: 无可用武将', genName); return false; }
  if (_genDeployed(genName, fid)) { console.warn('[ClaudeAI] recruit: 武将已部署', genName); return false; }
  // 检查太守/研究中也不能征
  if (Object.values(G.cities).some(c => c.fac === fid && c.prefect === genName)) { console.warn('[ClaudeAI] recruit: 武将是太守', genName); return false; }
  const tech = G.factions[fid]?._tech;
  if (tech?.current?.genName === genName) { console.warn('[ClaudeAI] recruit: 武将在研究中', genName); return false; }
  const troopType = act.troop_type || 'light';
  const troops = Math.min(act.troops || 3000, Math.floor(city.pop * 0.10), 5000);
  if (troops < 500) { console.warn('[ClaudeAI] recruit: 人口不足', city.name, city.pop); return false; }
  const goldCost = Math.ceil(troops * 1200 / 5000);
  const fac = G.factions[fid];
  if (fac.res.gold < goldCost) { console.warn('[ClaudeAI] recruit: 金钱不足', fac.res.gold, '<', goldCost); return false; }
  // 兵种资源检查
  const matCost = calcSlotMatCost(troopType, troops);
  if (!canAffordMat(fid, matCost)) { console.warn('[ClaudeAI] recruit: 材料不足', troopType, matCost, '| 资源:', JSON.stringify(fac.res)); return false; }
  safeSub(fac.res, 'gold', goldCost);
  deductMat(fid, matCost);
  city.pop -= troops;
  city.recruitedThisTurn = true;
  const squads = [{ genName, type: troopType, troops, maxTroops: troops, morale: 70 }];
  const unit = createUnit({ fac: fid, spawnCityId: cityId, squads });
  // D-035 fix: 设 unit.level（v116 特色兵种 eliteLevel + 玩家路径同公式 v181.html:9314-9315）
  // createUnit 默认 level=1 → AI 永远 Lv.1 出厂；玩家路径 max(eliteLevel, getInitLevel(city))
  const _eliteLv = TROOP_TYPES[troopType]?.eliteLevel || 0;
  unit.level = _eliteLv > 0 ? Math.max(_eliteLv, getInitLevel(city)) : getInitLevel(city);
  unit.mobilizingTurns = 3;
  unit._apRemaining = 0;
  G.units.push(unit);
  log(`⚔ [AI] ${FAC[fid]?.name} ${genName}于${city.name}征兵${fmt(troops)}${troopType}，3旬整备`, 'economy');
  return true;
}

// ★ v159fix: 休整遣散（大城驻扎恢复士气，部分遣散兵员回人口）
function _execBillet(fid, act) {
  const unit = _findUnit(fid, act.leader);
  if (!unit) return false;
  const cityId = _resolveCityId(act.city);
  const city = G.cities[cityId];
  if (!city || city.fac !== fid) return false;
  const cdef = CITY_MAP[cityId];
  if (!cdef || cdef.size === 'small') return false; // 仅大/中城可休整
  const loc = getUnitNodeId(unit);
  if (loc !== cityId) return false; // 部队须在该城
  // 遣散30%兵力回人口，剩余部队驻扎（自动享受城内补员+士气恢复）
  const totalTroops = getUnitTroops(unit);
  const disbandRatio = 0.3;
  const disbandCount = Math.floor(totalTroops * disbandRatio);
  unit.squads.forEach(sq => {
    const lose = Math.floor(sq.troops * disbandRatio);
    sq.troops = Math.max(0, sq.troops - lose);
  });
  city.pop += Math.floor(disbandCount * 0.6);
  unit.status = 'garrison';
  unit.hexPath = [];
  log(`🏠 [AI] ${FAC[fid]?.name} ${act.leader}于${city.name}休整屯田，遣散${fmt(disbandCount)}人`, 'economy');
  return true;
}

function _populateApiModal() {
  const fmt = document.getElementById('aiFormatSelect');
  const ep = document.getElementById('aiEndpointInput');
  const sel = document.getElementById('aiModelSelect');
  const inp = document.getElementById('aiModelInput');
  const key = document.getElementById('aiKeyInput');
  if (fmt) fmt.value = _claudeAI.apiFormat || 'anthropic';
  if (ep) ep.value = _claudeAI.endpoint || 'https://api.anthropic.com/v1/messages';
  if (sel) {
    // Check if current model matches a preset
    const opts = [...sel.options].map(o => o.value);
    if (opts.includes(_claudeAI.model)) {
      sel.value = _claudeAI.model;
      if (inp) inp.style.display = 'none';
    } else {
      sel.value = '_custom';
      if (inp) { inp.style.display = ''; inp.value = _claudeAI.model || ''; }
    }
  }
  if (key) key.value = _claudeAI.apiKey || '';
}
function _onModelSelectChange() {
  const sel = document.getElementById('aiModelSelect');
  const inp = document.getElementById('aiModelInput');
  if (!sel || !inp) return;
  if (sel.value === '_custom') { inp.style.display = ''; inp.focus(); }
  else { inp.style.display = 'none'; }
}
function _onApiFormatChange() {
  const fmt = document.getElementById('aiFormatSelect')?.value;
  const ep = document.getElementById('aiEndpointInput');
  const sel = document.getElementById('aiModelSelect');
  const inp = document.getElementById('aiModelInput');
  if (fmt === 'openai') {
    if (ep && (!ep.value || ep.value.includes('anthropic.com'))) ep.value = 'https://openrouter.ai/api/v1/chat/completions';
    if (sel) { sel.value = 'anthropic/claude-sonnet-4'; if (inp) inp.style.display = 'none'; }
  } else {
    if (ep && (!ep.value || ep.value.includes('openrouter') || ep.value.includes('chat/completions'))) ep.value = 'https://api.anthropic.com/v1/messages';
    if (sel) { sel.value = '_custom'; if (inp) { inp.style.display = ''; inp.value = 'claude-sonnet-4-20250514'; } }
  }
}
function _confirmApiKey() {
  const key = (document.getElementById('aiKeyInput')?.value || '').trim();
  const endpoint = (document.getElementById('aiEndpointInput')?.value || '').trim();
  const sel = document.getElementById('aiModelSelect');
  const inp = document.getElementById('aiModelInput');
  const model = (sel?.value === '_custom' ? (inp?.value || '').trim() : sel?.value) || '';
  const fmt = document.getElementById('aiFormatSelect')?.value || 'anthropic';
  if (!key) { showNotif('请输入 API Key', 'warn'); return; }
  if (!endpoint) { showNotif('请输入 API 地址', 'warn'); return; }
  if (!model) { showNotif('请选择或输入模型', 'warn'); return; }
  _claudeAI.apiKey = key;
  _claudeAI.endpoint = endpoint;
  _claudeAI.apiFormat = fmt;
  _claudeAI.model = model;
  _claudeAI.enabled = true;
  document.getElementById('aiKeyModal').style.display = 'none';
  _updateAIToggleBtn();
  const fmtLabel = fmt === 'openai' ? 'OpenAI兼容' : 'Anthropic';
  log(`🤖 AI 已启用（${fmtLabel}）— ${endpoint.replace(/https?:\/\//, '').split('/')[0]}`, 'event');
  showNotif('🤖 AI 已启用！下一旬生效', 'ok');
}
function _updateAIToggleBtn() {
  const btn = document.getElementById('btnClaudeAI');

    btn.classList.add('ai-on');

    btn.textContent = '🤖 规则AI';
    btn.classList.remove('ai-on');

}
function enableClaudeAI() {
  _claudeAI.enabled = true;

}

/** ── v158: API连接测试（控制台输入 pingClaudeAPI()） ── */
async function pingClaudeAPI() {
  console.log(`\n${'='.repeat(60)}`);
  console.log('[ClaudeAI PING] API连接诊断');
  console.log(`${'='.repeat(60)}`);
  console.log('配置:', {
    enabled: _claudeAI.enabled,
    format: _claudeAI.apiFormat,
    endpoint: _claudeAI.endpoint,
    model: _claudeAI.model,
    hasKey: !!_claudeAI.apiKey,
    keyPrefix: _claudeAI.apiKey ? _claudeAI.apiKey.slice(0, 12) + '...' : '(空)',
  });

  if (!_claudeAI.apiKey) {
    console.error('❌ 未设置 API Key。请先通过 🤖 按钮设置，或控制台输入 setClaudeKey("sk-...")');
    return;
  }
  if (!_claudeAI.endpoint) {
    console.error('❌ 未设置 API 地址');
    return;
  }

  const fmt = _claudeAI.apiFormat || 'anthropic';
  let body, headers = { 'Content-Type': 'application/json' };

  if (fmt === 'openai') {
    headers['Authorization'] = 'Bearer ' + _claudeAI.apiKey;
    body = JSON.stringify({
      model: _claudeAI.model,
      max_tokens: 20,
      messages: [{ role: 'user', content: '回复OK' }],
    });
  } else {
    headers['x-api-key'] = _claudeAI.apiKey;
    headers['anthropic-version'] = '2023-06-01';
    body = JSON.stringify({
      model: _claudeAI.model,
      max_tokens: 20,
      messages: [{ role: 'user', content: '回复OK' }],
    });
  }

  console.log(`[PING] 发送请求到 ${_claudeAI.endpoint} (${fmt}格式, model=${_claudeAI.model})...`);
  const t0 = performance.now();

  try {
    const r = await fetch(_claudeAI.endpoint, { method: 'POST', headers, body });
    const elapsed = Math.round(performance.now() - t0);
    console.log(`[PING] HTTP ${r.status} ${r.statusText}  (${elapsed}ms)`);

    const text = await r.text();
    if (!r.ok) {
      console.error(`❌ API返回错误 ${r.status}:\n${text.slice(0, 500)}`);
      if (r.status === 401) console.error('→ Key无效或过期，请检查');
      if (r.status === 403) console.error('→ 权限不足，可能是CORS或Key权限问题');
      if (r.status === 404) console.error('→ 地址错误，请检查endpoint');
      if (r.status === 429) console.error('→ 限流，请稍后再试');
      return;
    }

    let data;
    try { data = JSON.parse(text); } catch { console.error('❌ 返回非JSON:', text.slice(0, 300)); return; }

    // 提取回复文本
    let reply = '';
    if (fmt === 'openai') {
      reply = data.choices?.[0]?.message?.content || '(空)';
    } else {
      reply = (data.content || []).map(c => c.text || '').join('') || '(空)';
    }

    console.log(`✅ API连接成功！`);
    console.log(`   回复: "${reply.trim()}"`);
    console.log(`   耗时: ${elapsed}ms`);
    if (data.usage) console.log(`   token: ${JSON.stringify(data.usage)}`);
    console.log(`\n💡 现在可以开游戏点下一旬测试了。如果开启了AI但没反应，检查控制台是否有 [ClaudeAI] 日志。`);

    // 检查游戏状态
    if (typeof G === 'undefined' || !G.factions) {
      console.warn('⚠️ 游戏尚未开始（G.factions不存在），请先开始游戏再测试AI决策');
    } else {
      const aiFacs = ALL_FACS.filter(f => f !== G.playerFac && !G.factions[f]?._eliminated);
      const eligible = aiFacs.filter(f => CITIES_DEF.filter(c => G.cities[c.id]?.fac === f).length >= 2);
      console.log(`   当前AI势力: ${aiFacs.map(f=>FAC[f]?.name).join(', ')}`);
      console.log(`   满足2城门槛: ${eligible.map(f=>FAC[f]?.name).join(', ') || '(无——全部单城，不会调API)'}`);
      if (eligible.length === 0) console.warn('⚠️ 所有AI势力都是单城，Claude AI不会被调用。这是v158单城门槛的预期行为。');
    }

  } catch (e) {
    const elapsed = Math.round(performance.now() - t0);
    console.error(`❌ 网络错误 (${elapsed}ms):`, e.message);
    if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
      console.error('→ 可能原因: CORS被拦截 / 网络不通 / endpoint地址错误');
      console.error('→ 本地浏览器需安装CORS插件（如 "Allow CORS"），或使用支持CORS的中转');
    }
  }
}

<script>
(function(){
  'use strict';

  // ── 激活检测 ─────────────────────────────────────────
  if(!location.hash || !location.hash.includes('debug')) return; // 零代码执行

  // ── 命名空间 ─────────────────────────────────────────
  const _debug = window._debug = {
    version: 'v176-A5',
    ready: false,
    teleportMode: null,    // null | {unitId}
    fastForwardActive: false,
  };

  // ── Toast ────────────────────────────────────────────
  function _dbgToast(msg, duration){
    duration = duration || 2000;
    let t = document.getElementById('_dbg_toast');
    if(!t){
      t = document.createElement('div');
      t.id = '_dbg_toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.style.opacity = '0'; }, duration);
  }
  _debug.toast = _dbgToast;

  // ── 安全调用包装 ─────────────────────────────────────
  function _dbgSafe(fn, label){
    try{
      fn();
      if(typeof renderAll === 'function') renderAll();
      if(typeof invalidateFogCache === 'function') invalidateFogCache();
      if(label) _dbgToast('✓ ' + label);
    }catch(e){
      console.error('[Debug] '+label+':', e);
      _dbgToast('✗ ' + (label||'error') + ': ' + e.message, 4000);
    }
  }
  _debug.safe = _dbgSafe;

  // ── 数值输入解析 ─────────────────────────────────────
  // '' → null（不修改）, '+5000' → {delta:5000}, '-200' → {delta:-200}, '8000' → {set:8000}
  function _dbgParseNum(s){
    if(s == null) return null;
    s = String(s).trim();
    if(!s) return null;
    if(/^[+\-]/.test(s)){
      const n = Number(s);
      if(!Number.isFinite(n)) return null;
      return {delta: n};
    }
    const n = Number(s);
    if(!Number.isFinite(n)) return null;
    return {set: n};
  }
  function _dbgApplyNum(cur, parsed){
    if(!parsed) return cur;
    if(parsed.set != null) return parsed.set;
    if(parsed.delta != null) return (cur || 0) + parsed.delta;
    return cur;
  }

  // ── 等待G就绪 ────────────────────────────────────────
  function _dbgWaitForGame(maxWaitMs, cb){
    const start = Date.now();
    (function poll(){
      if(typeof G !== 'undefined' && G && G.factions && Object.keys(G.factions).length > 0){
        cb(true);
        return;
      }
      if(Date.now() - start > maxWaitMs){
        cb(false);
        return;
      }
      setTimeout(poll, 200);
    })();
  }

  // ── 主初始化 ─────────────────────────────────────────
  function _dbgInit(){
    _dbgBuildUI();
    _dbgRefreshAll();
    // 监听ESC退出modal模式
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        if(_debug.teleportMode){ _dbgCancelTeleport(); }
      }
    });
    // 选中部队变化时刷新部队section
    setInterval(function(){
      if(!_debug.ready) return;
      const panel = document.getElementById('_dbg_panel');
      if(!panel || !panel.classList.contains('dbg-visible')) return;
      _dbgRefreshUnitSection();
      _dbgRefreshTurnDisplay();
    }, 600);
    _debug.ready = true;
    console.log('[Debug] Panel ready. URL #debug detected. 点击右上角 🔧 DEBUG 展开。');
  }

  document.addEventListener('DOMContentLoaded', function(){
    _dbgWaitForGame(15000, function(ok){
      if(!ok){
        console.error('[Debug] G未在15秒内就绪，Debug面板未启用。请先在标题菜单选择剧本进入游戏。');
        // 加一个重试按钮的角标
        const corner = document.createElement('div');
        corner.id = '_dbg_corner';
        corner.textContent = '🔧 DEBUG (待开局)';
        corner.title = '游戏尚未开始。开始游戏后点此重试。';
        corner.onclick = function(){
          _dbgWaitForGame(2000, function(ok2){
            if(ok2){ corner.remove(); _dbgInit(); }
            else { _dbgToast('游戏仍未就绪', 2000); }
          });
        };
        document.body.appendChild(corner);
        return;
      }
      _dbgInit();
    });
  });

  // ════════════════════════════════════════════════════
  // UI构造
  // ════════════════════════════════════════════════════

  function _dbgBuildUI(){
    // 角标
    const corner = document.createElement('div');
    corner.id = '_dbg_corner';
    corner.textContent = '🔧 DEBUG';
    corner.title = '点击展开/折叠Debug面板';
    corner.onclick = function(){
      const p = document.getElementById('_dbg_panel');
      if(p) p.classList.toggle('dbg-visible');
    };
    document.body.appendChild(corner);

    // 主面板
    const panel = document.createElement('div');
    panel.id = '_dbg_panel';
    panel.innerHTML = ''
      + _dbgSectionHTML('rs', '资源 / 关系', _dbgRSHtml())
      + _dbgSectionHTML('un', '部队操控', '<div id="_dbg_unit_body">'+_dbgUnitHtml()+'</div>')
      + _dbgSectionHTML('ev', '事件触发', _dbgEventHtml())
      + _dbgSectionHTML('tt', '快进 / AI托管', _dbgTimeHtml())
      + _dbgSectionHTML('sv', '存档', _dbgSaveHtml());
    document.body.appendChild(panel);

    // 绑定section展开
    panel.querySelectorAll('.dbg-section-header').forEach(function(h){
      h.addEventListener('click', function(){
        h.parentElement.classList.toggle('dbg-open');
      });
    });

    // 绑定每个section的事件
    _dbgBindRS();
    _dbgBindUnit();
    _dbgBindEvent();
    _dbgBindTime();
    _dbgBindSave();
  }

  function _dbgSectionHTML(id, title, body){
    return '<div class="dbg-section" data-sec="'+id+'">'
      + '<div class="dbg-section-header"><span class="dbg-section-arrow"></span>'+title+'</div>'
      + '<div class="dbg-section-body">'+body+'</div>'
      + '</div>';
  }

  // 势力下拉选项
  function _dbgFacOptions(){
    return ALL_FACS.map(function(f){
      return '<option value="'+f+'">'+(FAC[f]?.name||f)+'</option>';
    }).join('');
  }

  // ════════════════════════════════════════════════════
  // Section: 资源/关系
  // ════════════════════════════════════════════════════

  function _dbgRSHtml(){
    const facOpts = _dbgFacOptions();
    return ''

  function _dbgBindRS(){
    document.getElementById('_dbg_rs_apply').onclick = function(){
      const fid = document.getElementById('_dbg_rs_fac').value;
      _dbgSafe(function(){
        const fac = G.factions[fid];
        if(!fac || !fac.res) throw new Error('势力'+fid+'不存在');
        const fields = [['gold','金'],['wood','木'],['iron','铁'],['horses','马']];
        const inputIds = {gold:'_dbg_rs_gold', wood:'_dbg_rs_wood', iron:'_dbg_rs_iron', horses:'_dbg_rs_horse'};
        const changed = [];
        fields.forEach(function(p){
          const k = p[0], label = p[1];
          const raw = document.getElementById(inputIds[k]).value;
          const parsed = _dbgParseNum(raw);
          if(parsed){
            fac.res[k] = Math.max(0, Math.floor(_dbgApplyNum(fac.res[k], parsed)));
            changed.push(label);
          }
        });
        // 信誉
        const repRaw = document.getElementById('_dbg_rs_rep').value;
        const repP = _dbgParseNum(repRaw);
        if(repP){
          if(!G.reputation) G.reputation = {};
          G.reputation[fid] = Math.max(0, Math.min(100, _dbgApplyNum(G.reputation[fid]||REPUTATION_DEFAULT, repP)));
          changed.push('信誉');
        }
        // 粮：所有该势力城+N
        const foodRaw = document.getElementById('_dbg_rs_food').value;
        const foodP = _dbgParseNum(foodRaw);
        if(foodP){
          let cnt = 0;
          Object.values(G.cities||{}).forEach(function(c){
            if(c.fac === fid){
              c.storage = Math.max(0, Math.floor(_dbgApplyNum(c.storage||0, foodP)));
              cnt++;
            }
          });
          changed.push('粮('+cnt+'城)');
        }
        if(!changed.length) throw new Error('没有有效输入');
      }, fid+': '+ '已应用');
    };

    document.getElementById('_dbg_rs_max').onclick = function(){
      _dbgSafe(function(){
        ALL_FACS.forEach(function(fid){
          const fac = G.factions[fid];
          if(!fac || !fac.res) return;
          fac.res.gold = (fac.res.gold||0) + 10000;
        });
        Object.values(G.cities||{}).forEach(function(c){
          if(ALL_FACS.includes(c.fac)) c.storage = (c.storage||0) + 5000;
        });
      }, '一键满血');
    };

    document.getElementById('_dbg_rs_setrel').onclick = function(){
      const a = document.getElementById('_dbg_rs_a').value;
      const b = document.getElementById('_dbg_rs_b').value;
      const status = document.getElementById('_dbg_rs_status').value;
      const relP = _dbgParseNum(document.getElementById('_dbg_rs_rel').value);
      const rel = relP ? (relP.set != null ? relP.set : 50) : 50;
      _dbgSafe(function(){
        if(a === b) throw new Error('两势力相同');
        _dbgSetRelation(a, b, status, rel);
      }, FAC[a]?.name+'↔'+FAC[b]?.name+'='+status+'/'+rel);
    };

    document.getElementById('_dbg_rs_warall').onclick = function(){
      _dbgSafe(function(){
        const player = G.playerFac;
        ALL_FACS.forEach(function(f){
          if(f !== player) _dbgSetRelation(f, player, 'enemy', 0);
        });
      }, '所有AI对玩家宣战');
    };

    document.getElementById('_dbg_rs_neutral').onclick = function(){
      _dbgSafe(function(){
        ALL_FACS.forEach(function(a){
          ALL_FACS.forEach(function(b){
            if(a !== b) _dbgSetRelation(a, b, 'neutral', 30);
          });
        });
      }, '全势力中立');
    };
  }

  function _dbgSetRelation(a, b, status, rel){
    const k1 = a+'-'+b, k2 = b+'-'+a;
    if(!G.diplo) G.diplo = {};
    if(!G.diplo[k1]) G.diplo[k1] = {};
    if(!G.diplo[k2]) G.diplo[k2] = {};
    G.diplo[k1].status = status;
    G.diplo[k2].status = status;
    G.diplo[k1].rel = rel;
    G.diplo[k2].rel = rel;
    if(status === 'enemy'){
      G.diplo[k1]._warDeclaredTurn = G.turn;
      G.diplo[k2]._warDeclaredTurn = G.turn;
    }
  }

  function _dbgAllUnitOptions(excludeFac){
    if(typeof G === 'undefined' || !G.units) return '<option value="">(无部队)</option>';
    const opts = G.units.filter(function(u){
      return excludeFac ? u.fac !== excludeFac : true;
    }).map(function(u){
      const facName = FAC[u.fac]?.name || u.fac;
      const main = u.squads?.[0]?.genName || '?';
      const troops = (u.squads||[]).reduce(function(s,sq){return s+(sq.troops||0);}, 0);
      return '<option value="'+u.id+'">['+facName+'] '+main+' ('+troops+', '+u.status+')</option>';
    }).join('');
    return opts || '<option value="">(无可选部队)</option>';
  }

  function _dbgGetSelUnit(){
    if(typeof G === 'undefined' || !G.selUnitId) return null;
    return (G.units||[]).find(function(u){ return u.id === G.selUnitId; }) || null;
  }

  function _dbgRefreshUnitSection(){
    const body = document.getElementById('_dbg_unit_body');
    if(!body) return;
    // 仅在选中状态变化时重建,避免破坏正在输入的字段
    const u = _dbgGetSelUnit();
    const lastId = body.dataset.unitId || '';
    const curId = u ? u.id : '';
    if(lastId === curId) return;
    body.innerHTML = _dbgUnitHtml();
    body.dataset.unitId = curId;
    _dbgBindUnit();
  }

  function _dbgRefreshGenOptions(){
    const facSel = document.getElementById('_dbg_un_fac');
    const genSel = document.getElementById('_dbg_un_gen');
    if(!facSel || !genSel) return;
    const fid = facSel.value;
    // 已在squad中的武将
    const inSquad = new Set();
    (G.units||[]).forEach(function(u){
      (u.squads||[]).forEach(function(sq){ if(sq.genName) inSquad.add(sq.genName); });
    });
    const gens = (G.generals?.[fid] || []).filter(function(g){
      return g && g.name && !inSquad.has(g.name);
    });

      return '<option value="'+g.name+'">'+g.name+' (战'+g.war+'/统'+g.com+')</option>';
    }).join('') || '<option value="">(无可用武将)</option>';
